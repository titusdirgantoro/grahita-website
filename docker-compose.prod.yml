# Overlay produksi.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Perbedaan dari pengembangan:
#   - Caddy memakai domain asli + TLS otomatis (port 80/443)
#   - Mailpit tidak dipakai; SMTP mengarah ke Gmail
#   - Postgres & MinIO tidak mengekspos port ke publik
#   - API tidak mengekspos port langsung (hanya lewat Caddy)

services:
  postgres:
    ports: !override []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?wajib diisi di environment produksi}
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=16MB"

  minio:
    ports: !override []

  mailpit:
    profiles: ["dev-only"]   # tidak ikut jalan di produksi

  api:
    ports: !override []
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      CUSTOMER_HOST: ${CUSTOMER_HOST:-grahita-branch.tiusclaw.com}
      ADMIN_HOST: ${ADMIN_HOST:-grahita-admin.tiusclaw.com}
      PUBLIC_SCHEME: https
      SESSION_SECURE: "true"
      CORS_ORIGINS: ""
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${SMTP_USER:?wajib diisi}
      SMTP_PASS: ${SMTP_PASS:?wajib diisi}
      MAIL_FROM: ${MAIL_FROM:-no-reply@grahita.id}

  worker:
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${SMTP_USER:?wajib diisi}
      SMTP_PASS: ${SMTP_PASS:?wajib diisi}

  web:
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CUSTOMER_HOST: ${CUSTOMER_HOST:-grahita-branch.tiusclaw.com}
      ADMIN_HOST: ${ADMIN_HOST:-grahita-admin.tiusclaw.com}
    volumes:
      - ./infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  caddydata:
  caddyconfig:
