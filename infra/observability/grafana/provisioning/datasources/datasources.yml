# Sumber data Grafana (Architecture.md §8).
apiVersion: 1

datasources:
  - name: Prometheus
    # uid EKSPLISIT: dasbor yang diprovisioning merujuk uid ini; tanpa uid
    # eksplisit Grafana membuat uid acak dan panel dasbor kehilangan sumber data.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 30s
      httpMethod: POST
    editable: false
    # Tanpa kredensial: Prometheus internal Compose.

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
    editable: false
