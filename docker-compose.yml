name: grahita

# Lingkungan pengembangan lokal (Architecture.md §5.3).
#
# Domain keputusan user untuk produksi:
#   customer -> grahita-branch.tiusclaw.com
#   admin    -> grahita-admin.tiusclaw.com
# Di lokal kedua SPA disajikan di port berbeda (8080/8081) dengan Caddy tetap
# mem-proxy /api/* ke service api sehingga API selalu same-origin.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grahita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grahita}
      POSTGRES_DB: ${POSTGRES_DB:-grahita}
      TZ: Asia/Jakarta
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grahita} -d ${POSTGRES_DB:-grahita}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-grahita}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-grahita123}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # konsol web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Membuat bucket sekali jalan lalu berhenti.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-grahita} ${S3_SECRET_KEY:-grahita123} &&
      mc mb --ignore-existing local/${S3_BUCKET:-grahita} &&
      echo 'bucket siap'
      "
    restart: "no"

  # Penangkap email untuk pengembangan: UI di http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Render HTML -> PDF (invoice & surat jalan).
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--chromium-disable-javascript=false"]

  # Menjalankan migrasi goose + tabel River lalu berhenti.
  migrate:
    build:
      context: ./api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgres://${POSTGRES_USER:-grahita}:${POSTGRES_PASSWORD:-grahita}@postgres:5432/${POSTGRES_DB:-grahita}?sslmode=disable
    command: ["--mode=migrate"]
    restart: "no"

  # Data contoh untuk pengembangan. Jalankan: make seed SEED_PASSWORD=...
  seed:
    build:
      context: ./api
    profiles: ["tools"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgres://${POSTGRES_USER:-grahita}:${POSTGRES_PASSWORD:-grahita}@postgres:5432/${POSTGRES_DB:-grahita}?sslmode=disable
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    command: ["--mode=seed"]
    restart: "no"

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-grahita}:${POSTGRES_PASSWORD:-grahita}@postgres:5432/${POSTGRES_DB:-grahita}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CUSTOMER_HOST: ${CUSTOMER_HOST:-grahita-branch.tiusclaw.com}
      ADMIN_HOST: ${ADMIN_HOST:-grahita-admin.tiusclaw.com}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-grahita_session}
      SESSION_SECURE: "false"
      SESSION_IDLE: ${SESSION_IDLE:-8h}
      SESSION_ABSOLUTE: ${SESSION_ABSOLUTE:-720h}
      CSRF_ENABLED: ${CSRF_ENABLED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-grahita}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-grahita}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-grahita123}
      S3_USE_PATH_STYLE: "true"
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@grahita.id}
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "8088:8080"   # akses langsung ke API untuk debugging
    command: ["--mode=api"]
    healthcheck:
      test: ["CMD", "/app/server", "--mode=healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgres://${POSTGRES_USER:-grahita}:${POSTGRES_PASSWORD:-grahita}@postgres:5432/${POSTGRES_DB:-grahita}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@grahita.id}
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-15s}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-30s}
      # Di lokal outbox dipindai lebih sering supaya email Mailpit cepat muncul.
      OUTBOX_INTERVAL: ${OUTBOX_INTERVAL:-10s}
      # Cadangan terenkripsi (F1-21). Dibiarkan kosong secara bawaan supaya
      # lingkungan pengembangan tidak menjalankan pekerjaan cadangan sama
      # sekali; operasi nyatanya ada di infra/backup/README.md.
      BACKUP_TARGET: ${BACKUP_TARGET:-}
      BACKUP_TARGET_DIR: ${BACKUP_TARGET_DIR:-}
      BACKUP_RCLONE_BIN: ${BACKUP_RCLONE_BIN:-rclone}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      BACKUP_RCLONE_CONFIG: ${BACKUP_RCLONE_CONFIG:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_AGE_IDENTITY_FILE: ${BACKUP_AGE_IDENTITY_FILE:-}
      BACKUP_WORK_DIR: ${BACKUP_WORK_DIR:-/tmp/grahita-backup}
      BACKUP_RETENSI_HARIAN: ${BACKUP_RETENSI_HARIAN:-30}
      BACKUP_RETENSI_BULANAN: ${BACKUP_RETENSI_BULANAN:-12}
      BACKUP_WAL_DIR: ${BACKUP_WAL_DIR:-}
      BACKUP_JAM_WIB: ${BACKUP_JAM_WIB:-2}
      BACKUP_RESTORE_DSN: ${BACKUP_RESTORE_DSN:-}
    command: ["--mode=worker"]

  # Menyajikan hasil build kedua SPA dan mem-proxy /api/* ke service api
  # sehingga API same-origin di kedua host.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"   # Customer Portal -> http://localhost:8080
      - "8081:81"   # Admin Portal    -> http://localhost:8081
    environment:
      CUSTOMER_HOST: ${CUSTOMER_HOST:-grahita-branch.tiusclaw.com}
      ADMIN_HOST: ${ADMIN_HOST:-grahita-admin.tiusclaw.com}

volumes:
  pgdata:
  miniodata:
