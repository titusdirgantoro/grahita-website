name: grahita

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grahita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grahita}
      POSTGRES_DB: ${POSTGRES_DB:-grahita}
      TZ: Asia/Jakarta
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grahita} -d ${POSTGRES_DB:-grahita}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-grahita}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-grahita123}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # konsol web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Membuat bucket sekali jalan lalu berhenti.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-grahita} ${S3_SECRET_KEY:-grahita123} &&
      mc mb --ignore-existing local/${S3_BUCKET:-grahita} &&
      echo 'bucket siap'
      "
    restart: "no"

  # Penangkap email untuk development: UI di http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"   # UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Render HTML -> PDF (invoice & surat jalan)
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--chromium-disable-javascript=false"]

  # Menjalankan migrasi lalu berhenti. Service lain menunggu ini selesai.
  migrate:
    build:
      context: ./api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-grahita}:${POSTGRES_PASSWORD:-grahita}@postgres:5432/${POSTGRES_DB:-grahita}?sslmode=disable
    command: ["--mode=migrate"]
    restart: "no"

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-grahita}:${POSTGRES_PASSWORD:-grahita}@postgres:5432/${POSTGRES_DB:-grahita}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-grahita}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-grahita}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-grahita123}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: no-reply@grahitaindonesia.com
      GOTENBERG_URL: http://gotenberg:3000
      CORS_ORIGINS: http://localhost:8080,http://localhost:8081
    ports:
      - "8088:8080"   # akses langsung ke API untuk debugging
    command: ["--mode=api"]
    healthcheck:
      test: ["CMD", "/app/server", "--mode=healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgres://${POSTGRES_USER:-grahita}:${POSTGRES_PASSWORD:-grahita}@postgres:5432/${POSTGRES_DB:-grahita}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: no-reply@grahitaindonesia.com
      GOTENBERG_URL: http://gotenberg:3000
      WORKER_INTERVAL: 15s
    command: ["--mode=worker"]

  # Menyajikan frontend + mem-proxy /api ke service api.
  # Sementara ini isinya prototype HTML; nanti diganti hasil build Vite.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"   # Customer Portal -> http://localhost:8080
      - "8081:81"   # Admin Portal    -> http://localhost:8081
    volumes:
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./web/customer:/srv/customer:ro
      - ./web/admin:/srv/admin:ro

volumes:
  pgdata:
  miniodata:
