        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/deposit-topups:
    get:
      tags: [admin]
      operationId: adminListDepositTopups
      summary: Antrean top-up deposit
      parameters:
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending_review, needs_review, verified, rejected, reversed] } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Daftar top-up
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DepositTopup" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/deposit-topups/{id}/proof:
    get:
      tags: [admin]
      operationId: adminGetDepositTopupProof
      summary: Tautan unduh bukti top-up
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Tautan berumur pendek
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DepositProofURL" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/deposit-topups/{id}/decision:
    post:
      tags: [admin]
      operationId: adminDecideDepositTopup
      summary: Putuskan top-up (review, reject, atau verify kredit)
      description: |
        `review`/`reject` butuh `admin.verify` dan alasan. `verify`
        menciptakan kredit sehingga khusus Superadmin
        (`admin.deposit_credit`), wajib `Idempotency-Key`, dan rekening tujuan
        divalidasi ulang terhadap D2. Nominal final yang berbeda dari yang
        dinyatakan wajib beralasan. Hasil OCR tidak pernah menjadi otoritas.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositDecisionRequest" }
      responses:
        "200":
          description: Keputusan tercatat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DepositDecisionResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Konflik aturan deposit (saldo, versi, rekening, idempotensi)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/admin/orders/{id}/payment:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
    get:
      tags: [admin]
      operationId: adminGetOrderPayment
      summary: Rincian pembayaran satu pesanan
      description: |
        Rincian pembayaran order (C3/C4; C0 §5.1): total kini, deposit committed
        lintas versi, sisa tagihan, sub-state revisi, pointer settlement Done,
        alokasi, dan saldo cabang (journal_version untuk alokasi/reversal).
        Bukti transfer yang belum diverifikasi tidak dihitung sebagai bayar.
      responses:
        "200":
          description: Rincian pembayaran
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OrderPayment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/orders/{id}/deposit-allocations:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
    get:
      tags: [admin]
      operationId: adminListOrderDepositAllocations
      summary: Alokasi deposit satu pesanan
      responses:
        "200":
          description: Daftar alokasi
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DepositAllocation" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [admin]
      operationId: adminAllocateOrderDeposit
      summary: Alokasikan saldo cabang ke pesanan atas permintaan cabang
      description: Sama dengan alokasi cabang, ditambah `reason` wajib.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositAllocateRequest" }
      responses:
        "201":
          description: Alokasi tercatat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DepositAllocationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Konflik aturan deposit (saldo, versi, rekening, idempotensi)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/admin/orders/{id}/deposit-allocations/{allocation_id}/reverse:
    post:
      tags: [admin]
      operationId: adminReverseOrderDepositAllocation
      summary: Reversal parsial/penuh alokasi deposit (alasan wajib)
      description: |
        `amount` adalah nominal reversal pada panggilan ini, bukan kumulatif;
        tidak boleh melebihi bagian alokasi yang masih aktif. Ditolak untuk
        pesanan Done. Header `Idempotency-Key` wajib.
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
        - { name: allocation_id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, expected_journal_version, reason]
              properties:
                amount: { type: integer, minimum: 1 }
                expected_journal_version: { type: integer }
                reason: { type: string }
      responses:
        "200":
          description: Reversal tercatat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DepositReversalResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Konflik aturan deposit (saldo, versi, rekening, idempotensi)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }


components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: grahita_session
      description: |
        Cookie sesi host-only. Browser mengirimnya otomatis selama request
        same-origin; tidak ada token bearer.

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Nilai cookie `grahita_csrf` (double-submit).
      schema: { type: string }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Wajib bila keputusan menciptakan kredit deposit (settlement) atau membawa reversal plan (revisi).
      schema: { type: string, minLength: 8, maxLength: 200 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Kunci unik per niat mutasi deposit; retry dengan kunci dan isi sama menghasilkan hasil yang sama.
      schema: { type: string, minLength: 8, maxLength: 200 }
    OrderIdPath:
      name: id
      in: path
      required: true
      description: id pesanan (UUID).
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: Data yang dikirim tidak valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: VALIDATION_FAILED
              message: Data yang dikirim belum lengkap atau tidak valid.
              fields:
                email: format email tidak valid
    Unauthenticated:
      description: Belum masuk atau sesi sudah berakhir
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: UNAUTHENTICATED
              message: Anda harus masuk terlebih dahulu.
    Forbidden:
      description: Sudah masuk tetapi role tidak berhak
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: FORBIDDEN
              message: Anda tidak memiliki akses ke tindakan ini.
    NotFound:
      description: Data atau endpoint tidak ditemukan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: NOT_FOUND
              message: Endpoint tidak ditemukan.
    RateLimited:
      description: Terlalu banyak percobaan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: RATE_LIMITED
              message: Terlalu banyak percobaan masuk. Coba lagi beberapa saat lagi.
    PayloadTooLarge:
      description: Badan permintaan melebihi batas unggahan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: Total ukuran berkas bukti melebihi batas unggahan.
    Unavailable:
      description: Layanan pendukung (object storage) belum siap
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: UNAVAILABLE
              message: Penyimpanan berkas belum siap sehingga bukti tidak dapat disimpan.
    Conflict:
      description: Permintaan bertentangan dengan aturan data
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            emailTaken:
              value:
                error:
                  code: EMAIL_TAKEN
                  message: Email tersebut sudah dipakai akun lain.
            lastSuperadmin:
              value:
                error:
                  code: LAST_SUPERADMIN
                  message: Superadmin aktif terakhir tidak boleh dinonaktifkan atau diturunkan menjadi Manager.
            noAccount:
              value:
                error:
                  code: NO_ACCOUNT
                  message: Cabang ini belum punya akun. Buat token registrasi lebih dahulu di halaman Cabang.
            accountInactive:
              value:
                error:
                  code: ACCOUNT_INACTIVE
                  message: Akun cabang ini sedang nonaktif; aktifkan dulu sebelum mengirim tautan atur ulang.
            branchHasOrders:
              value:
                error:
                  code: BRANCH_HAS_ORDERS
                  message: Cabang ini sudah punya pesanan sehingga tidak bisa dihapus; nonaktifkan saja cabangnya.
            branchHasAccount:
              value:
                error:
                  code: BRANCH_HAS_ACCOUNT
                  message: Cabang ini sudah punya akun, jadi token registrasi tidak diperlukan lagi. Pemulihan akses lewat lupa kata sandi.
            branchInactive:
              value:
                error:
                  code: BRANCH_INACTIVE
                  message: Cabang sedang nonaktif; aktifkan dulu sebelum membuat token registrasi.

  schemas:
    DepositSummary:
      type: object
      required: [branch_id, available_balance, journal_version, pending_topup_count, pending_topup_amount_declared]
      properties:
        branch_id: { type: string, format: uuid }
        available_balance: { type: integer }
        journal_version: { type: integer }
        pending_topup_count: { type: integer }
        pending_topup_amount_declared: { type: integer }
    DepositTransaction:
      type: object
      required: [id, kind, amount, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        amount: { type: integer, description: Positif kredit, negatif debit }
        order_id: { type: string, format: uuid }
        order_nomor: { type: string }
        topup_id: { type: string, format: uuid }
        reverses_transaction_id: { type: string, format: uuid }
        reversed_amount: { type: integer }
        created_at: { type: string, format: date-time }
    DepositTopup:
      type: object
      required: [id, branch_id, bank_account_id, status, declared_amount, payment_proof_id, created_at]
      properties:
        id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        branch_nama: { type: string }
        bank_account_id: { type: string, format: uuid }
        bank: { type: string }
        display_nomor: { type: string, description: Nomor rekening tersamar }
        status: { type: string, enum: [pending_review, needs_review, verified, rejected, reversed] }
        declared_amount: { type: integer }
        verified_amount: { type: integer }
        rejection_reason: { type: string }
        payment_proof_id: { type: string, format: uuid }
        proof_nama_file: { type: string }
        proof_mime_type: { type: string }
        ocr_nominal: { type: integer, description: Saran OCR, bukan otoritas }
        created_at: { type: string, format: date-time }
        verified_at: { type: string, format: date-time }
    DepositProofURL:
      type: object
      required: [url, expires_in, nama_file, mime_type]
      properties:
        url: { type: string }
        expires_in: { type: integer }
        nama_file: { type: string }
        mime_type: { type: string }
    DepositBranchOverview:
      type: object
      description: |
        Satu cabang di ikhtisar deposit admin: semua cabang Cash & Carry, ditambah
        cabang lain yang masih bersaldo atau punya top-up tercatat.
      required: [branch_id, branch_nama, is_cnc, available_balance, journal_version, pending_topup_count, pending_topup_amount_declared]
      properties:
        branch_id: { type: string, format: uuid }
        branch_nama: { type: string }
        is_cnc: { type: boolean }
        available_balance: { type: integer }
        journal_version: { type: integer }
        pending_topup_count: { type: integer }
        pending_topup_amount_declared: { type: integer }
    DepositBranchDetail:
      allOf:
        - $ref: "#/components/schemas/DepositSummary"
        - type: object
          required: [branch_nama, topups, transactions, reconciled]
          properties:
            branch_nama: { type: string }
            topups: { type: array, items: { $ref: "#/components/schemas/DepositTopup" } }
            transactions: { type: array, items: { $ref: "#/components/schemas/DepositTransaction" } }
            reconciled: { type: boolean }
    OrderPayment:
      type: object
      required: [order_id, status, versi, current_total, committed_deposit, remaining_due, is_lunas, allocations, balance]
      properties:
        order_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, submitted, done] }
        versi: { type: integer, minimum: 0 }
        current_total: { type: integer, minimum: 0 }
        revision_payment_state: { type: string, enum: [revision_underpayment, revision_overpayment_pending] }
        committed_deposit: { type: integer, minimum: 0 }
        remaining_due: { type: integer, minimum: 0 }
        is_lunas: { type: boolean }
        settlement:
          type: object
          required: [verification_log_id, order_version, deposit_amount, transfer_amount]
          properties:
            verification_log_id: { type: string, format: uuid }
            order_version: { type: integer, minimum: 0 }
            deposit_amount: { type: integer, minimum: 0 }
            transfer_amount: { type: integer, minimum: 0 }
        allocations: { type: array, items: { $ref: "#/components/schemas/DepositAllocation" } }
        balance: { $ref: "#/components/schemas/DepositSummary" }

    DepositAllocation:
      type: object
      required: [id, order_id, order_version, amount, reversed_amount, active_amount, created_at]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        order_version: { type: integer }
        amount: { type: integer }
        reversed_amount: { type: integer }
        active_amount: { type: integer }
        created_at: { type: string, format: date-time }
    DepositAllocateRequest:
      type: object
      required: [amount, expected_journal_version, expected_order_version]
      properties:
        amount: { type: integer, minimum: 1 }
        expected_journal_version: { type: integer }
        expected_order_version: { type: integer }
        reason: { type: string, description: Wajib untuk alokasi oleh admin }
    DepositAllocationResult:
      type: object
      required: [allocation, balance, remaining_due, replayed]
      properties:
        allocation: { $ref: "#/components/schemas/DepositAllocation" }
        balance: { $ref: "#/components/schemas/DepositSummary" }
        remaining_due: { type: integer }
        replayed: { type: boolean }
    DepositReversalResult:
      type: object
      required: [allocation_id, reversed_amount, active_amount, balance, replayed]
      properties:
        allocation_id: { type: string, format: uuid }
        reversed_amount: { type: integer, description: Kumulatif }
        active_amount: { type: integer }
        balance: { $ref: "#/components/schemas/DepositSummary" }
        replayed: { type: boolean }
    DepositDecisionRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [review, reject, verify] }
        approved_amount: { type: integer, minimum: 1, description: Wajib untuk verify }
        bank_account_id: { type: string, format: uuid }
        reason: { type: string, description: Wajib untuk review/reject dan untuk nominal final yang berbeda }
    DepositDecisionResult:
      type: object
      required: [topup, replayed]
      properties:
        topup: { $ref: "#/components/schemas/DepositTopup" }
        balance: { $ref: "#/components/schemas/DepositSummary" }
        replayed: { type: boolean }

    MasterImportPreview:
      type: object
      required: [attempt_id, artifact_id, source_hash, preview_hash, contract_version, sheet, counts, items, created_at]
      properties:
        attempt_id: { type: string, format: uuid }
        artifact_id: { type: string, format: uuid }
        source_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        preview_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        contract_version: { type: string }
        sheet: { type: string }
        created_at: { type: string, format: date-time }
        counts:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MasterImportStatusCount"
        items:
          type: array
          items:
            $ref: "#/components/schemas/MasterImportPreviewItem"
    MasterImportStatusCount:
      type: object
      required: [insert, update, skip, conflict, needs_review]
      properties:
        insert: { type: integer, minimum: 0 }
        update: { type: integer, minimum: 0 }
        skip: { type: integer, minimum: 0 }
        conflict: { type: integer, minimum: 0 }
        needs_review: { type: integer, minimum: 0 }
    MasterImportPreviewItem:
      type: object
      required: [source_row, entity_kind, entity_code, fingerprint, status]
      properties:
        source_row: { type: integer, minimum: 0 }
        entity_kind:
          type: string
          enum: [branch, product, variant, tariff, note]
        entity_code: { type: string }
        fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        status:
          type: string
          enum: [insert, update, skip, conflict, needs_review]
        reason_code:
          type: string
          enum: [identity_remap_required, ambiguous_identity, existing_access_identity_blank, inconsistent_existing_access, tariff_mark_unavailable, already_unavailable, manual_review_required]
    MasterImportEvidenceItem:
      type: object
      required: [source_row, entity_kind, entity_code, value]
      properties:
        source_row: { type: integer, minimum: 0 }
        entity_kind: { type: string, enum: [note] }
        entity_code:
          type: string
          description: Kode kolom sumber, misalnya AR atau AU.
        value:
          type: string
          description: Nilai privat untuk review Superadmin; dilarang masuk log/laporan umum.
    MasterImportDecision:
      type: object
      required: [source_row, entity_kind, entity_code, decision, reason]
      properties:
        source_row: { type: integer, minimum: 0 }
        entity_kind: { type: string, enum: [branch, product, variant, tariff, note] }
        entity_code: { type: string }
        decision:
          type: string
          enum: [ignored_with_reason, mapped_by_explicit_rule, source_corrected, preserve_existing_verified_identity, revoke_access_and_mark_incomplete, revoke_inconsistent_access]
        reason: { type: string, minLength: 1 }
    MasterImportApplyRequest:
      type: object
      required: [preview_hash, idempotency_key]
      properties:
        preview_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        idempotency_key: { type: string, minLength: 8, maxLength: 200 }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/MasterImportDecision" }
    MasterImportMutationCounts:
      type: object
      required: [branch, product, variant, tariff, identity_revocation]
      properties:
        branch: { type: integer, minimum: 0 }
        product: { type: integer, minimum: 0 }
        variant: { type: integer, minimum: 0 }
        tariff: { type: integer, minimum: 0 }
        identity_revocation: { type: integer, minimum: 0 }
    MasterImportApplyResult:
      type: object
      required: [apply_run_id, attempt_id, status, mutations, idempotent, applied_at]
      properties:
        apply_run_id: { type: string, format: uuid }
        attempt_id: { type: string, format: uuid }
        status: { type: string, enum: [applied, rolled_back] }
        mutations: { $ref: "#/components/schemas/MasterImportMutationCounts" }
        idempotent: { type: boolean }
        applied_at: { type: string, format: date-time }
        rolled_back_at: { type: string, format: date-time }
    MasterImportRollbackResult:
      type: object
      required: [apply_run_id, status, restored, identity_revocation_not_reversed, rolled_back_at]
      properties:
        apply_run_id: { type: string, format: uuid }
        status: { type: string, enum: [rolled_back] }
        restored: { type: integer, minimum: 0 }
        identity_revocation_not_reversed: { type: integer, minimum: 0 }
        rolled_back_at: { type: string, format: date-time }
    PaymentProof:
      type: object
      required: [id, order_id, nama_file, mime_type, ukuran_byte, sha256, uploaded_by_kind, created_at]
      description: |
        Metadata satu bukti transfer. Isi berkasnya tidak pernah ada di sini —
        hanya tautan unduh berumur pendek dari endpoint `.../download`.
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        nama_file:
          type: string
          description: Nama berkas asli (sudah dibersihkan dari komponen direktori dan karakter kendali).
        mime_type:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
        ukuran_byte: { type: integer, format: int64 }
        sha256:
          type: string
          description: |
            Sidik jari SHA-256 isi berkas (hex). Wajib unik per pesanan: berkas
            dengan isi sama tidak bisa diunggah dua kali (SystemDesign.md §5.3).
        uploaded_by_kind: { type: string, enum: [branch, admin] }
        uploaded_by_id: { type: string, format: uuid }
        uploaded_by_nama:
          type: string
          description: Nama admin pengunggah (PRD AP-ORD-06); kosong untuk unggahan cabang.
        created_at: { type: string, format: date-time }
    PaymentProofDownload:
      type: object
      required: [url, expires_in]
      properties:
        url:
          type: string
          format: uri
          description: Presigned URL berumur pendek dengan Content-Disposition attachment.
        expires_in:
          type: integer
          description: Masa berlaku tautan dalam detik.
        nama_file: { type: string }
        mime_type: { type: string }
    OrderLine:
      type: object
      required: [line_no, jenis, nama, qty, harga_satuan, subtotal]
      properties:
        line_no: { type: integer }
        jenis:
          type: string
          enum: [product, packaging]
          description: |
            `product` = baris produk pesanan; `packaging` = baris biaya
            packaging yang ditambahkan server pada pesanan Sertifikat (tepat
            satu baris, qty 1, tanpa product_id) dan tidak bisa diedit atau
            dihapus klien (PRD CP-SER-02).
        product_id:
          type: string
          format: uuid
          description: Kosong pada baris `packaging`.
        nama:
          type: string
          description: Snapshot nama produk saat dipesan (BR-05).
        qty: { type: integer, minimum: 1 }
        harga_satuan:
          type: integer
          format: int64
          minimum: 0
          description: |
            Harga khusus cabang yang diambil server dari branch_prices. Untuk
            produk Sertifikat nilainya selalu 0 berapa pun qty-nya (CP-SER-01).
        subtotal: { type: integer, format: int64 }
        serial_number:
          type: string
          description: |
            Hanya terisi setelah submit (BR-02); draft tanpa serial, dan baris
            `packaging` tidak pernah mendapat serial number.

    Order:
      type: object
      required:
        [id, status, verif_status, versi, is_cnc, is_sertifikat, catatan, total, jumlah_item, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        nomor:
          type: string
          description: Kosong selama masih draft (BR-09); berisi YYYY-MM-XX setelah submit.
        status: { type: string, enum: [draft, submitted, done] }
        verif_status: { type: string, enum: [belum, cocok, perlu_review] }
        versi: { type: integer }
        is_cnc: { type: boolean }
        is_sertifikat: { type: boolean }
        tanggal:
          type: string
          description: Tanggal submit (WIB) YYYY-MM-DD; kosong selama draft (BR-04).
        catatan: { type: string }
        total:
          type: integer
          format: int64
          description: Dihitung server dari baris pesanan, bukan dari klien (BR-10).
        jumlah_item: { type: integer, format: int64 }
        submitted_at: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }

    OrderDraftLineInput:
      type: object
      description: |
        Satu baris editor pesanan. Hanya product_id dan qty yang diterima:
        harga satuan, subtotal, dan total dihitung server, dan field lain
        (mis. "harga" atau "total") ditolak `400` oleh dekoder JSON.
      required: [product_id, qty]
      additionalProperties: false
      properties:
        product_id:
          type: string
          format: uuid
          description: Harus produk yang punya baris harga untuk cabang sesi.
        qty: { type: integer, minimum: 1 }

    OrderDraftInput:
      type: object
      description: Body POST/PUT draft pesanan (PRD CP-ORD-02/03).
      required: [lines]
      additionalProperties: false
      properties:
        catatan: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/OrderDraftLineInput" }

    AdminOrderRow:
      type: object
      required:
        [id, versi, branch_id, branch_nama, status, verif_status, is_cnc, is_sertifikat, total, jumlah_item, email_gagal, created_at, updated_at]
      description: Satu baris riwayat pemesanan admin (F1-15).
      properties:
        id: { type: string, format: uuid }
        nomor:
          type: string
          description: Nomor invoice `YYYY-MM-XX`; kosong selama masih draft.
        versi: { type: integer, minimum: 0 }
        branch_id: { type: string, format: uuid }
        branch_nama: { type: string }
        tanggal:
          type: string
          format: date
          description: Tanggal bisnis (WIB) saat submit; kosong untuk draft.
        status: { type: string, enum: [draft, submitted, done] }
        verif_status: { type: string, enum: [belum, cocok, perlu_review] }
        is_cnc: { type: boolean }
        is_sertifikat: { type: boolean }
        total: { type: integer, format: int64, minimum: 0 }
        jumlah_item:
          type: integer
          format: int64
          description: Σ qty baris produk (baris packaging tidak dihitung).
        email_gagal:
          type: boolean
          description: |
            Pesanan punya minimal satu email berstatus `failed` di outbox
            (F1-16); bisa dikirim ulang dari detail.
        submitted_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminOrderGroup:
      type: object
      required: [kunci, label, jumlah, total]
      description: Ringkasan satu grup daftar riwayat (PRD AP-ORD-02).
      properties:
        kunci:
          type: string
          description: |
            Kunci grup: id cabang untuk grouping `cabang`, `YYYY-MM-DD` untuk
            `hari`, `YYYY-MM` untuk `bulan`, `YYYY` untuk `tahun`.
        label:
          type: string
          description: Nama cabang untuk grouping `cabang`; kosong untuk periode.
        jumlah: { type: integer, format: int64 }
        total:
          type: integer
          format: int64
          description: Σ nilai pesanan pada grup itu.

    AdminOrderPage:
      type: object
      required: [items, total, halaman, per_halaman]
      description: Satu halaman riwayat pemesanan admin dengan paginasi server.
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminOrderRow" }
        total:
          type: integer
          format: int64
          description: Jumlah SELURUH baris yang cocok filter.
        halaman: { type: integer, minimum: 1 }
        per_halaman: { type: integer, minimum: 1, maximum: 100 }
        grup:
          type: string
          enum: ["", cabang, hari, bulan, tahun]
          description: Mode grouping yang dipakai (kosong = tanpa grup).
        ringkasan:
          type: array
          description: Ringkasan seluruh grup pada himpunan terfilter.
          items: { $ref: "#/components/schemas/AdminOrderGroup" }

    AdminDashboardMetric:
      type: object
      required: [jumlah]
      description: |
        Satu angka metrik dashboard yang berbasis role (PRD AP-DSH-02).
        `jumlah` selalu ada; `nilai` (rupiah) HANYA ada untuk Superadmin dan
        tidak dikirim sama sekali untuk Manager.
      properties:
        jumlah: { type: integer, format: int64, minimum: 0 }
        nilai:
          type: integer
          format: int64
          minimum: 0
          description: Σ nilai pesanan dalam rupiah (hanya Superadmin).

    AdminDashboardFilter:
      type: object
      required: [periode, dari, sampai, hari_ini, zona]
      description: Filter yang benar-benar dipakai server setelah normalisasi.
      properties:
        cabang:
          type: string
          format: uuid
          description: Terisi hanya bila satu cabang dipilih.
        periode: { type: string, enum: [hari, minggu, bulan, tahun] }
        dari:
          type: string
          format: date
          description: Awal rentang tanggal bisnis (WIB, inklusif).
        sampai:
          type: string
          format: date
          description: Akhir rentang tanggal bisnis (WIB, inklusif).
        hari_ini:
          type: string
          format: date
          description: Tanggal bisnis hari ini (WIB) menurut jam aplikasi.
        zona: { type: string, description: Selalu `Asia/Jakarta`. }

    AdminDashboardPayment:
      type: object
      required: [terverifikasi, menunggu, perlu_review]
      description: Ringkasan status pembayaran periode terpilih (PRD AP-DSH-05).
      properties:
        terverifikasi: { $ref: "#/components/schemas/AdminDashboardMetric" }
        menunggu: { $ref: "#/components/schemas/AdminDashboardMetric" }
        perlu_review: { $ref: "#/components/schemas/AdminDashboardMetric" }

    AdminDashboardChip:
      type: object
      required: [kunci, label, jumlah]
      description: |
        Satu chip "perlu tindakan" (PRD AP-DSH-03). Angkanya sama dengan
        `total` daftar `/api/v1/admin/orders` bila chip diklik dengan filter
        padanannya.
      properties:
        kunci:
          type: string
          enum: [menunggu, perlu_review, email_gagal]
        label: { type: string }
        jumlah: { type: integer, format: int64, minimum: 0 }

    AdminDashboardPoint:
      type: object
      required: [kunci, label, jumlah, terverifikasi]
      description: Satu batang grafik tren (bulan `YYYY-MM` atau hari `YYYY-MM-DD`).
      properties:
        kunci: { type: string }
        label:
          type: string
          description: Label pendek siap tampil (mis. `Okt` atau `7`).
        jumlah: { type: integer, format: int64, minimum: 0 }
        nilai:
          type: integer
          format: int64
          minimum: 0
          description: Σ nilai pesanan pada titik itu (hanya Superadmin).
        terverifikasi:
          type: integer
          format: int64
          minimum: 0
          description: Jumlah pesanan berstatus `done` pada titik itu (kolom ekspor ringkasan bulanan).

    AdminDashboardRank:
      type: object
      required: [branch_id, nama, jumlah]
      description: Satu baris peringkat cabang pada periode terpilih (PRD AP-DSH-06).
      properties:
        branch_id: { type: string, format: uuid }
        nama: { type: string }
        jumlah: { type: integer, format: int64, minimum: 0 }
        nilai:
          type: integer
          format: int64
          minimum: 0
          description: Σ nilai pesanan cabang itu (hanya Superadmin).

    AdminDashboard:
      type: object
      required: [filter, ringkasan, pembayaran, chip, tren_bulanan, harian, peringkat_cabang, item, pembanding, bulan_lalu, harian_pembanding, komposisi, produk_terlaris]
      description: Metrik dashboard admin Pusat (PRD §4.1), sesuai kartu admin_v2.html.
      properties:
        filter: { $ref: "#/components/schemas/AdminDashboardFilter" }
        ringkasan: { $ref: "#/components/schemas/AdminDashboardMetric" }
        pembayaran: { $ref: "#/components/schemas/AdminDashboardPayment" }
        chip:
          type: array
          items: { $ref: "#/components/schemas/AdminDashboardChip" }
        tren_bulanan:
          type: array
          description: Selalu 12 titik, Januari–Desember tahun bisnis berjalan.
          items: { $ref: "#/components/schemas/AdminDashboardPoint" }
        harian:
          type: array
          description: Hari 1 sampai hari ini pada bulan bisnis berjalan.
          items: { $ref: "#/components/schemas/AdminDashboardPoint" }
        peringkat_cabang:
          type: array
          description: Maksimal 5 cabang teratas pada periode terpilih.
          items: { $ref: "#/components/schemas/AdminDashboardRank" }
        item:
          type: integer
          format: int64
          minimum: 0
          description: Σ qty baris produk periode terpilih (rata-rata item per pesanan = item / ringkasan.jumlah).
        pembanding:
          type: object
          required: [dari, sampai, ringkasan, item]
          description: |
            Periode sebelumnya yang sepadan (prototype `prevRange`): kemarin,
            minggu lalu, bulan lalu tanggal 1 sampai tanggal yang sama, atau
            tahun lalu 1 Januari sampai tanggal yang sama. Tanggal yang tidak
            ada di bulan pembanding dibatasi ke akhir bulannya.
          properties:
            dari: { type: string, format: date }
            sampai: { type: string, format: date }
            ringkasan: { $ref: "#/components/schemas/AdminDashboardMetric" }
            item: { type: integer, format: int64, minimum: 0 }
        bulan_lalu:
          $ref: "#/components/schemas/AdminDashboardMetric"
          description: Seluruh bulan kalender sebelumnya — dasar persentase perubahan batang bulan berjalan.
        harian_pembanding:
          type: integer
          format: int64
          minimum: 0
          description: Jumlah pesanan bulan lalu dari tanggal 1 sampai tanggal yang sama dengan hari ini.
        komposisi:
          type: object
          required: [reguler, cnc, sertifikat]
          description: Komposisi pesanan periode terpilih (C&C = dibayar dari deposit).
          properties:
            reguler: { type: integer, format: int64, minimum: 0 }
            cnc: { type: integer, format: int64, minimum: 0 }
            sertifikat: { type: integer, format: int64, minimum: 0 }
        produk_terlaris:
          type: array
          description: Maksimal 5 product dengan Σ qty baris produk terbesar pada periode terpilih.
          items:
            type: object
            required: [product_id, nama, qty]
            properties:
              product_id: { type: string, format: uuid }
              nama: { type: string }
              qty: { type: integer, format: int64, minimum: 0 }

    OrderEvent:
      type: object
      required: [at, teks, actor_kind]
      description: Satu entri timeline pesanan (`order_events`).
      properties:
        at: { type: string, format: date-time }
        icon:
          type: string
          description: Nama ikon Phosphor yang dipakai UI.
        teks: { type: string }
        actor_kind: { type: string, enum: [branch, admin, system] }
        actor_id: { type: string, format: uuid }

    OrderDocument:
      type: object
      required: [id, jenis, versi, ukuran_byte, created_at]
      description: |
        Satu dokumen pesanan (invoice/surat jalan). Kunci object storage TIDAK
        pernah dikirim; unduhan memakai presigned URL domain dokumen.
      properties:
        id: { type: string, format: uuid }
        jenis: { type: string, enum: [invoice_pdf, surat_jalan_xlsx, surat_jalan_pdf] }
        versi: { type: integer, minimum: 0 }
        ukuran_byte: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    DocumentDownload:
      type: object
      required: [url, expires_in, nama_file, mime_type]
      description: |
        Tautan unduh satu dokumen pesanan (presigned URL berumur pendek) beserta
        nama berkas dan MIME type-nya. Kunci object storage tidak pernah
        disertakan — hanya URL bertanda tangan yang kedaluwarsa.
      properties:
        url: { type: string, format: uri }
        expires_in:
          type: integer
          description: Masa berlaku tautan dalam detik (default 300).
        nama_file: { type: string, example: Invoice-2026-10-0001.pdf }
        mime_type:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

    InvoiceRow:
      type: object
      required:
        [order_id, nomor, status, versi, is_cnc, total, jumlah_item, versi_dokumen,
         ukuran_byte, terbaru, dapat_diunduh]
      description: |
        Satu baris riwayat invoice cabang (F1-19, PRD §3.8). Satu baris = satu
        dokumen invoice versi tertentu; versi lama tetap tampil setelah revisi.
        Pesanan ber-nomor yang dokumennya belum ada muncul dengan
        `versi_dokumen` null dan `dapat_diunduh` false — bentuk invoice yang
        belum Done sehingga belum bisa diunduh. Kunci object storage tidak
        pernah disertakan.
      properties:
        order_id: { type: string, format: uuid }
        nomor: { type: string, example: 2026-10-0001 }
        tanggal:
          type: string
          format: date
          description: Tanggal bisnis WIB pesanan (BR-04).
        status: { type: string, enum: [submitted, done] }
        versi:
          type: integer
          minimum: 0
          description: Versi pesanan (0 = asli, >0 = sudah direvisi).
        is_cnc: { type: boolean }
        total: { type: integer, format: int64 }
        jumlah_item:
          type: integer
          format: int64
          description: Σ qty baris produk (baris biaya packaging tidak dihitung).
        dokumen_id:
          type: string
          format: uuid
          description: Id dokumen invoice versi baris ini; kosong bila belum ada.
        versi_dokumen:
          type: [integer, "null"]
          description: Versi dokumen invoice baris ini; null bila belum ada.
        ukuran_byte: { type: integer, format: int64 }
        terbaru:
          type: boolean
          description: True bila dokumen baris ini versinya sama dengan versi pesanan.
        dapat_diunduh:
          type: boolean
          description: |
            True hanya bila dokumen invoice-nya ada DAN pesanannya sudah Done.
            Unduhan memakai `GET /api/v1/documents/{id}/download` dengan
            `dokumen_id` ini.

    VerificationLog:
      type: object
      required: [id, metode, total_pesanan, total_terbaca, selisih, hasil, created_at]
      description: Satu baris log verifikasi pembayaran pesanan.
      properties:
        id: { type: string, format: uuid }
        metode: { type: string, enum: [manual, ai, virtual_account] }
        total_pesanan: { type: integer, format: int64 }
        total_terbaca: { type: integer, format: int64 }
        selisih: { type: integer, format: int64 }
        hasil: { type: string, enum: [belum, cocok, perlu_review] }
        alasan:
          type: string
          enum: ["", kurang_bayar, lebih_bayar, tidak_terbaca, rekening_beda, lainnya]
        catatan: { type: string }
        admin_nama:
          type: string
          description: Nama admin pemeriksa; kosong bila diverifikasi AI.
        created_at: { type: string, format: date-time }

    VerifyResult:
      type: object
      required: [order, verifikasi]
      description: |
        Hasil satu permintaan verifikasi pembayaran: keadaan pesanan sesudahnya
        beserta baris log verifikasi yang tersimpan (F1-18).
      properties:
        order: { $ref: "#/components/schemas/VerifiedOrder" }
        verifikasi: { $ref: "#/components/schemas/VerificationLog" }
        settlement: { $ref: "#/components/schemas/SettlementResult" }

    ProofSplit:
      type: object
      required: [payment_proof_id, bank_account_id, approved_nominal, applied_to_order]
      additionalProperties: false
      description: |
        Keputusan ekonomi satu bukti: `approved_nominal = applied_to_order +
        credited_to_deposit_total`. Nilai kredit kumulatif (C0 §4.3.1);
        `credited_to_deposit` diterima sebagai alias attempt pertama. Kredit
        baru > 0 hanya untuk Superadmin dan membutuhkan Idempotency-Key.
      properties:
        payment_proof_id: { type: string, format: uuid }
        bank_account_id: { type: string, format: uuid }
        approved_nominal: { type: integer, minimum: 0 }
        applied_to_order: { type: integer, minimum: 0 }
        credited_to_deposit: { type: integer, minimum: 0 }
        credited_to_deposit_total: { type: integer, minimum: 0 }

    SettlementResult:
      type: object
      required: [deposit_amount, transfer_amount, new_credit_to_deposit, deposit_sources, proof_splits, replayed]
      properties:
        deposit_amount: { type: integer, minimum: 0 }
        transfer_amount: { type: integer, minimum: 0 }
        new_credit_to_deposit: { type: integer, minimum: 0 }
        replayed: { type: boolean }
        deposit_sources:
          type: array
          items:
            type: object
            required: [allocation_id, allocation_order_version, amount]
            properties:
              allocation_id: { type: string, format: uuid }
              allocation_order_version: { type: integer, minimum: 0 }
              amount: { type: integer, minimum: 1 }
        proof_splits:
          type: array
          items:
            type: object
            required: [payment_proof_id, approved_nominal, applied_to_order, credited_to_deposit_total, new_credit_to_deposit]
            properties:
              payment_proof_id: { type: string, format: uuid }
              approved_nominal: { type: integer, minimum: 0 }
              applied_to_order: { type: integer, minimum: 0 }
              credited_to_deposit_total: { type: integer, minimum: 0 }
              new_credit_to_deposit: { type: integer, minimum: 0 }

    VerifiedOrder:
      type: object
      required: [id, versi, status, verif_status, total]
      description: |
        Ringkasan pesanan setelah verifikasi. `status` tetap `submitted` bila
        hasilnya `perlu_review` (PRD §7.1: perlu review adalah sub-status
        verifikasi, bukan status pesanan).
      properties:
        id: { type: string, format: uuid }
        nomor: { type: string }
        versi: { type: integer, minimum: 0 }
        branch_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, submitted, done] }
        verif_status: { type: string, enum: [belum, cocok, perlu_review] }
        alasan_review:
          type: string
          enum: ["", kurang_bayar, lebih_bayar, tidak_terbaca, rekening_beda, lainnya]
        total: { type: integer, format: int64 }

    ReviseLineInput:
      type: object
      required: [qty, harga_satuan]
      description: |
        Satu baris pada daftar baris FINAL revisi (F2-25). `line_no` > 0
        menandai baris LAMA yang dipertahankan (serial/jenis/produknya tetap);
        tanpa `line_no`, `product_id` wajib diisi dan baris itu adalah baris
        produk BARU yang mendapat serial number baru bertanggal pesanan asli.
      properties:
        line_no:
          type: integer
          minimum: 0
          description: Nomor baris versi lama yang dipertahankan; 0 = baris baru.
        product_id:
          type: string
          format: uuid
          description: Wajib untuk baris baru; diabaikan untuk baris lama.
        qty: { type: integer, minimum: 1 }
        harga_satuan:
          type: integer
          format: int64
          minimum: 0
          description: |
            Harga yang dipakai versi baru. Untuk produk Sertifikat server
            memaksanya 0 (CP-SER-01).

    RevisionRow:
      type: object
      required: [id, versi_lama, versi_baru, alasan, delta_total, created_at]
      description: Satu baris `invoice_revisions` (snapshot versi lama, F2-25).
      properties:
        id: { type: string, format: uuid }
        versi_lama: { type: integer, minimum: 0 }
        versi_baru: { type: integer, minimum: 1 }
        alasan: { type: string }
        delta_total:
          type: integer
          format: int64
          description: Total versi baru − total versi lama (bisa negatif).
        admin_nama: { type: string }
        created_at: { type: string, format: date-time }

    ReviseResult:
      type: object
      required: [order_id, nomor, versi, total, jumlah_item, delta_total, lines, revisi]
      description: Hasil satu revisi invoice (F2-25); `versi` = `revisi.versi_baru`.
      properties:
        order_id: { type: string, format: uuid }
        nomor: { type: string }
        versi: { type: integer, minimum: 1 }
        total: { type: integer, format: int64, minimum: 0 }
        jumlah_item: { type: integer, format: int64 }
        delta_total: { type: integer, format: int64 }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        revisi: { $ref: "#/components/schemas/RevisionRow" }

    AdminOrderDetail:
      type: object
      required:
        [id, versi, branch_id, branch_nama, branch_kepala, branch_email, branch_cnc, status, verif_status, is_cnc, is_sertifikat, catatan, note_admin, total, jumlah_item, email_gagal, created_at, updated_at, lines, timeline, dokumen, verifikasi]
      description: |
        Detail lengkap satu pesanan untuk admin (PRD AP-ORD-04). `note_admin`
        adalah catatan internal dan hanya muncul di respons admin.
      properties:
        id: { type: string, format: uuid }
        nomor: { type: string }
        versi: { type: integer, minimum: 0 }
        branch_id: { type: string, format: uuid }
        branch_nama: { type: string }
        branch_kepala: { type: string }
        branch_email: { type: string, format: email }
        branch_cnc: { type: boolean }
        status: { type: string, enum: [draft, submitted, done] }
        verif_status: { type: string, enum: [belum, cocok, perlu_review] }
        alasan_review:
          type: string
          enum: ["", kurang_bayar, lebih_bayar, tidak_terbaca, rekening_beda, lainnya]
        is_cnc: { type: boolean }
        is_sertifikat: { type: boolean }
        tanggal: { type: string, format: date }
        submitted_at: { type: string, format: date-time }
        done_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        catatan:
          type: string
          description: Catatan dari cabang (terlihat kedua pihak).
        note_admin:
          type: string
          description: Catatan internal admin — TIDAK pernah dikirim ke portal cabang.
        total: { type: integer, format: int64, minimum: 0 }
        jumlah_item: { type: integer, format: int64 }
        email_gagal: { type: boolean }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/OrderEvent" }
        dokumen:
          type: array
          items: { $ref: "#/components/schemas/OrderDocument" }
        verifikasi:
          type: array
          items: { $ref: "#/components/schemas/VerificationLog" }

    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Kode mesin yang stabil
              enum:
                [
                  VALIDATION_FAILED,
                  UNAUTHENTICATED,
                  FORBIDDEN,
                  NOT_FOUND,
                  CONFLICT,
                  RATE_LIMITED,
                  CSRF_INVALID,
                  RESET_INVALID,
                  TOKEN_INVALID,
                  TOKEN_EXPIRED,
                  TOKEN_USED,
                  EMAIL_TAKEN,
                  LAST_SUPERADMIN,
                  NO_ACCOUNT,
                  ACCOUNT_INACTIVE,
                  BRANCH_HAS_ORDERS,
                  BRANCH_HAS_ACCOUNT,
                  BRANCH_INACTIVE,
                  BANK_DUPLICATE,
                  KODE_TAKEN,
                  PRODUCT_IN_USE,
                  ORDER_LOCKED,
                  ORDER_NOT_DONE,
                  ORDER_ALREADY_DONE,
                  ORDER_NOT_SUBMITTED,
                  DOCUMENT_NOT_READY,
                  DOCUMENT_RENDER_UNAVAILABLE,
                  INVOICE_NOT_READY,
                  PROOF_LIMIT,
                  PROOF_DUPLICATE,
                  PAYLOAD_TOO_LARGE,
                  TIMEOUT,
                  METHOD_NOT_ALLOWED,
                  BRANCH_MISSING,
                  UNAVAILABLE,
                  INTERNAL,
                  TOPUP_NOT_FOUND,
                  ALLOCATION_NOT_FOUND,
                  DEPOSIT_BALANCE_INSUFFICIENT,
                  DEPOSIT_VERSION_CONFLICT,
                  DEPOSIT_ALLOCATION_EXCEEDS_ORDER,
                  TOPUP_ALREADY_DECIDED,
                  PAYMENT_PROOF_ALREADY_USED,
                  IDEMPOTENCY_KEY_REUSED,
                  REVERSAL_EXCEEDS_AVAILABLE,
                  REVERSAL_WOULD_NEGATIVE_BALANCE,
                  BRANCH_BANK_ACCOUNT_UNAVAILABLE,
                  BANK_ACCOUNT_NOT_ALLOWED,
                  DEPOSIT_RECONCILIATION_REQUIRED,
                  DEPOSIT_UNAVAILABLE,
                  ORDER_VERSION_CONFLICT,
                  PAYMENT_BREAKDOWN_MISMATCH,
                  OVERPAY_DECISION_REQUIRED,
                  REVISION_REVERSAL_PLAN_REQUIRED,
                  REVISION_REVERSAL_PLAN_INVALID,
                ]
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Kesalahan per field untuk ditempelkan ke form

    Readiness:
      type: object
      required: [status, version, checks]
      properties:
        status: { type: string, enum: [ready, "not ready"] }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: string }
          example:
            database: ok
            migrations: ok (versi 2)
            storage: tidak dikonfigurasi
            gotenberg: ok
            smtp: ok

    User:
      type: object
      required: [id, kind, role, nama, email]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [branch, admin] }
        role: { type: string, enum: [branch, manager, superadmin] }
        branch_id: { type: string, format: uuid }
        nama: { type: string }
        email: { type: string, format: email }

    UserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user: { $ref: "#/components/schemas/User" }

    Product:
      type: object
      required: [id, nama, jenis, harga_default, urutan, is_active]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        jenis: { type: string, enum: [reguler, sertifikat] }
        deskripsi: { type: string }
        harga_default: { type: integer, format: int64, minimum: 0 }
        urutan: { type: integer }
        is_active: { type: boolean }

    ProductInput:
      type: object
      description: Body pembuatan produk (PRD §4.5 AP-KAT-01).
      required: [nama]
      additionalProperties: false
      properties:
        kode: { type: string, maxLength: 40 }
        nama: { type: string, minLength: 2, maxLength: 160 }
        jenis: { type: string, enum: [reguler, sertifikat], default: reguler }
        deskripsi: { type: string, maxLength: 500 }
        harga_default:
          type: integer
          format: int64
          minimum: 0
          description: Wajib 0 untuk produk Sertifikat.
        urutan: { type: integer, minimum: 0 }
        is_active:
          type: boolean
          description: Kosong berarti aktif (default produk baru).

    ProductUpdate:
      type: object
      description: Body perubahan produk; hanya field yang dikirim yang diubah.
      additionalProperties: false
      properties:
        kode: { type: string, maxLength: 40 }
        nama: { type: string, minLength: 2, maxLength: 160 }
        jenis: { type: string, enum: [reguler, sertifikat] }
        deskripsi: { type: string, maxLength: 500 }
        harga_default: { type: integer, format: int64, minimum: 0 }
        urutan: { type: integer, minimum: 0 }
        is_active: { type: boolean }

    PriceMatrix:
      type: object
      description: |
        Grid Produk × Cabang. `sel` hanya memuat sel yang berisi harga; sel
        yang tidak ada berarti produk tidak dijual ke cabang tersebut.
      required: [produk, cabang, sel]
      properties:
        produk:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        cabang:
          type: array
          items: { $ref: "#/components/schemas/MatrixBranch" }
        sel:
          type: array
          items: { $ref: "#/components/schemas/PriceCell" }

    MatrixBranch:
      type: object
      description: Kolom cabang pada matriks harga.
      required: [id, nama, is_active]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
        is_active: { type: boolean }

    PriceCell:
      type: object
      required: [branch_id, product_id, harga, hjm, p1, spv, sumber]
      properties:
        branch_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        harga:
          type: integer
          format: int64
          minimum: 0
          description: Tarif final satu item yang dibaca katalog cabang dan pesanan.
        hjm:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Harga jual dasar (Rupiah); null untuk sel tanpa rincian.
        p1:
          type: [string, "null"]
          pattern: "^[0-9]+(\\.[0-9]+)?$"
          description: Rasio P1 desimal 0–1 ("0.1" = 10%); null untuk sel tanpa rincian.
        spv:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Biaya SPV (Rupiah); null untuk sel tanpa rincian.
        sumber:
          type: string
          enum: [import, manual, legacy]
          description: |
            Asal versi tarif aktif: `import` (impor master Impact), `manual`
            (edit matriks harga), atau `legacy` (harga lama tanpa rincian).

    PriceBatchInput:
      type: object
      description: Batch edit sel matriks harga.
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [branch_id, product_id]
            additionalProperties: false
            properties:
              branch_id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              hjm:
                type: [integer, "null"]
                format: int64
                minimum: 0
                description: |
                  Harga jual dasar (Rupiah). Kosong/null berarti sel
                  dikosongkan (tidak dijual), seperti sel HJM kosong pada
                  workbook Impact.
              p1:
                type: string
                maxLength: 20
                description: Rasio P1 desimal 0–1 ("0.1" = 10%, maksimal 6 digit desimal); kosong = 0.
              spv:
                type: [integer, "null"]
                format: int64
                minimum: 0
                description: Biaya SPV (Rupiah); kosong/null = 0.

    PriceResult:
      type: object
      required: [diubah, dihapus, diabaikan]
      properties:
        diubah: { type: integer, description: Sel baru atau berubah komponennya. }
        dihapus: { type: integer, description: Sel yang dikosongkan. }
        diabaikan: { type: integer, description: Sel yang komponennya sama dengan versi aktif. }

    PriceCopyInput:
      type: object
      required: [from_branch_id]
      additionalProperties: false
      properties:
        from_branch_id: { type: string, format: uuid }
        to_branch_ids:
          type: array
          items: { type: string, format: uuid }
        semua:
          type: boolean
          description: Salin ke seluruh cabang lain. Kosong berarti pakai `to_branch_ids`.

    PriceCopyResult:
      type: object
      required: [from_branch_id, jumlah, salinan]
      properties:
        from_branch_id: { type: string, format: uuid }
        jumlah: { type: integer, description: Jumlah sel yang disalin dari sumber. }
        salinan:
          type: array
          items:
            type: object
            required: [branch_id, jumlah, diubah]
            properties:
              branch_id: { type: string, format: uuid }
              jumlah: { type: integer }
              diubah: { type: integer, description: Sel yang nilainya benar-benar berubah. }

    BranchProduct:
      type: object
      description: Produk beserta harga khusus cabang (Rupiah bulat)
      required: [id, nama, jenis, harga, urutan]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
        jenis: { type: string, enum: [reguler, sertifikat] }
        deskripsi: { type: string }
        harga: { type: integer, format: int64, minimum: 0 }
        urutan: { type: integer }
        biaya_packaging:
          type: integer
          format: int64
          minimum: 0
          description: |
            Hanya ada pada produk Sertifikat: biaya packaging per pesanan yang
            ditambahkan otomatis, senilai setelan `biaya_packaging` yang sedang
            berlaku (PRD CP-KAT-04, CP-SER-02). Angka final tetap dihitung
            server saat draft disimpan dan saat submit.

    BankAccount:
      type: object
      description: Rekening bank tujuan transfer (PRD §4.6).
      required: [id, bank, nama_pemilik, nomor, is_active]
      properties:
        id: { type: string, format: uuid }
        bank: { type: string, enum: [BCA, BRI] }
        nama_pemilik: { type: string }
        nomor: { type: string, pattern: "^[0-9]{6,34}$" }
        display_nomor: { type: string, description: Nomor rekening termasking untuk tampilan. }
        is_active: { type: boolean }

    BranchBankAccountAssignment:
      type: object
      required: [id, bank, nama_pemilik, display_nomor, is_active, is_allowed, dormant, effective]
      properties:
        id: { type: string, format: uuid }
        bank: { type: string, enum: [BCA, BRI] }
        nama_pemilik: { type: string }
        display_nomor: { type: string }
        is_active: { type: boolean }
        is_allowed: { type: boolean }
        dormant: { type: boolean }
        effective: { type: boolean }

    BranchBankAccountAssignments:
      type: object
      required: [branch_id, version, items]
      properties:
        branch_id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/BranchBankAccountAssignment" }

    BranchBankAccountReplacement:
      type: object
      required: [expected_version, bank_account_ids]
      additionalProperties: false
      properties:
        expected_version: { type: integer, format: int64, minimum: 0 }
        bank_account_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }

    BranchBankAccountReplacementResult:
      type: object
      required: [branch_id, version, bank_account_ids, payment_available]
      properties:
        branch_id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        bank_account_ids:
          type: array
          items: { type: string, format: uuid }
        payment_available: { type: boolean }

    ProofDestination:
      type: object
      required: [payment_proof_id, bank_account_id]
      additionalProperties: false
      properties:
        payment_proof_id: { type: string, format: uuid }
        bank_account_id: { type: string, format: uuid }

    BankAccountInput:
      type: object
      description: Body pembuatan rekening (PRD §4.6).
      required: [bank, nama_pemilik, nomor]
      additionalProperties: false
      properties:
        bank: { type: string, enum: [BCA, BRI] }
        nama_pemilik: { type: string, minLength: 2, maxLength: 120 }
        nomor: { type: string, minLength: 6, maxLength: 34, pattern: "^[0-9]{6,34}$" }
        is_active:
          type: boolean
          description: Kosong berarti aktif (default rekening baru).

    BankAccountUpdate:
      type: object
      description: Body perubahan rekening; hanya field yang dikirim yang diubah.
      additionalProperties: false
      properties:
        bank: { type: string, enum: [BCA, BRI] }
        nama_pemilik: { type: string, minLength: 2, maxLength: 120 }
        nomor: { type: string, minLength: 6, maxLength: 34, pattern: "^[0-9]{6,34}$" }
        is_active: { type: boolean }

    BackupRun:
      type: object
      description: |
        Satu baris tabel `backup_runs` (Database.md §4.7): jejak satu pekerjaan
        cadangan. `selesai`/`sukses` kosong berarti pekerjaan masih berjalan
        (mis. proses mati di tengah jalan) — baris seperti itu juga terlihat
        di halaman Pengaturan.
      required: [id, jenis, mulai, ukuran_byte]
      properties:
        id: { type: string, format: uuid }
        jenis: { type: string, enum: [postgres, storage, wal] }
        mulai: { type: string, format: date-time }
        selesai: { type: string, format: date-time }
        sukses: { type: boolean }
        ukuran_byte: { type: integer, format: int64 }
        tujuan: { type: string, description: "Contoh: rclone:gdrive:grahita-backup:postgres/grahita-2026-10-08.dump.age" }
        pesan: { type: string }

    SettingValue:
      description: |-
        Nilai pengaturan: bilangan bulat (Rupiah tanpa sen), boolean, atau
        objek `ai`.
      oneOf:
        - type: integer
        - type: boolean
        - type: object
          additionalProperties: true

    Branch:
      type: object
      description: |
        Data cabang milik sesi (profil cabang). Seluruh field READ-ONLY di
        portal cabang: nama, kepala cabang, email, dan telepon adalah data
        master yang dikelola admin Pusat (PRD §3.8), dan API tidak menyediakan
        rute tulis untuknya.
      required: [id, nama, nama_kepala, jabatan_kepala, email, identity_status, telepon, is_cnc, is_special, pajak_in, is_active]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
        nama_kepala: { type: string }
        jabatan_kepala: { type: string }
        email: { type: string, description: Kosong bila identitas cabang belum lengkap. }
        identity_status: { type: string, enum: [identity_incomplete, ready, registered] }
        telepon: { type: string }
        is_cnc: { type: boolean }
        is_special: { type: boolean }
        pajak_in: { type: boolean }
        is_active: { type: boolean }
        token_prefix:
          type: string
          description: 8 karakter pertama token registrasi yang masih berlaku (bila ada).
        token_expires_at: { type: string, format: date-time }

    BranchInput:
      type: object
      description: Body pembuatan cabang (PRD §4.4).
      required: [nama]
      additionalProperties: false
      properties:
        nama: { type: string, minLength: 2, maxLength: 120 }
        nama_kepala: { type: string, maxLength: 120, description: Kosong berarti identitas belum lengkap. }
        jabatan_kepala: { type: string, maxLength: 120 }
        email: { type: string, maxLength: 254, description: Kosong berarti identitas belum lengkap; bila terisi harus berupa email valid. }
        telepon: { type: string, maxLength: 40 }
        is_cnc: { type: boolean }
        is_special: { type: boolean }
        pajak_in: { type: boolean }
        is_active:
          type: boolean
          description: Kosong berarti aktif (default cabang baru).

    BranchUpdate:
      type: object
      description: Body perubahan cabang; hanya field yang dikirim yang diubah.
      additionalProperties: false
      properties:
        nama: { type: string, minLength: 2, maxLength: 120 }
        nama_kepala: { type: string, maxLength: 120, description: String kosong menghapus nilai dan membuat identitas incomplete. }
        jabatan_kepala: { type: string, maxLength: 120 }
        email: { type: string, maxLength: 254, description: String kosong menghapus nilai; selain itu harus berupa email valid. }
        telepon: { type: string, maxLength: 40 }
        is_cnc: { type: boolean }
        is_special: { type: boolean }
        pajak_in: { type: boolean }
        is_active: { type: boolean }

    RegistrationToken:
      type: object
      description: |
        Token registrasi sekali pakai. `token` adalah nilai asli dan hanya
        ditampilkan pada respons pembuatan; penyimpanan di database hanya
        memuat hash SHA-256 beserta `prefix`-nya.
      required: [token, prefix, expires_at]
      properties:
        token:
          type: string
          example: GRH-7K2M-QW3Z-9TPL-XB4N
        prefix:
          type: string
          description: 8 karakter pertama token, untuk ditampilkan ulang di Admin Portal.
        expires_at: { type: string, format: date-time }

    BranchUser:
      type: object
      description: |
        Satu baris tab "User cabang": data cabang beserta akunnya. `user_id`
        kosong berarti cabang belum registrasi (belum punya akun).
      required: [branch_id, nama, nama_kepala, email, identity_status, has_account, is_active, branch_active, status]
      properties:
        branch_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        nama: { type: string }
        nama_kepala: { type: string }
        email: { type: string, description: Kosong bila identitas cabang belum lengkap. }
        identity_status: { type: string, enum: [identity_incomplete, ready, registered] }
        telepon: { type: string }
        has_account: { type: boolean }
        is_active: { type: boolean }
        branch_active: { type: boolean }
        status: { type: string, enum: [aktif, belum_registrasi, nonaktif] }
        last_login_at: { type: string, format: date-time }
        token_prefix:
          type: string
          description: 8 karakter pertama token registrasi yang masih berlaku (bila ada).
        token_expires_at: { type: string, format: date-time }

    AdminUser:
      type: object
      description: |
        Akun admin Pusat. `status` = undangan | aktif | nonaktif; admin
        undangan belum punya kata sandi sehingga tidak bisa login dan tidak
        menerima email dokumen.
      required: [id, nama, email, role, notif_invoice, notif_surat_jalan, is_active, status]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [manager, superadmin] }
        notif_invoice: { type: boolean }
        notif_surat_jalan: { type: boolean }
        is_active: { type: boolean }
        status: { type: string, enum: [undangan, aktif, nonaktif] }
        invited_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }

    EmailOutbox:
      type: object
      description: |
        Satu email transaksional di tabel `email_outbox`. Email tidak pernah
        dikirim langsung dari handler HTTP: service menulis baris ini di dalam
        transaksinya, worker memindai dan mengirimnya, lalu memperbarui status.
      required: [id, jenis, to_addr, subject, status, attempts, next_try_at, created_at]
      properties:
        id: { type: string, format: uuid }
        order_id:
          type: string
          format: uuid
          description: Kosong untuk email yang tidak terikat pesanan (reset/undangan).
        jenis:
          type: string
          enum: [reset_password, undangan_admin, invoice_cabang, invoice_admin, surat_jalan_admin, reminder_cnc]
        to_addr: { type: array, items: { type: string, format: email } }
        cc_addr: { type: array, items: { type: string, format: email } }
        subject: { type: string }
        payload:
          type: object
          additionalProperties: true
          description: |
            Data template + daftar lampiran (`lampiran`: storage_key, nama,
            content_type). Nilai token/tautan mentah TIDAK pernah dikembalikan
            ke API selain di dalam payload baris ini yang hanya untuk admin.
        status:
          type: string
          enum: [queued, sending, sent, failed]
          description: |
            `failed` berarti percobaannya sudah habis: satu percobaan pertama
            ditambah 5 percobaan ulang berjenjang (1m, 5m, 30m, 2j, 6j). Baris
            `sending` yang prosesnya mati akan diklaim ulang setelah masa sewa
            klaim habis, dan baris `sending` yang percobaannya habis ditandai
            `failed` pada pemindaian berikutnya. Baris `sent` tidak pernah
            dikirim ulang oleh worker.
        attempts: { type: integer, minimum: 0 }
        next_try_at: { type: string, format: date-time }
        last_error: { type: string }
        sent_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    ReportFilter:
      type: object
      description: |
        Filter laporan (PRD §4.7 AP-REP-02). Semua bidang opsional; bidang yang
        kosong berarti tanpa filter. Tanggal memakai tanggal bisnis WIB
        (YYYY-MM-DD).
      properties:
        dari: { type: string, format: date }
        sampai: { type: string, format: date }
        cabang:
          type: array
          description: id cabang (UUID); boleh lebih dari satu.
          items: { type: string, format: uuid }
        status:
          type: string
          enum: [submitted, done, semua]
        jenis:
          type: string
          enum: [product, packaging, semua]
        cnc:
          type: boolean
          description: Filter pesanan Cash & Carry (`orders.is_cnc`).
        special:
          type: boolean
          description: |
            Filter atribut cabang "Special" (`branches.is_special`). Murni
            penanda/filter — tidak pernah mengubah harga, subtotal, atau pajak.
        pi:
          type: boolean
          description: |
            Filter atribut cabang "PI" (`branches.pajak_in`). Murni
            penanda/filter — tidak pernah mengubah harga, subtotal, atau pajak.
    ReportOrderLine:
      type: object
      required: [tanggal, nomor, versi, branch_id, cabang, kepala_cabang, is_cnc, is_special, pajak_in, line_no, produk, jenis, qty, harga_satuan, subtotal, status]
      description: Satu baris laporan = SATU order line (PRD §4.7 AP-REP-01).
      properties:
        tanggal: { type: string, format: date }
        nomor: { type: string, description: Nomor invoice pesanan. }
        versi: { type: integer, minimum: 0 }
        branch_id: { type: string, format: uuid }
        cabang: { type: string }
        kepala_cabang: { type: string }
        is_cnc: { type: boolean }
        is_special: { type: boolean, description: Atribut cabang; tidak mengubah harga atau pajak. }
        pajak_in: { type: boolean, description: Atribut cabang "PI"; tidak mengubah harga atau pajak. }
        line_no: { type: integer }
        produk: { type: string, description: Nama produk saat transaksi (snapshot). }
        jenis: { type: string, enum: [product, packaging] }
        serial_number: { type: string, description: Kosong untuk baris packaging. }
        qty: { type: integer }
        harga_satuan: { type: integer, format: int64 }
        subtotal: { type: integer, format: int64 }
        status: { type: string, enum: [submitted, done] }
        tanggal_verifikasi:
          type: string
          description: Waktu verifikasi (WIB, `YYYY-MM-DD HH:MM`); kosong bila belum selesai.
        metode_verifikasi:
          type: string
          description: Metode verifikasi terakhir (manual/ai/virtual_account); kosong bila belum ada.
    ReportPage:
      type: object
      required: [items, total, total_subtotal, halaman, per_halaman, filter]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReportOrderLine" }
        total:
          type: integer
          format: int64
          description: Jumlah seluruh baris yang lolos filter (bukan hanya halaman ini).
        total_subtotal: { type: integer, format: int64 }
        halaman: { type: integer }
        per_halaman: { type: integer }
        filter: { $ref: "#/components/schemas/ReportFilter" }
    ReportExportJob:
      type: object
      required: [id, jenis, status, jumlah_baris, created_at, filter]
      properties:
        id: { type: string, format: uuid }
        jenis: { type: string, enum: [order_lines] }
        status:
          type: string
          enum: [queued, proses, selesai, gagal]
          description: |
            `queued` menunggu worker; `proses` sedang ditulis; `selesai` berkas
            siap diunduh; `gagal` beserta alasannya pada `pesan`.
        diminta_nama: { type: string, description: Nama Superadmin peminta. }
        filter:
          allOf:
            - $ref: "#/components/schemas/ReportFilter"
          description: Filter TERSIMPAN yang benar-benar dipakai ekspor.
        nama_file: { type: string }
        jumlah_baris:
          type: integer
          format: int64
          description: |
            Jumlah baris yang BENAR-BENAR ditulis ke berkas — sama dengan jumlah
            baris query terfilter (PRD §9 no.10).
        pesan: { type: string, description: Alasan kegagalan bila status `gagal`. }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ReportDownload:
      type: object
      required: [url, expires_in, mime_type]
      properties:
        url:
          type: string
          format: uri
          description: Presigned URL berumur pendek dengan Content-Disposition attachment.
        expires_in: { type: integer, description: Masa berlaku tautan dalam detik (300). }
        nama_file: { type: string }
        mime_type: { type: string }
    TutorialTopic:
      type: object
      required: [id, ikon, judul, ringkas, langkah]
      properties:
        id: { type: string, format: uuid, description: id topik (dipakai saat mengirim perubahan). }
        ikon:
          type: string
          enum: [memesan, bukti, sertifikat, cnc, umum]
          description: |
            Kunci ilustrasi bawaan aplikasi (bukan berkas/markup). Nilai di
            luar daftar ini ditolak `400 VALIDATION_FAILED`.
        judul: { type: string, maxLength: 120 }
        ringkas: { type: string, maxLength: 300, description: Ringkasan satu baris di bawah judul. }
        langkah:
          type: array
          minItems: 1
          maxItems: 24
          description: Butir langkah, urut sebagaimana ditampilkan.
          items: { type: string, maxLength: 500 }
    TutorialContent:
      type: object
      required: [topik]
      properties:
        topik:
          type: array
          maxItems: 12
          description: Seluruh topik tutorial, urut sesuai urutan tampil.
          items: { $ref: "#/components/schemas/TutorialTopic" }
    TutorialTopicInput:
      type: object
      required: [ikon, judul, ringkas, langkah]
      properties:
        id:
          type: string
          format: uuid
          description: |
            id topik yang sedang diubah. Kosong/tidak dikirim berarti topik
            BARU; id yang tidak dikenal dijawab `400 VALIDATION_FAILED`.
        ikon:
          type: string
          enum: [memesan, bukti, sertifikat, cnc, umum]
        judul: { type: string, maxLength: 120 }
        ringkas: { type: string, maxLength: 300 }
        langkah:
          type: array
          minItems: 1
          maxItems: 24
          items: { type: string, maxLength: 500 }
    TutorialUpdateRequest:
      type: object
      required: [topik]
      properties:
        topik:
          type: array
          minItems: 1
          maxItems: 12
          description: |
            Daftar lengkap topik yang menggantikan isi sekarang (urutan array =
            urutan tampil; topik yang tidak disertakan dihapus).
          items: { $ref: "#/components/schemas/TutorialTopicInput" }
    AuditLogEntry:
      type: object
      required: [id, at, actor_kind, entity, action]
      description: |
        Satu baris `audit_logs` — satu mutasi admin yang berhasil.
        `before`/`after` adalah snapshot JSON keadaan sebelum/sesudah mutasi;
        nilainya sudah diredaksi (kata sandi, token, secret, dan URL menjadi
        `[REDACTED]`) sehingga aman ditampilkan apa adanya.
      properties:
        id: { type: string, format: uuid }
        at:
          type: string
          format: date-time
          description: Waktu kejadian (UTC; UI menampilkannya sebagai WIB).
        actor_kind: { type: string, enum: [admin, branch, system] }
        actor_id:
          type: string
          description: id akun pelaku (UUID); kosong untuk aktor sistem.
        actor_nama: { type: string, description: Nama pelaku saat aksi dilakukan. }
        ip: { type: string, description: Alamat IP asal permintaan; kosong untuk pekerjaan latar. }
        entity:
          type: string
          description: Jenis objek yang berubah (mis. `order`, `branch`, `admin_user`).
        entity_id: { type: string, description: id objek terkait (UUID); boleh kosong. }
        action:
          type: string
          description: Aksi yang dilakukan (mis. `create`, `update`, `verify`, `revise`, `reset`).
        before:
          description: Snapshot sebelum mutasi (null bila tidak ada), sudah diredaksi.
        after:
          description: Snapshot sesudah mutasi (null bila tidak ada), sudah diredaksi.
    AuditLogFilter:
      type: object
      description: Filter yang benar-benar dipakai untuk halaman ini.
      properties:
        entitas: { type: array, items: { type: string } }
        aksi: { type: string }
        aktor: { type: string, description: Kata kunci aktor seperti yang diminta klien. }
        dari:
          type: string
          description: Tanggal awal rentang (YYYY-MM-DD, WIB).
        sampai:
          type: string
          description: Tanggal akhir rentang (YYYY-MM-DD, WIB).
        halaman: { type: integer }
        per_halaman: { type: integer }
    AuditLogPage:
      type: object
      required: [items, total, halaman, per_halaman, total_halaman, filter]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        total:
          type: integer
          format: int64
          description: Jumlah seluruh entri yang lolos filter (bukan hanya halaman ini).
        halaman: { type: integer }
        per_halaman: { type: integer }
        total_halaman: { type: integer }
        filter: { $ref: "#/components/schemas/AuditLogFilter" }

security:
  - cookieAuth: []
