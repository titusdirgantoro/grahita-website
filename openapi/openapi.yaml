  /api/v1/admin/bank-accounts/{id}:
    put:
      tags: [admin]
      operationId: updateBankAccount
      summary: Ubah / aktif-nonaktifkan rekening (Superadmin)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountUpdate" }
      responses:
        "200":
          description: Rekening tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BankAccount" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/branch:
    get:
      tags: [admin]
      operationId: listBranchUsers
      summary: Daftar akun cabang (Manager & Superadmin)
      description: |
        Satu baris per CABANG (1 cabang = 1 akun, PRD BR-01), termasuk cabang
        yang belum registrasi. `status` bernilai `aktif`, `belum_registrasi`,
        atau `nonaktif`; `nonaktif` juga dipakai bila CABANG-nya dinonaktifkan
        karena keadaan itu sama-sama membuat akun tidak bisa login.
      responses:
        "200":
          description: Daftar akun cabang beserta status dan login terakhir
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BranchUser" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/users/branch/{id}:
    put:
      tags: [admin]
      operationId: setBranchUserActive
      summary: Aktifkan/nonaktifkan akun cabang (Manager & Superadmin)
      description: |
        `id` adalah id AKUN (`branch_users.id`), bukan id cabang. Menonaktifkan
        akun langsung mencabut seluruh sesi akun tersebut sehingga akses
        berhenti saat itu juga (PRD AP-CAB-03).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              additionalProperties: false
              properties:
                is_active: { type: boolean }
      responses:
        "200":
          description: Akun cabang setelah perubahan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BranchUser" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users/branch/{id}/reset:
    post:
      tags: [admin]
      operationId: resendBranchUserReset
      summary: Kirim ulang tautan atur ulang kata sandi akun cabang
      description: |
        Memakai jalur email yang sama dengan lupa kata sandi; tautan berlaku
        `reset_menit` (default 60 menit) dan hanya bisa dipakai sekali. Email
        dialihkan ke email_outbox pada kartu F1-16 tanpa mengubah handler ini.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Permintaan pengiriman ulang diterima
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [pesan]
                    properties:
                      pesan: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Cabang belum punya akun (`NO_ACCOUNT`) atau akun/cabangnya sedang
            nonaktif (`ACCOUNT_INACTIVE`) sehingga tidak boleh memegang tautan.
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/admin:
    get:
      tags: [admin]
      operationId: listAdminUsers
      summary: Daftar akun admin (Superadmin)
      description: |
        `status` bernilai `undangan` (belum mengaktivasi akun), `aktif`, atau
        `nonaktif`. Admin undangan tidak bisa login dan tidak menerima email
        dokumen (PRD AP-USR-02).
      responses:
        "200":
          description: Daftar akun admin
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      operationId: inviteAdmin
      summary: Undang admin baru (Superadmin)
      description: |
        Akun dibuat TANPA kata sandi sehingga belum bisa login dan belum
        menerima email dokumen. Email undangan berisi tautan aktivasi sekali
        pakai dan diantre lewat email_outbox (F1-16) — tautan aslinya tidak
        pernah dikembalikan endpoint ini. Tautan berlaku `token_hari` (default
        14 hari).

        Email yang sudah dipakai akun admin LAIN maupun akun/email cabang
        ditolak dengan `409 EMAIL_TAKEN`: login mencari akun admin lebih dulu,
        jadi email milik cabang tidak boleh dipegang admin (kalau tidak, akun
        cabang itu tidak akan pernah bisa masuk).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama, email, role]
              additionalProperties: false
              properties:
                nama: { type: string, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                role: { type: string, enum: [manager, superadmin] }
                notif_invoice: { type: boolean, default: false }
                notif_surat_jalan: { type: boolean, default: false }
      responses:
        "201":
          description: Undangan dibuat; email diantre ke outbox
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminUser" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/admin/{id}:
    put:
      tags: [admin]
      operationId: updateAdminUser
      summary: Ubah role, flag email dokumen, atau status admin (Superadmin)
      description: |
        Field yang tidak dikirim tidak diubah. Superadmin aktif TERAKHIR tidak
        boleh dinonaktifkan atau diturunkan menjadi Manager, termasuk bila dua
        permintaan datang bersamaan (`409 LAST_SUPERADMIN`, PRD AP-USR-03).

        "Aktif" di sini berarti superadmin yang benar-benar BISA LOGIN
        (`is_active` DAN sudah diaktivasi). Superadmin yang masih berstatus
        undangan (belum mengaktivasi akunnya sehingga tidak bisa masuk) TIDAK
        dihitung sebagai pelindung, supaya sistem tidak pernah ditinggalkan
        tanpa satu pun superadmin yang bisa login.

        Menonaktifkan admin mencabut seluruh sesinya.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nama: { type: string, maxLength: 120 }
                role: { type: string, enum: [manager, superadmin] }
                notif_invoice: { type: boolean }
                notif_surat_jalan: { type: boolean }
                is_active: { type: boolean }
      responses:
        "200":
          description: Akun admin setelah perubahan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminUser" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/admin/{id}/resend:
    post:
      tags: [admin]
      operationId: resendAdminInvitation
      summary: Kirim ulang tautan aktivasi admin undangan (Superadmin)
      description: |
        Jalan pemulihan bila email undangan pertama gagal terkirim: tautan
        aktivasi dibuat ULANG (tautan lama otomatis batal, satu tautan aktif per
        akun) dan email undangan diantre ulang lewat email_outbox.

        Hanya berlaku untuk admin yang masih berstatus `undangan`. Akun yang
        sudah mengaktivasi (atau sudah dinonaktifkan) dijawab
        `409 NOT_INVITED` dan memakai alur lupa kata sandi biasa. Memanggil
        berulang tidak membuat akun baru. Tautan aslinya tidak pernah
        dikembalikan endpoint ini.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Tautan aktivasi dibuat ulang dan email undangan diantre
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminUser" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/orders/{id}/emails:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      operationId: listOrderEmails
      summary: Riwayat email satu pesanan (Manager & Superadmin)
      description: |
        Menampilkan setiap email transaksional pesanan itu beserta statusnya:
        `queued` (menunggu), `sending` (sedang dikirim), `sent` (terkirim), atau
        `failed` (gagal setelah percobaannya habis: 1 percobaan + 5 retry
        berjenjang). Email gagal tampil di sini lengkap dengan `last_error` dan
        dapat dikirim ulang lewat endpoint resend (PRD EM-02/EM-03).
      responses:
        "200":
          description: Riwayat email pesanan (terbaru lebih dulu)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EmailOutbox" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/orders/{id}/emails/{kind}/resend:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: kind
        in: path
        required: true
        description: Jenis email dokumen yang dikirim ulang.
        schema:
          type: string
          enum: [invoice_cabang, invoice_admin, surat_jalan_admin]
    post:
      tags: [admin]
      operationId: resendOrderEmail
      summary: Kirim ulang email dokumen pesanan (Manager & Superadmin)
      description: |
        Membuat baris email_outbox BARU untuk pesanan itu, lalu worker
        mengirimnya. Sifatnya:

        - hanya untuk email yang MEMANG pernah dibuat untuk pesanan tersebut;
          pesanan/jenis yang belum pernah punya email dijawab `404`
          (endpoint ini bukan cara memicu email ke alamat sembarang);
        - penerima dihitung ULANG dari keadaan sekarang: email Pusat hanya ke
          admin aktif yang sudah diaktivasi dan flag `notif_invoice` /
          `notif_surat_jalan` menyala; admin undangan/nonaktif tidak pernah
          menerima. Bila tidak ada penerima yang berhak dijawab
          `409 NO_RECIPIENT`;
        - dokumen harus sudah selesai dirender; bila belum, dijawab
          `409 DOCUMENT_NOT_READY` (lampiran tidak pernah menunggu di dalam
          worker);
        - ditolak `409 EMAIL_ALREADY_QUEUED` bila masih ada email jenis yang
          sama dalam antrean, sehingga klik ganda tidak menggandakan email;
        - setiap kirim ulang dicatat di `audit_logs` (`entity` = `email`,
          `action` = `resend`).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: Email diantre ulang
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/EmailOutbox" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/orders/{id}/proofs:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
    get:
      tags: [admin]
      operationId: adminListOrderProofs
      summary: Daftar bukti transfer satu pesanan (Manager & Superadmin)
      description: |
        Sama seperti sisi cabang, tetapi tanpa batas cabang: admin melihat
        bukti pesanan cabang mana pun (PRD §2.1, AP-ORD-04).
      responses:
        "200":
          description: Daftar bukti transfer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PaymentProof" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [admin]
      operationId: adminUploadOrderProofs
      summary: Unggah bukti transfer ATAS NAMA cabang (Manager & Superadmin)
      description: |
        Aturan berkas identik dengan unggahan cabang (magic bytes, batas
        `max_file`/`max_mb`, SHA-256 unik per pesanan). Yang membedakan: baris
        bukti mencatat pengunggahnya sebagai `uploaded_by_kind: admin` beserta
        NAMA admin, dan peristiwanya masuk timeline pesanan dengan penanda nama
        itu (PRD AP-ORD-06).

        Admin boleh menambah bukti pada pesanan berstatus apa pun (termasuk
        `done`) karena revisi/koreksi adalah hak Pusat (BR-07).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "201":
          description: Bukti tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PaymentProof" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/admin/orders/{id}/proofs/{proofId}/download:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
      - name: proofId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      operationId: adminDownloadOrderProof
      summary: Tautan unduh berumur pendek satu bukti (Manager & Superadmin)
      description: |
        Presigned URL berumur pendek untuk pratinjau/zoom bukti di admin —
        termasuk untuk pesanan cabang mana pun (AP-ORD-04).
      responses:
        "200":
          description: Tautan unduh
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PaymentProofDownload" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: grahita_session
      description: |
        Cookie sesi host-only. Browser mengirimnya otomatis selama request
        same-origin; tidak ada token bearer.

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Nilai cookie `grahita_csrf` (double-submit).
      schema: { type: string }
    OrderIdPath:
      name: id
      in: path
      required: true
      description: id pesanan (UUID).
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: Data yang dikirim tidak valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: VALIDATION_FAILED
              message: Data yang dikirim belum lengkap atau tidak valid.
              fields:
                email: format email tidak valid
    Unauthenticated:
      description: Belum masuk atau sesi sudah berakhir
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: UNAUTHENTICATED
              message: Anda harus masuk terlebih dahulu.
    Forbidden:
      description: Sudah masuk tetapi role tidak berhak
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: FORBIDDEN
              message: Anda tidak memiliki akses ke tindakan ini.
    NotFound:
      description: Data atau endpoint tidak ditemukan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: NOT_FOUND
              message: Endpoint tidak ditemukan.
    RateLimited:
      description: Terlalu banyak percobaan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: RATE_LIMITED
              message: Terlalu banyak percobaan masuk. Coba lagi beberapa saat lagi.
    PayloadTooLarge:
      description: Badan permintaan melebihi batas unggahan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: Total ukuran berkas bukti melebihi batas unggahan.
    Unavailable:
      description: Layanan pendukung (object storage) belum siap
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: UNAVAILABLE
              message: Penyimpanan berkas belum siap sehingga bukti tidak dapat disimpan.
    Conflict:
      description: Permintaan bertentangan dengan aturan data
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            emailTaken:
              value:
                error:
                  code: EMAIL_TAKEN
                  message: Email tersebut sudah dipakai akun lain.
            lastSuperadmin:
              value:
                error:
                  code: LAST_SUPERADMIN
                  message: Superadmin aktif terakhir tidak boleh dinonaktifkan atau diturunkan menjadi Manager.
            noAccount:
              value:
                error:
                  code: NO_ACCOUNT
                  message: Cabang ini belum punya akun. Buat token registrasi lebih dahulu di halaman Cabang.
            accountInactive:
              value:
                error:
                  code: ACCOUNT_INACTIVE
                  message: Akun cabang ini sedang nonaktif; aktifkan dulu sebelum mengirim tautan atur ulang.
            branchHasOrders:
              value:
                error:
                  code: BRANCH_HAS_ORDERS
                  message: Cabang ini sudah punya pesanan sehingga tidak bisa dihapus; nonaktifkan saja cabangnya.
            branchHasAccount:
              value:
                error:
                  code: BRANCH_HAS_ACCOUNT
                  message: Cabang ini sudah punya akun, jadi token registrasi tidak diperlukan lagi. Pemulihan akses lewat lupa kata sandi.
            branchInactive:
              value:
                error:
                  code: BRANCH_INACTIVE
                  message: Cabang sedang nonaktif; aktifkan dulu sebelum membuat token registrasi.

  schemas:
    PaymentProof:
      type: object
      required: [id, order_id, nama_file, mime_type, ukuran_byte, sha256, uploaded_by_kind, created_at]
      description: |
        Metadata satu bukti transfer. Isi berkasnya tidak pernah ada di sini —
        hanya tautan unduh berumur pendek dari endpoint `.../download`.
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        nama_file:
          type: string
          description: Nama berkas asli (sudah dibersihkan dari komponen direktori dan karakter kendali).
        mime_type:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
        ukuran_byte: { type: integer, format: int64 }
        sha256:
          type: string
          description: |
            Sidik jari SHA-256 isi berkas (hex). Wajib unik per pesanan: berkas
            dengan isi sama tidak bisa diunggah dua kali (SystemDesign.md §5.3).
        uploaded_by_kind: { type: string, enum: [branch, admin] }
        uploaded_by_id: { type: string, format: uuid }
        uploaded_by_nama:
          type: string
          description: Nama admin pengunggah (PRD AP-ORD-06); kosong untuk unggahan cabang.
        created_at: { type: string, format: date-time }
    PaymentProofDownload:
      type: object
      required: [url, expires_in]
      properties:
        url:
          type: string
          format: uri
          description: Presigned URL berumur pendek dengan Content-Disposition attachment.
        expires_in:
          type: integer
          description: Masa berlaku tautan dalam detik.
        nama_file: { type: string }
        mime_type: { type: string }
    OrderLine:
      type: object
      required: [line_no, jenis, nama, satuan, qty, harga_satuan, subtotal]
      properties:
        line_no: { type: integer }
        jenis:
          type: string
          enum: [product, packaging]
          description: |
            `product` = baris produk pesanan; `packaging` = baris biaya
            packaging yang ditambahkan server pada pesanan Sertifikat (tepat
            satu baris, qty 1, tanpa product_id) dan tidak bisa diedit atau
            dihapus klien (PRD CP-SER-02).
        product_id:
          type: string
          format: uuid
          description: Kosong pada baris `packaging`.
        nama:
          type: string
          description: Snapshot nama produk saat dipesan (BR-05).
        satuan: { type: string }
        qty: { type: integer, minimum: 1 }
        harga_satuan:
          type: integer
          format: int64
          minimum: 0
          description: |
            Harga khusus cabang yang diambil server dari branch_prices. Untuk
            produk Sertifikat nilainya selalu 0 berapa pun qty-nya (CP-SER-01).
        subtotal: { type: integer, format: int64 }
        serial_number:
          type: string
          description: |
            Hanya terisi setelah submit (BR-02); draft tanpa serial, dan baris
            `packaging` tidak pernah mendapat serial number.

    Order:
      type: object
      required:
        [id, status, verif_status, versi, is_cnc, is_sertifikat, catatan, total, jumlah_item, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        nomor:
          type: string
          description: Kosong selama masih draft (BR-09); berisi YYYY-MM-XX setelah submit.
        status: { type: string, enum: [draft, submitted, done] }
        verif_status: { type: string, enum: [belum, cocok, perlu_review] }
        versi: { type: integer }
        is_cnc: { type: boolean }
        is_sertifikat: { type: boolean }
        tanggal:
          type: string
          description: Tanggal submit (WIB) YYYY-MM-DD; kosong selama draft (BR-04).
        jatuh_tempo: { type: string }
        catatan: { type: string }
        total:
          type: integer
          format: int64
          description: Dihitung server dari baris pesanan, bukan dari klien (BR-10).
        jumlah_item: { type: integer, format: int64 }
        submitted_at: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }

    OrderDraftLineInput:
      type: object
      description: |
        Satu baris editor pesanan. Hanya product_id dan qty yang diterima:
        harga satuan, subtotal, dan total dihitung server, dan field lain
        (mis. "harga" atau "total") ditolak `400` oleh dekoder JSON.
      required: [product_id, qty]
      additionalProperties: false
      properties:
        product_id:
          type: string
          format: uuid
          description: Harus produk yang punya baris harga untuk cabang sesi.
        qty: { type: integer, minimum: 1 }

    OrderDraftInput:
      type: object
      description: Body POST/PUT draft pesanan (PRD CP-ORD-02/03).
      required: [lines]
      additionalProperties: false
      properties:
        catatan: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/OrderDraftLineInput" }

    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Kode mesin yang stabil
              enum:
                [
                  VALIDATION_FAILED,
                  UNAUTHENTICATED,
                  FORBIDDEN,
                  NOT_FOUND,
                  CONFLICT,
                  RATE_LIMITED,
                  CSRF_INVALID,
                  RESET_INVALID,
                  TOKEN_INVALID,
                  TOKEN_EXPIRED,
                  TOKEN_USED,
                  EMAIL_TAKEN,
                  LAST_SUPERADMIN,
                  NO_ACCOUNT,
                  ACCOUNT_INACTIVE,
                  BRANCH_HAS_ORDERS,
                  BRANCH_HAS_ACCOUNT,
                  BRANCH_INACTIVE,
                  BANK_DUPLICATE,
                  KODE_TAKEN,
                  PRODUCT_IN_USE,
                  ORDER_LOCKED,
                  PROOF_LIMIT,
                  PROOF_DUPLICATE,
                  PAYLOAD_TOO_LARGE,
                  TIMEOUT,
                  METHOD_NOT_ALLOWED,
                  BRANCH_MISSING,
                  UNAVAILABLE,
                  INTERNAL,
                ]
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Kesalahan per field untuk ditempelkan ke form

    Readiness:
      type: object
      required: [status, version, checks]
      properties:
        status: { type: string, enum: [ready, "not ready"] }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: string }
          example:
            database: ok
            migrations: ok (versi 2)
            storage: tidak dikonfigurasi
            gotenberg: ok
            smtp: ok

    User:
      type: object
      required: [id, kind, role, nama, email]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [branch, admin] }
        role: { type: string, enum: [branch, manager, superadmin] }
        branch_id: { type: string, format: uuid }
        nama: { type: string }
        email: { type: string, format: email }

    UserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user: { $ref: "#/components/schemas/User" }

    Product:
      type: object
      required: [id, nama, jenis, satuan, harga_default, urutan, is_active]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        jenis: { type: string, enum: [reguler, sertifikat] }
        satuan: { type: string }
        deskripsi: { type: string }
        harga_default: { type: integer, format: int64, minimum: 0 }
        urutan: { type: integer }
        is_active: { type: boolean }

    ProductInput:
      type: object
      description: Body pembuatan produk (PRD §4.5 AP-KAT-01).
      required: [nama]
      additionalProperties: false
      properties:
        kode: { type: string, maxLength: 40 }
        nama: { type: string, minLength: 2, maxLength: 160 }
        jenis: { type: string, enum: [reguler, sertifikat], default: reguler }
        satuan: { type: string, minLength: 1, maxLength: 40, default: pcs }
        deskripsi: { type: string, maxLength: 500 }
        harga_default:
          type: integer
          format: int64
          minimum: 0
          description: Wajib 0 untuk produk Sertifikat.
        urutan: { type: integer, minimum: 0 }
        is_active:
          type: boolean
          description: Kosong berarti aktif (default produk baru).

    ProductUpdate:
      type: object
      description: Body perubahan produk; hanya field yang dikirim yang diubah.
      additionalProperties: false
      properties:
        kode: { type: string, maxLength: 40 }
        nama: { type: string, minLength: 2, maxLength: 160 }
        jenis: { type: string, enum: [reguler, sertifikat] }
        satuan: { type: string, minLength: 1, maxLength: 40 }
        deskripsi: { type: string, maxLength: 500 }
        harga_default: { type: integer, format: int64, minimum: 0 }
        urutan: { type: integer, minimum: 0 }
        is_active: { type: boolean }

    PriceMatrix:
      type: object
      description: |
        Grid Produk × Cabang. `sel` hanya memuat sel yang berisi harga; sel
        yang tidak ada berarti produk tidak dijual ke cabang tersebut.
      required: [produk, cabang, sel]
      properties:
        produk:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        cabang:
          type: array
          items: { $ref: "#/components/schemas/MatrixBranch" }
        sel:
          type: array
          items: { $ref: "#/components/schemas/PriceCell" }

    MatrixBranch:
      type: object
      description: Kolom cabang pada matriks harga.
      required: [id, nama, is_active]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
        is_active: { type: boolean }

    PriceCell:
      type: object
      required: [branch_id, product_id, harga]
      properties:
        branch_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        harga: { type: integer, format: int64, minimum: 0 }

    PriceBatchInput:
      type: object
      description: Batch edit sel matriks harga.
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [branch_id, product_id]
            additionalProperties: false
            properties:
              branch_id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              harga:
                type: [integer, "null"]
                format: int64
                minimum: 0
                description: Kosong/null berarti sel dikosongkan (tidak dijual).

    PriceResult:
      type: object
      required: [diubah, dihapus, diabaikan]
      properties:
        diubah: { type: integer, description: Sel baru atau berubah nilainya. }
        dihapus: { type: integer, description: Sel yang dikosongkan. }
        diabaikan: { type: integer, description: Sel yang nilainya sama dengan sekarang. }

    PriceCopyInput:
      type: object
      required: [from_branch_id]
      additionalProperties: false
      properties:
        from_branch_id: { type: string, format: uuid }
        to_branch_ids:
          type: array
          items: { type: string, format: uuid }
        semua:
          type: boolean
          description: Salin ke seluruh cabang lain. Kosong berarti pakai `to_branch_ids`.

    PriceCopyResult:
      type: object
      required: [from_branch_id, jumlah, salinan]
      properties:
        from_branch_id: { type: string, format: uuid }
        jumlah: { type: integer, description: Jumlah sel yang disalin dari sumber. }
        salinan:
          type: array
          items:
            type: object
            required: [branch_id, jumlah, diubah]
            properties:
              branch_id: { type: string, format: uuid }
              jumlah: { type: integer }
              diubah: { type: integer, description: Sel yang nilainya benar-benar berubah. }

    BranchProduct:
      type: object
      description: Produk beserta harga khusus cabang (Rupiah bulat)
      required: [id, nama, jenis, satuan, harga, urutan]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
        jenis: { type: string, enum: [reguler, sertifikat] }
        satuan: { type: string }
        deskripsi: { type: string }
        harga: { type: integer, format: int64, minimum: 0 }
        urutan: { type: integer }
        biaya_packaging:
          type: integer
          format: int64
          minimum: 0
          description: |
            Hanya ada pada produk Sertifikat: biaya packaging per pesanan yang
            ditambahkan otomatis, senilai setelan `biaya_packaging` yang sedang
            berlaku (PRD CP-KAT-04, CP-SER-02). Angka final tetap dihitung
            server saat draft disimpan dan saat submit.

    BankAccount:
      type: object
      description: Rekening bank tujuan transfer (PRD §4.6).
      required: [id, bank, nama_pemilik, nomor, is_active]
      properties:
        id: { type: string, format: uuid }
        bank: { type: string, enum: [BCA, BRI] }
        nama_pemilik: { type: string }
        nomor: { type: string, pattern: "^[0-9]{6,34}$" }
        is_active: { type: boolean }

    BankAccountInput:
      type: object
      description: Body pembuatan rekening (PRD §4.6).
      required: [bank, nama_pemilik, nomor]
      additionalProperties: false
      properties:
        bank: { type: string, enum: [BCA, BRI] }
        nama_pemilik: { type: string, minLength: 2, maxLength: 120 }
        nomor: { type: string, minLength: 6, maxLength: 34, pattern: "^[0-9]{6,34}$" }
        is_active:
          type: boolean
          description: Kosong berarti aktif (default rekening baru).

    BankAccountUpdate:
      type: object
      description: Body perubahan rekening; hanya field yang dikirim yang diubah.
      additionalProperties: false
      properties:
        bank: { type: string, enum: [BCA, BRI] }
        nama_pemilik: { type: string, minLength: 2, maxLength: 120 }
        nomor: { type: string, minLength: 6, maxLength: 34, pattern: "^[0-9]{6,34}$" }
        is_active: { type: boolean }

    SettingValue:
      description: |-
        Nilai pengaturan: bilangan bulat (Rupiah tanpa sen), boolean, atau
        objek `ai`.
      oneOf:
        - type: integer
        - type: boolean
        - type: object
          additionalProperties: true

    Branch:
      type: object
      description: |
        Data cabang milik sesi (profil cabang). Seluruh field READ-ONLY di
        portal cabang: nama, kepala cabang, email, dan telepon adalah data
        master yang dikelola admin Pusat (PRD §3.8), dan API tidak menyediakan
        rute tulis untuknya.
      required: [id, nama, nama_kepala, email, telepon, is_cnc, is_special, pajak_in, is_active]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
        nama_kepala: { type: string }
        email: { type: string, format: email }
        telepon: { type: string }
        is_cnc: { type: boolean }
        is_special: { type: boolean }
        pajak_in: { type: boolean }
        is_active: { type: boolean }
        token_prefix:
          type: string
          description: 8 karakter pertama token registrasi yang masih berlaku (bila ada).
        token_expires_at: { type: string, format: date-time }

    BranchInput:
      type: object
      description: Body pembuatan cabang (PRD §4.4).
      required: [nama, nama_kepala, email]
      additionalProperties: false
      properties:
        nama: { type: string, minLength: 2, maxLength: 120 }
        nama_kepala: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        telepon: { type: string, maxLength: 40 }
        is_cnc: { type: boolean }
        is_special: { type: boolean }
        pajak_in: { type: boolean }
        is_active:
          type: boolean
          description: Kosong berarti aktif (default cabang baru).

    BranchUpdate:
      type: object
      description: Body perubahan cabang; hanya field yang dikirim yang diubah.
      additionalProperties: false
      properties:
        nama: { type: string, minLength: 2, maxLength: 120 }
        nama_kepala: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        telepon: { type: string, maxLength: 40 }
        is_cnc: { type: boolean }
        is_special: { type: boolean }
        pajak_in: { type: boolean }
        is_active: { type: boolean }

    RegistrationToken:
      type: object
      description: |
        Token registrasi sekali pakai. `token` adalah nilai asli dan hanya
        ditampilkan pada respons pembuatan; penyimpanan di database hanya
        memuat hash SHA-256 beserta `prefix`-nya.
      required: [token, prefix, expires_at]
      properties:
        token:
          type: string
          example: GRH-7K2M-QW3Z-9TPL-XB4N
        prefix:
          type: string
          description: 8 karakter pertama token, untuk ditampilkan ulang di Admin Portal.
        expires_at: { type: string, format: date-time }

    BranchUser:
      type: object
      description: |
        Satu baris tab "User cabang": data cabang beserta akunnya. `user_id`
        kosong berarti cabang belum registrasi (belum punya akun).
      required: [branch_id, nama, nama_kepala, email, has_account, is_active, branch_active, status]
      properties:
        branch_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        nama: { type: string }
        nama_kepala: { type: string }
        email: { type: string, format: email }
        telepon: { type: string }
        has_account: { type: boolean }
        is_active: { type: boolean }
        branch_active: { type: boolean }
        status: { type: string, enum: [aktif, belum_registrasi, nonaktif] }
        last_login_at: { type: string, format: date-time }
        token_prefix:
          type: string
          description: 8 karakter pertama token registrasi yang masih berlaku (bila ada).
        token_expires_at: { type: string, format: date-time }

    AdminUser:
      type: object
      description: |
        Akun admin Pusat. `status` = undangan | aktif | nonaktif; admin
        undangan belum punya kata sandi sehingga tidak bisa login dan tidak
        menerima email dokumen.
      required: [id, nama, email, role, notif_invoice, notif_surat_jalan, is_active, status]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [manager, superadmin] }
        notif_invoice: { type: boolean }
        notif_surat_jalan: { type: boolean }
        is_active: { type: boolean }
        status: { type: string, enum: [undangan, aktif, nonaktif] }
        invited_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }

    EmailOutbox:
      type: object
      description: |
        Satu email transaksional di tabel `email_outbox`. Email tidak pernah
        dikirim langsung dari handler HTTP: service menulis baris ini di dalam
        transaksinya, worker memindai dan mengirimnya, lalu memperbarui status.
      required: [id, jenis, to_addr, subject, status, attempts, next_try_at, created_at]
      properties:
        id: { type: string, format: uuid }
        order_id:
          type: string
          format: uuid
          description: Kosong untuk email yang tidak terikat pesanan (reset/undangan).
        jenis:
          type: string
          enum: [reset_password, undangan_admin, invoice_cabang, invoice_admin, surat_jalan_admin, reminder_cnc]
        to_addr: { type: array, items: { type: string, format: email } }
        cc_addr: { type: array, items: { type: string, format: email } }
        subject: { type: string }
        payload:
          type: object
          additionalProperties: true
          description: |
            Data template + daftar lampiran (`lampiran`: storage_key, nama,
            content_type). Nilai token/tautan mentah TIDAK pernah dikembalikan
            ke API selain di dalam payload baris ini yang hanya untuk admin.
        status:
          type: string
          enum: [queued, sending, sent, failed]
          description: |
            `failed` berarti percobaannya sudah habis: satu percobaan pertama
            ditambah 5 percobaan ulang berjenjang (1m, 5m, 30m, 2j, 6j). Baris
            `sending` yang prosesnya mati akan diklaim ulang setelah masa sewa
            klaim habis, dan baris `sending` yang percobaannya habis ditandai
            `failed` pada pemindaian berikutnya. Baris `sent` tidak pernah
            dikirim ulang oleh worker.
        attempts: { type: integer, minimum: 0 }
        next_try_at: { type: string, format: date-time }
        last_error: { type: string }
        sent_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

security:
  - cookieAuth: []
