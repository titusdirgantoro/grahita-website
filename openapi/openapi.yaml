openapi: 3.1.0
info:
  title: Grahita Portal API
  version: 0.1.0
  description: |
    API untuk Sistem Pemesanan Cabang Grahita Indonesia (modular monolith Go).

    Kontrak yang berlaku untuk SELURUH endpoint:
    - Semua endpoint bisnis berada di bawah `/api/v1` dan selalu same-origin
      pada host portal yang bersangkutan (`grahita-branch.tiusclaw.com` untuk
      cabang, `grahita-admin.tiusclaw.com` untuk admin).
    - Autentikasi memakai cookie sesi **host-only** (`HttpOnly`, `SameSite=Lax`,
      `Secure` di luar lokal) yang nilainya disimpan sebagai hash di PostgreSQL.
    - Setiap request non-GET wajib membawa header `X-CSRF-Token` yang nilainya
      sama dengan cookie `grahita_csrf` (double-submit).
    - Respons sukses dibungkus `{ "data": ... }`; respons gagal berbentuk
      `{ "error": { "code", "message", "fields"? } }`.
    - Otorisasi selalu ditentukan role akun di server, bukan hostname.
  license:
    name: Proprietary
servers:
  - url: https://grahita-branch.tiusclaw.com
    description: Customer Portal (cabang)
  - url: https://grahita-admin.tiusclaw.com
    description: Admin Portal (Pusat)
  - url: http://localhost:8088
    description: Pengembangan lokal

tags:
  - name: health
  - name: meta
  - name: auth
  - name: customer
  - name: admin

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness — proses hidup (tidak menyentuh dependensi)
      security: []
      responses:
        "200":
          description: Proses hidup
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }

  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Readiness — dependensi wajib siap melayani
      description: |
        `database` dan `migrations` bersifat wajib (503 bila gagal).
        `storage`, `gotenberg`, dan `smtp` diperiksa hanya bila dikonfigurasi.
      security: []
      responses:
        "200":
          description: Siap melayani
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Belum siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /api/v1/meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Informasi runtime untuk kedua SPA
      security: []
      responses:
        "200":
          description: Informasi aplikasi
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [app, version, env, api_base, customer_host, admin_host, waktu_wib]
                    properties:
                      app: { type: string }
                      version: { type: string }
                      env: { type: string, enum: [local, staging, production] }
                      api_base: { type: string, const: /api/v1 }
                      customer_host: { type: string, example: grahita-branch.tiusclaw.com }
                      admin_host: { type: string, example: grahita-admin.tiusclaw.com }
                      waktu_wib: { type: string, format: date-time }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Masuk ke portal (identitas ditentukan konteks akun, bukan host)
      security: []
      description: |
        Endpoint ini dikecualikan dari pemeriksaan CSRF. Percobaan GAGAL
        dibatasi 5 kali per 15 menit, dihitung terpisah per akun dan per IP
        (PRD CP-AUT-05); melampaui batas menghasilkan `429 RATE_LIMITED`
        sebelum kata sandi diperiksa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "200":
          description: Berhasil masuk; cookie sesi dipasang (host-only)
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                `grahita_session=...; Path=/; HttpOnly; SameSite=Lax` (ditambah
                `Secure` di luar lingkungan lokal). Tanpa atribut `Domain`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Keluar — mencabut sesi dan menghapus cookie
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Sesi dicabut
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Profil, role, dan cabang pengguna yang sedang masuk
      responses:
        "200":
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      tags: [auth]
      operationId: updateCurrentUser
      summary: Ubah nama tampilan profil sendiri (PRD §4.10)
      description: |
        Hanya `nama` yang bisa diubah pemiliknya. `email` dan `role` read-only:
        mengirimnya (atau field asing lain) ditolak `400` karena skema
        `additionalProperties: false`, dan role hanya bisa diubah Superadmin
        lewat user management. Akun cabang dijawab `403` — nama, kepala cabang,
        email, dan telepon cabang adalah data master Pusat yang read-only di
        portal cabang (PRD §3.8).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama]
              additionalProperties: false
              properties:
                nama: { type: string, minLength: 2, maxLength: 120 }
      responses:
        "200":
          description: Nama tersimpan; sesi lain memakai nama yang sama pada request berikutnya
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Kirim tautan atur ulang kata sandi (respons selalu sama)
      security: []
      description: |
        Endpoint publik, dikecualikan dari pemeriksaan CSRF. Respons SELALU
        `200` dengan pesan yang sama — email terdaftar maupun tidak — supaya
        keberadaan akun tidak bisa ditebak (PRD CP-AUT-03). Tautan berlaku
        `reset_menit` (default 60 menit) dan hanya bisa dipakai sekali; meminta
        tautan baru membatalkan tautan lama yang belum dipakai.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "200":
          description: Permintaan diterima (pesan identik untuk semua email)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [pesan]
                    properties:
                      pesan: { type: string }
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set kata sandi baru dengan token sekali pakai
      security: []
      description: |
        Endpoint publik, dikecualikan dari pemeriksaan CSRF. Token berlaku
        `reset_menit` dan hanya bisa dipakai sekali; setelah berhasil SELURUH
        sesi pengguna dicabut (PRD CP-AUT-04, CP-AUT-07). Kata sandi divalidasi
        sebelum token dipakai, sehingga percobaan dengan kata sandi lemah tidak
        membakar tautan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              additionalProperties: false
              properties:
                token: { type: string, maxLength: 512 }
                password: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "204":
          description: Kata sandi tersimpan; seluruh sesi pengguna dicabut
        "400":
          description: Token tidak valid/kedaluwarsa/sudah dipakai, atau kata sandi lemah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: RESET_INVALID
                  message: Tautan atur ulang tidak valid, sudah dipakai, atau kedaluwarsa. Minta tautan baru.
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/password/change:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Ganti kata sandi saat login (verifikasi kata sandi lama)
      description: |
        Wajib login dan wajib CSRF. Sesi yang sedang dipakai tetap hidup,
        sedangkan sesi LAIN milik pengguna yang sama dicabut (PRD CP-AUT-06,
        CP-AUT-07).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_lama, password_baru]
              additionalProperties: false
              properties:
                password_lama: { type: string, minLength: 8, maxLength: 200 }
                password_baru: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "204":
          description: Kata sandi diganti; sesi lain dicabut
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/registration/validate:
    post:
      tags: [auth]
      operationId: validateRegistrationToken
      summary: Langkah 1 pendaftaran — validasi token registrasi cabang
      security: []
      description: |
        Endpoint publik, dikecualikan dari CSRF dan dibatasi per IP. Memeriksa
        token registrasi (format, ada, belum dipakai, belum kedaluwarsa, cabang
        aktif, cabang belum punya akun) lalu mengembalikan data cabang yang akan
        tampil terisi dan READ-ONLY pada langkah 2 (PRD CP-REG-02/CP-REG-03).
        Setiap keadaan salah dijawab dengan kode yang spesifik
        (`TOKEN_INVALID`, `TOKEN_EXPIRED`, `TOKEN_USED`, `BRANCH_INACTIVE`,
        `BRANCH_HAS_ACCOUNT`) supaya pengguna tahu harus berbuat apa
        (PRD CP-REG-07).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Token sah; data cabang untuk langkah 2
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [nama_cabang, nama_kepala, email]
                    additionalProperties: false
                    properties:
                      nama_cabang: { type: string }
                      nama_kepala: { type: string }
                      email: { type: string, format: email }
        "400":
          description: Token tidak valid atau kedaluwarsa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: Token sudah dipakai, cabang nonaktif, atau cabang sudah punya akun
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: registerBranch
      summary: Langkah 2 pendaftaran — buat akun cabang dengan token registrasi
      security: []
      description: |
        Endpoint publik, dikecualikan dari CSRF dan dibatasi per IP. Memakai
        token registrasi TEPAT sekali lalu membuat akun cabang: nomor telepon
        dan kata sandi (minimal 8 karakter, harus sama dengan konfirmasinya)
        diisi pengguna, sedangkan nama cabang, nama kepala cabang, dan email
        diambil server dari data cabang — field tak dikenal ditolak, jadi data
        itu tidak bisa dipalsukan lewat payload (PRD CP-REG-03/04/05/06).
        Token dikunci dan diperiksa ULANG di dalam transaksi sehingga dua
        permintaan bersamaan hanya satu yang berhasil. Akun yang terbentuk
        langsung bisa dipakai login dengan email cabang.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, telepon, password, password_konfirmasi]
              additionalProperties: false
              properties:
                token: { type: string, maxLength: 64 }
                telepon: { type: string, maxLength: 40 }
                password: { type: string, minLength: 8, maxLength: 200 }
                password_konfirmasi: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Akun cabang terbentuk; token ditandai terpakai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          description: Token tidak valid/kedaluwarsa, data tidak valid, atau kata sandi tidak memenuhi syarat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: Token sudah dipakai, cabang nonaktif, atau cabang sudah punya akun
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/catalog:
    get:
      tags: [customer, admin]
      operationId: getCatalog
      summary: Katalog sesuai sudut pandang aktor
      description: |
        Akun cabang menerima produk yang benar-benar dijual ke cabangnya
        (punya baris harga). Staf admin menerima seluruh produk aktif beserta
        harga default.
      responses:
        "200":
          description: Daftar produk
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      anyOf:
                        - $ref: "#/components/schemas/BranchProduct"
                        - $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/me/branch:
    get:
      tags: [customer]
      operationId: getMyBranch
      summary: Data cabang milik akun yang sedang masuk
      description: |
        Cabang diambil dari SESI, bukan dari parameter klien — akun cabang
        tidak bisa membaca profil cabang lain. Akun admin dijawab `403`; hanya
        akun cabang yang punya endpoint ini (PRD §3.8). Tidak ada rute tulis:
        data cabang read-only di portal cabang.
      responses:
        "200":
          description: Data cabang
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Branch" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orders:
    get:
      tags: [customer]
      operationId: listOrders
      summary: Daftar pesanan cabang yang sedang masuk
      description: |
        Pesanan difilter dengan `branch_id` dari SESI, jadi akun cabang tidak
        pernah bisa melihat pesanan cabang lain (isolasi data cabang,
        Architecture.md §6). Filter `status` opsional: `draft`, `submitted`,
        `done`, atau `semua`/kosong (tanpa filter). Draft belum punya nomor dan
        tanggal; kolom `jumlah_item` adalah Σ qty baris produk dan `total` adalah
        nilai yang dihitung server (PRD CP-ORD-01).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [semua, draft, submitted, done]
      responses:
        "200":
          description: Daftar pesanan cabang
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [customer]
      operationId: createOrderDraft
      summary: Buat draft pesanan
      description: |
        Body HANYA memuat catatan dan daftar baris (`product_id`, `qty`); harga
        satuan, subtotal, dan total dihitung server dari harga cabang di
        `branch_prices` sehingga angka kiriman klien tidak pernah dipakai
        (BR-05, BR-10). Produk tanpa baris harga untuk cabang sesi ditolak
        `400` — `harga_default` bukan cadangan (PRD CP-KAT-02). Draft selalu
        tanpa nomor, tanggal, dan serial number; keduanya lahir saat submit
        (BR-04, BR-09).

        Aturan Sertifikat (PRD §3.6) ditegakkan server: harga baris produk
        Sertifikat dipaksa 0 berapa pun qty-nya (CP-SER-01), pesanannya
        mendapat TEPAT SATU baris `packaging` qty 1 senilai setelan
        `biaya_packaging` yang berlaku (CP-SER-02), dan pencampuran Sertifikat
        dengan produk reguler ditolak `400` (CP-SER-03). Baris packaging dibuat
        server, jadi klien tidak bisa menambah, mengubah, menghapus, atau
        menduplikasinya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderDraftInput" }
      responses:
        "201":
          description: Draft tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [customer]
      operationId: getOrder
      summary: Detail satu pesanan milik cabang sesi
      description: |
        Pesanan cabang lain dijawab `404` (bukan `403`) supaya keberadaannya
        tidak bocor. Detail memuat baris pesanan beserta snapshot nama, satuan,
        harga satuan, dan subtotal.
      responses:
        "200":
          description: Detail pesanan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [customer]
      operationId: updateOrderDraft
      summary: Ubah draft pesanan milik cabang sesi
      description: |
        Hanya draft milik cabang pemanggil yang bisa diubah (PRD CP-ORD-03).
        Pesanan `submitted`/`done` dijawab `409 ORDER_LOCKED` (PRD CP-ORD-09),
        dan pemeriksaan status diulang di klausa `WHERE` repository sehingga
        submit yang berjalan bersamaan tidak bisa ditembus.

        Baris dikirim ulang UTUH (bukan diff) sehingga baris biaya packaging
        pesanan Sertifikat selalu disusun ulang server — tepat satu baris, qty
        1, tanpa serial — dan tidak pernah bisa digandakan klien (CP-SER-02).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderDraftInput" }
      responses:
        "200":
          description: Draft terbaru
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [customer]
      operationId: deleteOrderDraft
      summary: Hapus draft pesanan milik cabang sesi
      description: |
        Hanya draft milik cabang pemanggil yang bisa dihapus (PRD CP-ORD-03).
        Pesanan `submitted`/`done` dijawab `409 ORDER_LOCKED` (PRD CP-ORD-09).
        Belum ada status Batal: pembatalan pesanan Submitted masih pertanyaan
        terbuka PRD §8 no.4 dan sengaja tidak disediakan.
      responses:
        "204":
          description: Draft terhapus
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orders/{id}/proofs:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
    get:
      tags: [customer]
      operationId: listOrderProofs
      summary: Daftar bukti transfer pesanan cabang sesi
      description: |
        Mengembalikan metadata seluruh bukti transfer pesanan itu (terlama
        dulu): nama berkas asli, MIME, ukuran, sidik jari SHA-256, dan
        pengunggahnya (`uploaded_by_kind`: `branch` atau `admin` beserta
        `uploaded_by_nama`). Isi berkasnya TIDAK di sini — unduh selalu lewat
        tautan berumur pendek di endpoint download (Architecture.md §6).

        Pesanan cabang lain dijawab `404` supaya keberadaannya tidak bocor, dan
        id yang bukan UUID juga `404` (bukan `500`).
      responses:
        "200":
          description: Daftar bukti transfer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PaymentProof" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [customer]
      operationId: uploadOrderProofs
      summary: Tambah bukti transfer (multipart, boleh beberapa berkas)
      description: |
        Bukti transfer tidak disimpan di database: isinya masuk object storage
        S3-compatible dengan kunci ACAK (`proofs/{order_id}/{acak}.{ext}`),
        sementara nama aslinya hanya menjadi metadata. Karena itu tidak ada
        Content-Type yang dipercaya dari klien.

        Aturan yang ditegakkan server:

        - field multipart bernama `file`, boleh diulang. Jumlah total bukti
          satu pesanan dibatasi setelan `max_file` dan tiap berkas dibatasi
          setelan `max_mb` (default 5 × 5 MB, PRD §4.9);
        - hanya JPG, PNG, dan PDF. Jenis ditentukan MAGIC BYTES isi berkas,
          bukan ekstensinya; ekstensi yang tidak cocok dengan isi (mis.
          `.jpg` berisi PDF) atau di luar daftar ditolak `400` (CP-ORD-04);
        - isi berkas yang sama tidak boleh diunggah dua kali pada satu pesanan
          (SHA-256 unik per pesanan, SystemDesign.md §5.3) → `409
          PROOF_DUPLICATE`;
        - bukti boleh ditambah pada pesanan `submitted` (pembayaran
          cicilan/terpisah, CP-ORD-07) dan pada `draft` (modal submit F1-14).
          Pesanan `done` ditolak `409 ORDER_LOCKED` untuk cabang; admin tetap
          boleh menambah (koreksi);
        - tiap unggahan dicatat di timeline pesanan beserta NAMA pengunggah
          (CP-ORD-08). Draft belum punya timeline.

        Berlaku batas laju per akun (`429 RATE_LIMITED`) dan batas ukuran
        badan permintaan (`413 PAYLOAD_TOO_LARGE`).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "201":
          description: Bukti tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PaymentProof" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/orders/{id}/proofs/{proofId}/download:
