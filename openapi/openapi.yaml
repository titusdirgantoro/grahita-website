openapi: 3.1.0
info:
  title: Grahita Portal API
  version: 0.1.0
  description: |
    API untuk Sistem Pemesanan Cabang Grahita Indonesia (modular monolith Go).

    Kontrak yang berlaku untuk SELURUH endpoint:
    - Semua endpoint bisnis berada di bawah `/api/v1` dan selalu same-origin
      pada host portal yang bersangkutan (`grahita-branch.tiusclaw.com` untuk
      cabang, `grahita-admin.tiusclaw.com` untuk admin).
    - Autentikasi memakai cookie sesi **host-only** (`HttpOnly`, `SameSite=Lax`,
      `Secure` di luar lokal) yang nilainya disimpan sebagai hash di PostgreSQL.
    - Setiap request non-GET wajib membawa header `X-CSRF-Token` yang nilainya
      sama dengan cookie `grahita_csrf` (double-submit).
    - Respons sukses dibungkus `{ "data": ... }`; respons gagal berbentuk
      `{ "error": { "code", "message", "fields"? } }`.
    - Otorisasi selalu ditentukan role akun di server, bukan hostname.
  license:
    name: Proprietary
servers:
  - url: https://grahita-branch.tiusclaw.com
    description: Customer Portal (cabang)
  - url: https://grahita-admin.tiusclaw.com
    description: Admin Portal (Pusat)
  - url: http://localhost:8088
    description: Pengembangan lokal

tags:
  - name: health
  - name: meta
  - name: auth
  - name: customer
  - name: admin

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness — proses hidup (tidak menyentuh dependensi)
      security: []
      responses:
        "200":
          description: Proses hidup
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }

  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Readiness — dependensi wajib siap melayani
      description: |
        `database` dan `migrations` bersifat wajib (503 bila gagal).
        `storage`, `gotenberg`, dan `smtp` diperiksa hanya bila dikonfigurasi.
      security: []
      responses:
        "200":
          description: Siap melayani
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Belum siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /api/v1/meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Informasi runtime untuk kedua SPA
      security: []
      responses:
        "200":
          description: Informasi aplikasi
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [app, version, env, api_base, customer_host, admin_host, waktu_wib]
                    properties:
                      app: { type: string }
                      version: { type: string }
                      env: { type: string, enum: [local, staging, production] }
                      api_base: { type: string, const: /api/v1 }
                      customer_host: { type: string, example: grahita-branch.tiusclaw.com }
                      admin_host: { type: string, example: grahita-admin.tiusclaw.com }
                      waktu_wib: { type: string, format: date-time }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Masuk ke portal (identitas ditentukan konteks akun, bukan host)
      security: []
      description: |
        Endpoint ini dikecualikan dari pemeriksaan CSRF. Percobaan GAGAL
        dibatasi 5 kali per 15 menit, dihitung terpisah per akun dan per IP
        (PRD CP-AUT-05); melampaui batas menghasilkan `429 RATE_LIMITED`
        sebelum kata sandi diperiksa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "200":
          description: Berhasil masuk; cookie sesi dipasang (host-only)
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                `grahita_session=...; Path=/; HttpOnly; SameSite=Lax` (ditambah
                `Secure` di luar lingkungan lokal). Tanpa atribut `Domain`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Keluar — mencabut sesi dan menghapus cookie
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Sesi dicabut
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Profil, role, dan cabang pengguna yang sedang masuk
      responses:
        "200":
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Kirim tautan atur ulang kata sandi (respons selalu sama)
      security: []
      description: |
        Endpoint publik, dikecualikan dari pemeriksaan CSRF. Respons SELALU
        `200` dengan pesan yang sama — email terdaftar maupun tidak — supaya
        keberadaan akun tidak bisa ditebak (PRD CP-AUT-03). Tautan berlaku
        `reset_menit` (default 60 menit) dan hanya bisa dipakai sekali; meminta
        tautan baru membatalkan tautan lama yang belum dipakai.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "200":
          description: Permintaan diterima (pesan identik untuk semua email)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [pesan]
                    properties:
                      pesan: { type: string }
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set kata sandi baru dengan token sekali pakai
      security: []
      description: |
        Endpoint publik, dikecualikan dari pemeriksaan CSRF. Token berlaku
        `reset_menit` dan hanya bisa dipakai sekali; setelah berhasil SELURUH
        sesi pengguna dicabut (PRD CP-AUT-04, CP-AUT-07). Kata sandi divalidasi
        sebelum token dipakai, sehingga percobaan dengan kata sandi lemah tidak
        membakar tautan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              additionalProperties: false
              properties:
                token: { type: string, maxLength: 512 }
                password: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "204":
          description: Kata sandi tersimpan; seluruh sesi pengguna dicabut
        "400":
          description: Token tidak valid/kedaluwarsa/sudah dipakai, atau kata sandi lemah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: RESET_INVALID
                  message: Tautan atur ulang tidak valid, sudah dipakai, atau kedaluwarsa. Minta tautan baru.
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/password/change:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Ganti kata sandi saat login (verifikasi kata sandi lama)
      description: |
        Wajib login dan wajib CSRF. Sesi yang sedang dipakai tetap hidup,
        sedangkan sesi LAIN milik pengguna yang sama dicabut (PRD CP-AUT-06,
        CP-AUT-07).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_lama, password_baru]
              additionalProperties: false
              properties:
                password_lama: { type: string, minLength: 8, maxLength: 200 }
                password_baru: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "204":
          description: Kata sandi diganti; sesi lain dicabut
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/registration/validate:
    post:
      tags: [auth]
      operationId: validateRegistrationToken
      summary: Langkah 1 pendaftaran — validasi token registrasi cabang
      security: []
      description: |
        Endpoint publik, dikecualikan dari CSRF dan dibatasi per IP. Memeriksa
        token registrasi (format, ada, belum dipakai, belum kedaluwarsa, cabang
        aktif, cabang belum punya akun) lalu mengembalikan data cabang yang akan
        tampil terisi dan READ-ONLY pada langkah 2 (PRD CP-REG-02/CP-REG-03).
        Setiap keadaan salah dijawab dengan kode yang spesifik
        (`TOKEN_INVALID`, `TOKEN_EXPIRED`, `TOKEN_USED`, `BRANCH_INACTIVE`,
        `BRANCH_HAS_ACCOUNT`) supaya pengguna tahu harus berbuat apa
        (PRD CP-REG-07).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Token sah; data cabang untuk langkah 2
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [nama_cabang, nama_kepala, email]
                    additionalProperties: false
                    properties:
                      nama_cabang: { type: string }
                      nama_kepala: { type: string }
                      email: { type: string, format: email }
        "400":
          description: Token tidak valid atau kedaluwarsa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: Token sudah dipakai, cabang nonaktif, atau cabang sudah punya akun
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: registerBranch
      summary: Langkah 2 pendaftaran — buat akun cabang dengan token registrasi
      security: []
      description: |
        Endpoint publik, dikecualikan dari CSRF dan dibatasi per IP. Memakai
        token registrasi TEPAT sekali lalu membuat akun cabang: nomor telepon
        dan kata sandi (minimal 8 karakter, harus sama dengan konfirmasinya)
        diisi pengguna, sedangkan nama cabang, nama kepala cabang, dan email
        diambil server dari data cabang — field tak dikenal ditolak, jadi data
        itu tidak bisa dipalsukan lewat payload (PRD CP-REG-03/04/05/06).
        Token dikunci dan diperiksa ULANG di dalam transaksi sehingga dua
        permintaan bersamaan hanya satu yang berhasil. Akun yang terbentuk
        langsung bisa dipakai login dengan email cabang.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, telepon, password, password_konfirmasi]
              additionalProperties: false
              properties:
                token: { type: string, maxLength: 64 }
                telepon: { type: string, maxLength: 40 }
                password: { type: string, minLength: 8, maxLength: 200 }
                password_konfirmasi: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Akun cabang terbentuk; token ditandai terpakai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          description: Token tidak valid/kedaluwarsa, data tidak valid, atau kata sandi tidak memenuhi syarat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: Token sudah dipakai, cabang nonaktif, atau cabang sudah punya akun
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/catalog:
    get:
      tags: [customer, admin]
      operationId: getCatalog
      summary: Katalog sesuai sudut pandang aktor
      description: |
        Akun cabang menerima produk yang benar-benar dijual ke cabangnya
        (punya baris harga). Staf admin menerima seluruh produk aktif beserta
        harga default.
      responses:
        "200":
          description: Daftar produk
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      anyOf:
                        - $ref: "#/components/schemas/BranchProduct"
                        - $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/me/branch:
    get:
      tags: [customer]
      operationId: getMyBranch
      summary: Data cabang milik akun yang sedang masuk
      responses:
        "200":
          description: Data cabang
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Branch" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/bank-accounts:
    get:
      tags: [customer, admin]
      operationId: listActiveBankAccounts
      summary: Rekening bank AKTIF (instruksi pembayaran)
      description: |
        Hanya rekening AKTIF yang dikembalikan. Dipakai Customer Portal untuk
        instruksi pembayaran dan menjadi referensi pencocokan rekening tujuan
        pada verifikasi bukti transfer (PRD §4.6, §5). Rekening nonaktif tidak
        pernah ditampilkan di sini.
      responses:
        "200":
          description: Daftar rekening aktif
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BankAccount" }
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/admin/branches:
    get:
      tags: [admin]
      operationId: listBranches
      summary: Master cabang (Manager & Superadmin)
      description: |
        Daftar cabang beserta token registrasi aktifnya (bila ada). Filter
        opsional: `q` mencari nama/email, `aktif`/`cnc`/`special` menyaring
        per flag. Nilai asli token TIDAK pernah dikembalikan di sini — hanya
        `token_prefix` 8 karakter pertamanya.
      parameters:
        - name: q
          in: query
          required: false
          description: Cari pada nama atau email cabang (tidak peka huruf besar/kecil).
          schema: { type: string }
        - name: aktif
          in: query
          required: false
          schema: { type: boolean }
        - name: cnc
          in: query
          required: false
          description: Saring cabang Cash & Carry.
          schema: { type: boolean }
        - name: special
          in: query
          required: false
          description: Saring cabang ber-flag Special.
          schema: { type: boolean }
      responses:
        "200":
          description: Daftar cabang
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Branch" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      operationId: createBranch
      summary: Tambah cabang (Manager & Superadmin)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchInput" }
      responses:
        "201":
          description: Cabang dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Branch" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/branches/{id}:
    get:
      tags: [admin]
      operationId: getBranch
      summary: Satu cabang berdasarkan id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Data cabang
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Branch" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [admin]
      operationId: updateBranch
      summary: Ubah cabang, termasuk menonaktifkannya (Manager & Superadmin)
      description: |
        Semua field opsional. Bila `email` berubah dan cabang sudah punya akun,
        email login akun cabang itu ikut berubah. Cabang nonaktif langsung
        kehilangan akses (sesinya gugur) dan tidak muncul di pilihan aktif.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchUpdate" }
      responses:
        "200":
          description: Cabang diperbarui
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Branch" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [admin]
      operationId: deleteBranch
      summary: Hapus cabang yang belum punya pesanan (Manager & Superadmin)
      description: |
        Cabang yang sudah punya pesanan TIDAK bisa dihapus — hanya boleh
        dinonaktifkan lewat PUT (PRD AP-CAB-04); permintaannya dijawab
        409 `BRANCH_HAS_ORDERS`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Cabang dihapus
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/branches/{id}/token:
    post:
      tags: [admin]
      operationId: createBranchToken
      summary: Generate token registrasi cabang (Manager & Superadmin)
      description: |
        Membuat token registrasi sekali pakai untuk cabang yang belum punya
        akun; token lama yang belum terpakai otomatis batal (PRD AP-CAB-02).
        Masa berlaku mengikuti pengaturan `token_hari` (default 14 hari).
        Nilai asli token hanya ada di respons ini dan tidak bisa dibaca lagi
        setelahnya.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Token registrasi dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/RegistrationToken" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/products:
    get:
      tags: [admin]
      operationId: listProducts
      summary: Katalog produk (Manager & Superadmin)
      responses:
        "200":
          description: Daftar produk
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/settings:
    get:
      tags: [admin]
      operationId: listAdminSettings
      summary: Pengaturan sistem (Superadmin)
      responses:
        "200":
          description: Peta kunci pengaturan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [admin]
      operationId: updateSetting
      summary: Simpan satu atau beberapa pengaturan (Superadmin)
      description: |
        Dua bentuk body diterima: satu kunci (`key` + `value`) untuk
        kompatibilitas, atau banyak kunci sekaligus (`values`). Seluruh nilai
        divalidasi lebih dahulu — bila ada satu yang tidak valid, tidak ada
        yang tersimpan. Hanya kunci yang nilainya benar-benar BERUBAH
        (perbandingan bentuk kanonik) yang ditulis dan tercatat di audit log;
        mengirim ulang nilai yang sama bersifat no-op (tetap `200`) tanpa
        entri audit baru. Baca lengkap pengaturan hanya lewat
        `/api/v1/admin/settings` — tidak ada permukaan pengaturan lintas-role
        (PRD §2.1).

        Rentang: biaya_packaging 0..100000000 (Rupiah bulat);
        cnc_hari/token_hari 1..3650; reset_menit 1..43200; max_mb 1..1024;
        max_file 1..100; digit_invoice 1..10; manager_boleh_revisi boolean;
        `ai` objek {aktif, min_keyakinan 0..1, tol_kurang, tol_lebih,
        digit_rek 1..20, mundur 0..3650}.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                key:
                  type: string
                  enum:
                    [
                      biaya_packaging,
                      cnc_hari,
                      token_hari,
                      reset_menit,
                      max_mb,
                      max_file,
                      digit_invoice,
                      manager_boleh_revisi,
                      ai,
                    ]
                value: { $ref: "#/components/schemas/SettingValue" }
                values:
                  type: object
                  description: Banyak kunci sekaligus (all-or-nothing).
                  additionalProperties: { $ref: "#/components/schemas/SettingValue" }
            examples:
              satuKunci:
                value: { key: biaya_packaging, value: 4000 }
              banyakKunci:
                value: { values: { biaya_packaging: 4000, cnc_hari: 7 } }
      responses:
        "200":
          description: Pengaturan tersimpan (bentuk nilai kanonik)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      key: { type: string }
                      value: { $ref: "#/components/schemas/SettingValue" }
                      values:
                        type: object
                        additionalProperties: { $ref: "#/components/schemas/SettingValue" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/bank-accounts:
    get:
      tags: [admin]
      operationId: listBankAccounts
      summary: Rekening bank, termasuk nonaktif (Superadmin)
      description: |
        Pengelolaan rekening: seluruh rekening dikembalikan, aktif maupun
        nonaktif, supaya Superadmin dapat mengaktifkannya kembali. Manager dan
        akun cabang ditolak (PRD §2.1).
      responses:
        "200":
          description: Daftar rekening
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BankAccount" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      operationId: createBankAccount
      summary: Tambah rekening bank (Superadmin)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountInput" }
      responses:
        "201":
          description: Rekening dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BankAccount" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/bank-accounts/{id}:
    put:
      tags: [admin]
      operationId: updateBankAccount
      summary: Ubah / aktif-nonaktifkan rekening (Superadmin)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountUpdate" }
      responses:
        "200":
          description: Rekening tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BankAccount" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/branch:
    get:
      tags: [admin]
      operationId: listBranchUsers
      summary: Daftar akun cabang (Manager & Superadmin)
      description: |
        Satu baris per CABANG (1 cabang = 1 akun, PRD BR-01), termasuk cabang
        yang belum registrasi. `status` bernilai `aktif`, `belum_registrasi`,
        atau `nonaktif`; `nonaktif` juga dipakai bila CABANG-nya dinonaktifkan
        karena keadaan itu sama-sama membuat akun tidak bisa login.
      responses:
        "200":
          description: Daftar akun cabang beserta status dan login terakhir
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BranchUser" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/users/branch/{id}:
    put:
      tags: [admin]
      operationId: setBranchUserActive
      summary: Aktifkan/nonaktifkan akun cabang (Manager & Superadmin)
      description: |
        `id` adalah id AKUN (`branch_users.id`), bukan id cabang. Menonaktifkan
        akun langsung mencabut seluruh sesi akun tersebut sehingga akses
        berhenti saat itu juga (PRD AP-CAB-03).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              additionalProperties: false
              properties:
                is_active: { type: boolean }
      responses:
        "200":
          description: Akun cabang setelah perubahan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BranchUser" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users/branch/{id}/reset:
    post:
      tags: [admin]
      operationId: resendBranchUserReset
      summary: Kirim ulang tautan atur ulang kata sandi akun cabang
      description: |
        Memakai jalur email yang sama dengan lupa kata sandi; tautan berlaku
        `reset_menit` (default 60 menit) dan hanya bisa dipakai sekali. Email
        dialihkan ke email_outbox pada kartu F1-16 tanpa mengubah handler ini.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Permintaan pengiriman ulang diterima
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [pesan]
                    properties:
                      pesan: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Cabang belum punya akun (`NO_ACCOUNT`) atau akun/cabangnya sedang
            nonaktif (`ACCOUNT_INACTIVE`) sehingga tidak boleh memegang tautan.
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/admin:
    get:
      tags: [admin]
      operationId: listAdminUsers
      summary: Daftar akun admin (Superadmin)
      description: |
        `status` bernilai `undangan` (belum mengaktivasi akun), `aktif`, atau
        `nonaktif`. Admin undangan tidak bisa login dan tidak menerima email
        dokumen (PRD AP-USR-02).
      responses:
        "200":
          description: Daftar akun admin
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      operationId: inviteAdmin
      summary: Undang admin baru (Superadmin)
      description: |
        Akun dibuat TANPA kata sandi sehingga belum bisa login dan belum
        menerima email dokumen. Email undangan berisi tautan aktivasi sekali
        pakai dan diantre lewat email_outbox (F1-16) — tautan aslinya tidak
        pernah dikembalikan endpoint ini. Tautan berlaku `token_hari` (default
        14 hari).

        Email yang sudah dipakai akun admin LAIN maupun akun/email cabang
        ditolak dengan `409 EMAIL_TAKEN`: login mencari akun admin lebih dulu,
        jadi email milik cabang tidak boleh dipegang admin (kalau tidak, akun
        cabang itu tidak akan pernah bisa masuk).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama, email, role]
              additionalProperties: false
              properties:
                nama: { type: string, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                role: { type: string, enum: [manager, superadmin] }
                notif_invoice: { type: boolean, default: false }
                notif_surat_jalan: { type: boolean, default: false }
      responses:
        "201":
          description: Undangan dibuat; email diantre ke outbox
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminUser" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/admin/{id}:
    put:
      tags: [admin]
      operationId: updateAdminUser
      summary: Ubah role, flag email dokumen, atau status admin (Superadmin)
      description: |
        Field yang tidak dikirim tidak diubah. Superadmin aktif TERAKHIR tidak
        boleh dinonaktifkan atau diturunkan menjadi Manager, termasuk bila dua
        permintaan datang bersamaan (`409 LAST_SUPERADMIN`, PRD AP-USR-03).

        "Aktif" di sini berarti superadmin yang benar-benar BISA LOGIN
        (`is_active` DAN sudah diaktivasi). Superadmin yang masih berstatus
        undangan (belum mengaktivasi akunnya sehingga tidak bisa masuk) TIDAK
        dihitung sebagai pelindung, supaya sistem tidak pernah ditinggalkan
        tanpa satu pun superadmin yang bisa login.

        Menonaktifkan admin mencabut seluruh sesinya.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nama: { type: string, maxLength: 120 }
                role: { type: string, enum: [manager, superadmin] }
                notif_invoice: { type: boolean }
                notif_surat_jalan: { type: boolean }
                is_active: { type: boolean }
      responses:
        "200":
          description: Akun admin setelah perubahan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminUser" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: grahita_session
      description: |
        Cookie sesi host-only. Browser mengirimnya otomatis selama request
        same-origin; tidak ada token bearer.

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Nilai cookie `grahita_csrf` (double-submit).
      schema: { type: string }

  responses:
    ValidationError:
      description: Data yang dikirim tidak valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: VALIDATION_FAILED
              message: Data yang dikirim belum lengkap atau tidak valid.
              fields:
                email: format email tidak valid
    Unauthenticated:
      description: Belum masuk atau sesi sudah berakhir
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: UNAUTHENTICATED
              message: Anda harus masuk terlebih dahulu.
    Forbidden:
      description: Sudah masuk tetapi role tidak berhak
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: FORBIDDEN
              message: Anda tidak memiliki akses ke tindakan ini.
    NotFound:
      description: Data atau endpoint tidak ditemukan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: NOT_FOUND
              message: Endpoint tidak ditemukan.
    RateLimited:
      description: Terlalu banyak percobaan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: RATE_LIMITED
              message: Terlalu banyak percobaan masuk. Coba lagi beberapa saat lagi.
    Conflict:
      description: Permintaan bertentangan dengan aturan data
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            emailTaken:
              value:
                error:
                  code: EMAIL_TAKEN
                  message: Email tersebut sudah dipakai akun lain.
            lastSuperadmin:
              value:
                error:
                  code: LAST_SUPERADMIN
                  message: Superadmin aktif terakhir tidak boleh dinonaktifkan atau diturunkan menjadi Manager.
            noAccount:
              value:
                error:
                  code: NO_ACCOUNT
                  message: Cabang ini belum punya akun. Buat token registrasi lebih dahulu di halaman Cabang.
            accountInactive:
              value:
                error:
                  code: ACCOUNT_INACTIVE
                  message: Akun cabang ini sedang nonaktif; aktifkan dulu sebelum mengirim tautan atur ulang.
            branchHasOrders:
              value:
                error:
                  code: BRANCH_HAS_ORDERS
                  message: Cabang ini sudah punya pesanan sehingga tidak bisa dihapus; nonaktifkan saja cabangnya.
            branchHasAccount:
              value:
                error:
                  code: BRANCH_HAS_ACCOUNT
                  message: Cabang ini sudah punya akun, jadi token registrasi tidak diperlukan lagi. Pemulihan akses lewat lupa kata sandi.
            branchInactive:
              value:
                error:
                  code: BRANCH_INACTIVE
                  message: Cabang sedang nonaktif; aktifkan dulu sebelum membuat token registrasi.

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Kode mesin yang stabil
              enum:
                [
                  VALIDATION_FAILED,
                  UNAUTHENTICATED,
                  FORBIDDEN,
                  NOT_FOUND,
                  CONFLICT,
                  RATE_LIMITED,
                  CSRF_INVALID,
                  RESET_INVALID,
                  TOKEN_INVALID,
                  TOKEN_EXPIRED,
                  TOKEN_USED,
                  EMAIL_TAKEN,
                  LAST_SUPERADMIN,
                  NO_ACCOUNT,
                  ACCOUNT_INACTIVE,
                  BRANCH_HAS_ORDERS,
                  BRANCH_HAS_ACCOUNT,
                  BRANCH_INACTIVE,
                  BANK_DUPLICATE,
                  TIMEOUT,
                  METHOD_NOT_ALLOWED,
                  BRANCH_MISSING,
                  UNAVAILABLE,
                  INTERNAL,
                ]
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Kesalahan per field untuk ditempelkan ke form

    Readiness:
      type: object
      required: [status, version, checks]
      properties:
        status: { type: string, enum: [ready, "not ready"] }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: string }
          example:
            database: ok
            migrations: ok (versi 2)
            storage: tidak dikonfigurasi
            gotenberg: ok
            smtp: ok

    User:
      type: object
      required: [id, kind, role, nama, email]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [branch, admin] }
        role: { type: string, enum: [branch, manager, superadmin] }
        branch_id: { type: string, format: uuid }
        nama: { type: string }
        email: { type: string, format: email }

    UserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user: { $ref: "#/components/schemas/User" }

    Product:
      type: object
      required: [id, nama, jenis, satuan, harga_default, urutan, is_active]
      properties:
        id: { type: string, format: uuid }
        kode: { type: string }
        nama: { type: string }
        jenis: { type: string, enum: [reguler, sertifikat] }
        satuan: { type: string }
        deskripsi: { type: string }
        harga_default: { type: integer, format: int64, minimum: 0 }
        urutan: { type: integer }
        is_active: { type: boolean }

    BranchProduct:
      type: object
      description: Produk beserta harga khusus cabang (Rupiah bulat)
      required: [id, nama, jenis, satuan, harga, urutan]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
        jenis: { type: string, enum: [reguler, sertifikat] }
        satuan: { type: string }
        deskripsi: { type: string }
        harga: { type: integer, format: int64, minimum: 0 }
        urutan: { type: integer }

    BankAccount:
      type: object
      description: Rekening bank tujuan transfer (PRD §4.6).
      required: [id, bank, nama_pemilik, nomor, is_active]
      properties:
        id: { type: string, format: uuid }
        bank: { type: string, enum: [BCA, BRI] }
        nama_pemilik: { type: string }
        nomor: { type: string, pattern: "^[0-9]{6,34}$" }
        is_active: { type: boolean }

    BankAccountInput:
      type: object
      description: Body pembuatan rekening (PRD §4.6).
      required: [bank, nama_pemilik, nomor]
      additionalProperties: false
      properties:
        bank: { type: string, enum: [BCA, BRI] }
        nama_pemilik: { type: string, minLength: 2, maxLength: 120 }
        nomor: { type: string, minLength: 6, maxLength: 34, pattern: "^[0-9]{6,34}$" }
        is_active:
          type: boolean
          description: Kosong berarti aktif (default rekening baru).

    BankAccountUpdate:
      type: object
      description: Body perubahan rekening; hanya field yang dikirim yang diubah.
      additionalProperties: false
      properties:
        bank: { type: string, enum: [BCA, BRI] }
        nama_pemilik: { type: string, minLength: 2, maxLength: 120 }
        nomor: { type: string, minLength: 6, maxLength: 34, pattern: "^[0-9]{6,34}$" }
        is_active: { type: boolean }

    SettingValue:
      description: |-
        Nilai pengaturan: bilangan bulat (Rupiah tanpa sen), boolean, atau
        objek `ai`.
      oneOf:
        - type: integer
        - type: boolean
        - type: object
          additionalProperties: true

    Branch:
      type: object
      required: [id, nama, nama_kepala, email, is_cnc, is_special, pajak_in, is_active]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
        nama_kepala: { type: string }
        email: { type: string, format: email }
        telepon: { type: string }
        is_cnc: { type: boolean }
        is_special: { type: boolean }
        pajak_in: { type: boolean }
        is_active: { type: boolean }
        token_prefix:
          type: string
          description: 8 karakter pertama token registrasi yang masih berlaku (bila ada).
        token_expires_at: { type: string, format: date-time }

    BranchInput:
      type: object
      description: Body pembuatan cabang (PRD §4.4).
      required: [nama, nama_kepala, email]
      additionalProperties: false
      properties:
        nama: { type: string, minLength: 2, maxLength: 120 }
        nama_kepala: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        telepon: { type: string, maxLength: 40 }
        is_cnc: { type: boolean }
        is_special: { type: boolean }
        pajak_in: { type: boolean }
        is_active:
          type: boolean
          description: Kosong berarti aktif (default cabang baru).

    BranchUpdate:
      type: object
      description: Body perubahan cabang; hanya field yang dikirim yang diubah.
      additionalProperties: false
      properties:
        nama: { type: string, minLength: 2, maxLength: 120 }
        nama_kepala: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        telepon: { type: string, maxLength: 40 }
        is_cnc: { type: boolean }
        is_special: { type: boolean }
        pajak_in: { type: boolean }
        is_active: { type: boolean }

    RegistrationToken:
      type: object
      description: |
        Token registrasi sekali pakai. `token` adalah nilai asli dan hanya
        ditampilkan pada respons pembuatan; penyimpanan di database hanya
        memuat hash SHA-256 beserta `prefix`-nya.
      required: [token, prefix, expires_at]
      properties:
        token:
          type: string
          example: GRH-7K2M-QW3Z-9TPL-XB4N
        prefix:
          type: string
          description: 8 karakter pertama token, untuk ditampilkan ulang di Admin Portal.
        expires_at: { type: string, format: date-time }

    BranchUser:
      type: object
      description: |
        Satu baris tab "User cabang": data cabang beserta akunnya. `user_id`
        kosong berarti cabang belum registrasi (belum punya akun).
      required: [branch_id, nama, nama_kepala, email, has_account, is_active, branch_active, status]
      properties:
        branch_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        nama: { type: string }
        nama_kepala: { type: string }
        email: { type: string, format: email }
        telepon: { type: string }
        has_account: { type: boolean }
        is_active: { type: boolean }
        branch_active: { type: boolean }
        status: { type: string, enum: [aktif, belum_registrasi, nonaktif] }
        last_login_at: { type: string, format: date-time }
        token_prefix:
          type: string
          description: 8 karakter pertama token registrasi yang masih berlaku (bila ada).
        token_expires_at: { type: string, format: date-time }

    AdminUser:
      type: object
      description: |
        Akun admin Pusat. `status` = undangan | aktif | nonaktif; admin
        undangan belum punya kata sandi sehingga tidak bisa login dan tidak
        menerima email dokumen.
      required: [id, nama, email, role, notif_invoice, notif_surat_jalan, is_active, status]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [manager, superadmin] }
        notif_invoice: { type: boolean }
        notif_surat_jalan: { type: boolean }
        is_active: { type: boolean }
        status: { type: string, enum: [undangan, aktif, nonaktif] }
        invited_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }

security:
  - cookieAuth: []
