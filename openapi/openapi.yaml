          $ref: "#/components/responses/NotFound"

  /api/v1/admin/orders/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
    post:
      tags: [admin]
      operationId: verifyAdminOrder
      summary: Verifikasi pembayaran pesanan (Manager & Superadmin)
      description: |
        Verifikasi pembayaran manual satu pesanan (PRD §4.2 AP-ORD-07, §5, §7;
        SystemDesign.md §4.3–4.4).

        Dua keputusan:

        * `hasil: cocok` — MENYETUJUI: status berpindah ke `done`,
          `done_at` diisi, dan efek sampingnya dijalankan TEPAT SEKALI dalam
          transaksi yang sama: `verification_logs`, timeline, audit, dan
          penjadwalan pekerjaan render Invoice/Surat Jalan lalu email dokumen
          sesuai flag penerima admin. `total_terbaca` adalah nominal yang
          dibaca admin dari bukti (diisi manual untuk bukti non-OCR);
          `selisih` = `total_terbaca` − total pesanan, dihitung server.
        * `hasil: perlu_review` — pesanan TETAP `submitted` (sub-status
          verifikasi `perlu_review`) dan `alasan` WAJIB diisi.

        Metode verifikasi ditetapkan server (`manual`); jalur AI/OCR (Fase 2)
        memakai service yang sama dengan metode `ai` dan tidak lewat endpoint
        ini. Verifikasi kedua pada pesanan yang sudah `done` dijawab `409`
        tanpa efek samping; idempotensi efek samping dijaga kunci baris
        pesanan.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hasil]
              additionalProperties: false
              properties:
                hasil:
                  type: string
                  enum: [cocok, perlu_review]
                  description: |
                    `cocok` menyetujui (→ Done); `perlu_review` menandai pesanan
                    perlu review (tetap Submitted).
                total_terbaca:
                  type: integer
                  minimum: 0
                  description: |
                    Nominal yang dibaca/ diisi admin untuk bukti (Rupiah bulat).
                    Kosong berarti tidak ada nominal terbaca.
                alasan:
                  type: string
                  enum: [kurang_bayar, lebih_bayar, tidak_terbaca, rekening_beda, lainnya]
                  description: |
                    Wajib bila `hasil: perlu_review`, dan harus kosong bila
                    `hasil: cocok`.
                catatan:
                  type: string
                  maxLength: 2000
                  description: Catatan bebas pemeriksa.
                proof_destinations:
                  type: array
                  description: |
                    Wajib lengkap dan tepat satu per bukti saat hasil=cocok pada
                    jalur transfer saja. Pada jalur settlement rekening tujuan
                    dikirim lewat `proof_splits`.
                  items: { $ref: "#/components/schemas/ProofDestination" }
                expected_order_version:
                  type: integer
                  minimum: 0
                  description: |
                    Settlement campuran (D3 §6.2, C0 §5.2). Kehadiran field ini,
                    `deposit_allocation_ids`, atau `proof_splits` memilih jalur
                    settlement; wajib untuk pesanan yang memiliki alokasi deposit
                    aktif atau berada di sub-state revisi.
                deposit_allocation_ids:
                  type: array
                  description: Harus sama persis dengan seluruh alokasi aktif lintas versi.
                  items: { type: string, format: uuid }
                proof_splits:
                  type: array
                  description: Tepat satu per bukti order.
                  items: { $ref: "#/components/schemas/ProofSplit" }
      responses:
        "200":
          description: Verifikasi tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/VerifyResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Pesanan sudah selesai diverifikasi (`ORDER_ALREADY_DONE`) atau belum
            dikirim (`ORDER_NOT_SUBMITTED`), versi basi (`ORDER_VERSION_CONFLICT`),
            lebih bayar belum diputuskan (`OVERPAY_DECISION_REQUIRED`), atau key
            dipakai untuk keputusan lain (`IDEMPOTENCY_KEY_REUSED`). Tidak ada
            perubahan yang dilakukan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                sudahSelesai:
                  value:
                    error:
                      code: ORDER_ALREADY_DONE
                      message: Pesanan ini sudah selesai diverifikasi. Tidak ada perubahan yang dilakukan.
                belumDikirim:
                  value:
                    error:
                      code: ORDER_NOT_SUBMITTED
                      message: Verifikasi hanya untuk pesanan yang sudah dikirim.
        "422":
          description: |
            `PAYMENT_BREAKDOWN_MISMATCH` — deposit + transfer untuk order tidak
            tepat total, daftar alokasi tidak sama dengan alokasi aktif, atau
            keputusan bukti bertentangan dengan keputusan sebelumnya.
            `PAYMENT_PROOF_REQUIRED` — persetujuan untuk pesanan bernilai yang
            tidak punya alokasi deposit aktif maupun bukti transfer (tidak ada
            lagi pesanan berutang; C&C dibayar dari deposit).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/admin/orders/{id}/verification/reevaluate-destination:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
    post:
      tags: [admin]
      operationId: reevaluateAdminOrderDestination
      summary: Nilai ulang tujuan rekening dari hasil OCR tersimpan
      description: |
        Aksi eksplisit Manager/Superadmin. Tidak menerima body dan tidak
        memanggil provider OCR; seluruh bukti harus sudah mempunyai `ocr_at`.
        Job unik pada order, allowlist version, dan proof-set fingerprint.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Job baru dititipkan atau request terdeteksi duplikat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [queued, duplicate]
                    properties:
                      queued: { type: boolean }
                      duplicate: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: ORDER_NOT_SUBMITTED, AI_DISABLED, atau OCR_RESULT_MISSING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: PAYMENT_PROOF_REQUIRED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/admin/orders/{id}/revise:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
    post:
      tags: [admin]
      operationId: reviseAdminOrder
      summary: Revisi invoice berversi pesanan Done (Superadmin; Manager bila diizinkan)
      description: |
        Revisi invoice satu pesanan berstatus `done` (PRD §4.3 AP-REV-01..05,
        §3.8, §7, §10; SystemDesign.md §4.5; Database.md §4.6, §8).

        Aturan yang ditegakkan server:

        * **Alasan wajib** diisi dan dicatat di timeline + audit.
        * Hanya staf Pusat ber-kapabilitas `admin.revise`. **Manager** hanya
          boleh bila setelan `manager_boleh_revisi` sedang aktif; Superadmin
          selalu boleh. Toggle dibaca server, jadi mematikannya benar-benar
          menutup jalur ini (bukan hanya menyembunyikan tombol).
        * Revisi mengirim **daftar baris FINAL** (bukan diff): baris dengan
          `line_no` > 0 dipertahankan (qty/harga boleh berubah; serial, jenis,
          dan produknya tetap), baris tanpa `line_no` adalah baris produk BARU
          yang mendapat serial number baru bertanggal **pesanan asli**. Baris
          lama yang tidak lagi disebut memang dihapus, tetapi nilainya tetap
          terekam di snapshot.

        Efek dalam SATU transaksi: baris diganti, `versi` naik satu langkah
        (nomor invoice **TIDAK** berubah; versi tercetak `-R1`, `-R2`, …),
        `total` dihitung ulang server dari barisnya, snapshot versi lama
        tersimpan di `invoice_revisions` beserta `delta_total`, timeline +
        audit mencatat aktor/alasan/delta, dan pekerjaan render Invoice PDF
        versi **baru** + email invoice ke cabang dan admin ber-flag Invoice
        dititipkan pada transaksi yang sama. **Surat Jalan tidak dikirim
        ulang** — revisi hanya menyentuh invoice. Berkas versi lama tidak
        pernah ditimpa (kunci storage per (pesanan, jenis, versi)).

        Dua revisi bersamaan berbaris rapi karena baris pesanan dikunci; total
        dan serial selalu dihitung di dalam transaksi, sehingga rollback tidak
        menyisakan serial atau versi palsu.

        Revisi juga **gagal-tertutup (fail closed)**: selama invoice VERSI
        BERJALAN pesanan belum dirender, revisi berikutnya dijawab `409`
        `INVOICE_NOT_READY` tanpa menaikkan versi. Pekerjaan lanjutan revisi
        memang merender invoice versi pesanan saat itu, jadi tanpa penjaga ini
        revisi yang sudah dijawab `200` bisa kehilangan invoice versinya
        (versinya dilewati; tidak ada berkas untuk audit). Karena itu pula
        pekerjaan lanjutan DIPATOK ke versinya: revisi ke-*n* menuntut invoice
        versi *n* yang menjadi haknya, bukan invoice versi berjalan saat
        worker kebetulan berjalan.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan, lines]
              properties:
                alasan:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Alasan revisi (wajib, tercatat di timeline & audit).
                catatan:
                  type: string
                  maxLength: 2000
                  description: Catatan bebas opsional.
                lines:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Daftar baris FINAL versi baru.
                  items: { $ref: "#/components/schemas/ReviseLineInput" }
                deposit_reversals:
                  type: array
                  description: |
                    Reversal plan eksplisit (C0 §3.4, §5.1) — hanya untuk revisi
                    yang menurunkan total; wajib cukup bila deposit committed
                    melebihi total baru. Butuh `admin.verify` dan Idempotency-Key.
                  items:
                    type: object
                    required: [allocation_id, amount, reason]
                    properties:
                      allocation_id: { type: string, format: uuid }
                      amount: { type: integer, minimum: 1 }
                      reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Revisi tersimpan (versi naik, nomor tetap)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ReviseResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          description: |
            Aktor bukan staf Pusat ber-kapabilitas `admin.revise`, atau Manager
            mencoba merevisi sedangkan `manager_boleh_revisi` nonaktif.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Tidak ada perubahan yang dilakukan. Dua sebab:

            * `ORDER_NOT_DONE` — pesanan belum selesai sehingga belum punya
              invoice untuk direvisi;
            * `INVOICE_NOT_READY` — invoice VERSI BERJALAN pesanan belum
              dirender (pekerjaan dokumen belum selesai), sehingga revisi baru
              belum boleh menaikkan versi. Ulangi setelah dokumennya siap.
            * `REVISION_REVERSAL_PLAN_REQUIRED` / `REVISION_REVERSAL_PLAN_INVALID`
              — total turun di bawah deposit committed tanpa reversal plan yang
              cukup, atau item plan tidak sah; seluruh revisi dibatalkan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                belumSelesai:
                  value:
                    error:
                      code: ORDER_NOT_DONE
                      message: Revisi hanya untuk pesanan yang sudah selesai (Done).
                invoiceBelumSiap:
                  value:
                    error:
                      code: INVOICE_NOT_READY
                      message: Invoice versi ini belum selesai dirender sehingga revisi belum dapat dilakukan. Coba lagi setelah proses dokumennya selesai.
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/admin/orders/{id}/emails:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      operationId: listOrderEmails
      summary: Riwayat email satu pesanan (Manager & Superadmin)
      description: |
        Menampilkan setiap email transaksional pesanan itu beserta statusnya:
        `queued` (menunggu), `sending` (sedang dikirim), `sent` (terkirim), atau
        `failed` (gagal setelah percobaannya habis: 1 percobaan + 5 retry
        berjenjang). Email gagal tampil di sini lengkap dengan `last_error` dan
        dapat dikirim ulang lewat endpoint resend (PRD EM-02/EM-03).

        Pengiriman bersifat **at-least-once**: bila proses worker mati SETELAH
        SMTP menerima pesan tetapi sebelum status `sent` tersimpan, baris
        diklaim ulang setelah masa sewa 15 menit habis sehingga email yang sama
        bisa terkirim dua kali. Baris `sent` sendiri tidak pernah dikirim ulang
        oleh worker. Riwayat di sini memperlihatkan `attempts` > 1 pada baris
        seperti itu.

        `id` yang bukan UUID dijawab `404` (bukan error server) — sama seperti
        endpoint pesanan admin lain.
      responses:
        "200":
          description: Riwayat email pesanan (terbaru lebih dulu)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EmailOutbox" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/orders/{id}/emails/{kind}/resend:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: kind
        in: path
        required: true
        description: Jenis email dokumen yang dikirim ulang.
        schema:
          type: string
          enum: [invoice_cabang, invoice_admin, surat_jalan_admin]
    post:
      tags: [admin]
      operationId: resendOrderEmail
      summary: Kirim ulang email dokumen pesanan (Manager & Superadmin)
      description: |
        Membuat baris email_outbox BARU untuk pesanan itu, lalu worker
        mengirimnya. Sifatnya:

        - hanya untuk email yang MEMANG pernah dibuat untuk pesanan tersebut;
          pesanan/jenis yang belum pernah punya email dijawab `404`
          (endpoint ini bukan cara memicu email ke alamat sembarang);
        - penerima dihitung ULANG dari keadaan sekarang: email Pusat hanya ke
          admin aktif yang sudah diaktivasi dan flag `notif_invoice` /
          `notif_surat_jalan` menyala; admin undangan/nonaktif tidak pernah
          menerima. Bila tidak ada penerima yang berhak dijawab
          `409 NO_RECIPIENT`;
        - dokumen harus sudah selesai dirender; bila belum, dijawab
          `409 DOCUMENT_NOT_READY` (lampiran tidak pernah menunggu di dalam
          worker);
        - ditolak `409 EMAIL_ALREADY_QUEUED` bila masih ada email jenis yang
          sama dalam antrean, sehingga klik ganda tidak menggandakan email.
          Penjaga ini ATOMIK: diperiksa di dalam transaksi yang sama dengan
          penyimpanan baris baru dan diserialkan per (pesanan, jenis), jadi dua
          permintaan yang benar-benar bersamaan pun menghasilkan maksimal satu
          email baru dan satu entri audit; sisanya `409`;
        - `id` yang bukan UUID dijawab `404`;
        - setiap kirim ulang dicatat di `audit_logs` (`entity` = `email`,
          `action` = `resend`).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: Email diantre ulang
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/EmailOutbox" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/orders/{id}/proofs:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
    get:
      tags: [admin]
      operationId: adminListOrderProofs
      summary: Daftar bukti transfer satu pesanan (Manager & Superadmin)
      description: |
        Sama seperti sisi cabang, tetapi tanpa batas cabang: admin melihat
        bukti pesanan cabang mana pun (PRD §2.1, AP-ORD-04).
      responses:
        "200":
          description: Daftar bukti transfer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PaymentProof" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [admin]
      operationId: adminUploadOrderProofs
      summary: Unggah bukti transfer ATAS NAMA cabang (Manager & Superadmin)
      description: |
        Aturan berkas identik dengan unggahan cabang (magic bytes, batas
        `max_file`/`max_mb`, SHA-256 unik per pesanan). Yang membedakan: baris
        bukti mencatat pengunggahnya sebagai `uploaded_by_kind: admin` beserta
        NAMA admin, dan peristiwanya masuk timeline pesanan dengan penanda nama
        itu (PRD AP-ORD-06).

        Admin boleh menambah bukti pada pesanan berstatus apa pun (termasuk
        `done`) karena revisi/koreksi adalah hak Pusat (BR-07).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "201":
          description: Bukti tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PaymentProof" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/admin/orders/{id}/proofs/{proofId}/download:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
      - name: proofId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      operationId: adminDownloadOrderProof
      summary: Tautan unduh berumur pendek satu bukti (Manager & Superadmin)
      description: |
        Presigned URL berumur pendek untuk pratinjau/zoom bukti di admin —
        termasuk untuk pesanan cabang mana pun (AP-ORD-04).
      responses:
        "200":
          description: Tautan unduh
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PaymentProofDownload" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/orders/{id}/documents:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
    get:
      tags: [customer, admin]
      operationId: listOrderDocuments
      summary: Dokumen satu pesanan (Invoice & Surat Jalan)
      description: |
        Daftar dokumen pesanan beserta versinya (F1-17, PRD §6.1). Dokumen
        lahir saat status pesanan Done, jadi daftar kosong selama pesanan masih
        draft/submitted.

        Portal cabang hanya menerima INVOICE pesanan cabang SESI-nya: surat
        jalan adalah dokumen Pusat (dikirim ke admin ber-flag surat jalan),
        sehingga tidak pernah muncul di sini. Staf Pusat dengan kapabilitas
        `admin.orders` menerima seluruh dokumen pesanan cabang mana pun.
        Pesanan cabang lain dijawab `404` tanpa membocorkan keberadaannya.

        Kunci object storage TIDAK pernah dikirim; unduhan memakai presigned URL
        dari `GET /api/v1/documents/{id}/download`.
      responses:
        "200":
          description: Daftar dokumen pesanan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OrderDocument" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/documents/{id}/download:
    parameters:
      - name: id
        in: path
        required: true
        description: id dokumen (UUID).
        schema: { type: string, format: uuid }
    get:
      tags: [customer, admin]
      operationId: downloadDocument
      summary: Tautan unduh berumur pendek satu dokumen
      description: |
        Presigned URL berumur pendek (default 300 detik) yang memaksa browser
        MENGUNDUH dengan nama berkas yang benar — `Invoice-<nomor>.pdf`,
        `Surat-Jalan-<nomor>.pdf`, atau `Surat-Jalan-<nomor>.xlsx`.

        Akun cabang hanya boleh mengunduh INVOICE pesanan cabang SESI-nya;
        dokumen cabang lain maupun surat jalan dijawab `404` (sama seperti
        dokumen yang tidak ada, supaya jenis dokumen Pusat tidak terbaca).
        Staf Pusat dengan `admin.orders` boleh mengunduh seluruh dokumen, dan
        cetak dilakukan dari PDF yang diunduh.
      responses:
        "200":
          description: Tautan unduh
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DocumentDownload" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/invoices:
    get:
      tags: [customer]
      operationId: listInvoices
      summary: Riwayat invoice cabang yang sedang masuk
      description: |
        Riwayat invoice cabang (F1-19, PRD §3.8): daftar invoice milik cabang
        SESI beserta nomor, tanggal, versi, total, dan ketersediaan PDF-nya.
        Tidak ada parameter cabang — `branch_id` selalu dari sesi, sehingga
        riwayat lintas cabang tidak pernah bisa diminta dan tidak pernah
        tampil.

        Satu baris = satu DOKUMEN invoice (versi). Karena revisi invoice
        menghasilkan dokumen versi baru tanpa menimpa berkas lama (F1-17,
        F2-25), versi lama tetap terlihat di daftar ini dan tetap dapat
        diunduh; `terbaru` menandai dokumen yang versinya sama dengan versi
        pesanan sekarang.

        Pesanan ber-nomor yang dokumennya belum ada — masih `submitted`, atau
        transisi Done-nya belum merender dokumen — tetap muncul satu baris
        dengan `versi_dokumen` null dan `dapat_diunduh` false. Jadi invoice
        yang belum Done TIDAK bisa diunduh: `GET /api/v1/documents/{id}/download`
        dijawab 404 karena dokumennya memang belum ada.

        Filter periode `dari`/`sampai` memakai tanggal bisnis pesanan (WIB,
        BR-04) dan inklusif di kedua ujungnya; keduanya opsional. Format yang
        tidak dikenal atau rentang terbalik dijawab `400 VALIDATION_FAILED`,
        bukan daftar kosong.
      parameters:
        - name: dari
          in: query
          required: false
          description: Batas awal periode (YYYY-MM-DD), inklusif.
          schema: { type: string, format: date }
        - name: sampai
          in: query
          required: false
          description: Batas akhir periode (YYYY-MM-DD), inklusif.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Riwayat invoice cabang
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InvoiceRow" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/admin/orders/{id}/documents:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
    get:
      tags: [admin]
      operationId: listAdminOrderDocuments
      summary: Seluruh dokumen satu pesanan (Manager & Superadmin)
      description: |
        Seluruh dokumen pesanan cabang mana pun — invoice dan surat jalan,
        semua versi — untuk portal admin (F1-17, PRD §6.1).
      responses:
        "200":
          description: Daftar dokumen pesanan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OrderDocument" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [admin]
      operationId: generateAdminOrderDocuments
      summary: Membuat/menyegarkan dokumen pesanan Done (Manager & Superadmin)
      description: |
        Memastikan ketiga dokumen versi berjalan — Invoice PDF, Surat Jalan
        XLSX, dan Surat Jalan PDF — tersedia untuk pesanan yang sudah **Done**
        (SystemDesign.md §4.4, §8). Dipakai portal admin untuk membuat dokumen
        pertama kali atau menyegarkan setelah render gagal (mis. mesin PDF
        sempat tidak siap); transisi Done sendiri memanggil layanan yang sama.

        Sifatnya IDEMPOTEN: memanggil ulang tidak menghasilkan dokumen ganda,
        tidak menimpa berkas versi yang sudah ada, dan berkas versi lama tetap
        utuh setelah revisi invoice (versi +1).

        Pesanan yang belum Done dijawab `409 ORDER_NOT_DONE`; `503
        DOCUMENT_RENDER_UNAVAILABLE` bila mesin PDF (Gotenberg) belum siap, dan
        `503 UNAVAILABLE` bila object storage belum siap.
      responses:
        "200":
          description: Dokumen yang tersedia setelah penyegaran
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OrderDocument" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/admin/reports/order-lines:
    get:
      tags: [admin]
      operationId: listReportOrderLines
      summary: Data laporan order line (Superadmin)
      description: |
        Satu baris per order line dari seluruh cabang (PRD §4.7 AP-REP-01),
        termasuk baris biaya packaging bila ada; pesanan berstatus draf
        DIKECUALIKAN karena belum punya nomor/tanggal.

        Filter (AP-REP-02): rentang tanggal bisnis WIB (`dari`/`sampai`),
        cabang multi (`cabang` boleh diulang atau dipisah koma), `status`,
        `jenis` baris, `cnc`, `special`, dan `pi`.

        `special` dan `pi` murni ATRIBUT cabang (`b.is_special`, `b.pajak_in`):
        hanya tampil sebagai kolom dan bisa difilter, TIDAK pernah mengubah
        harga, subtotal, atau pajak.

        Paginasi server: `halaman` (default 1) dan `per_halaman` (default 25,
        maksimum 500). Otorisasi ada di server: Manager dan akun cabang ditolak
        (PRD §2.1), bukan hanya menunya disembunyikan.
      parameters:
        - name: dari
          in: query
          required: false
          description: Tanggal awal rentang (YYYY-MM-DD, WIB).
          schema: { type: string, format: date }
        - name: sampai
          in: query
          required: false
          description: Tanggal akhir rentang (YYYY-MM-DD, WIB).
          schema: { type: string, format: date }
        - name: cabang
          in: query
          required: false
          description: |
            id cabang (UUID). Boleh diulang (`?cabang=a&cabang=b`) atau
            dipisah koma (`?cabang=a,b`).
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [submitted, done, semua] }
        - name: jenis
          in: query
          required: false
          description: Jenis baris pesanan (produk atau biaya packaging).
          schema: { type: string, enum: [product, packaging, semua] }
        - name: cnc
          in: query
          required: false
          schema: { type: boolean }
        - name: special
          in: query
          required: false
          schema: { type: boolean }
        - name: pi
          in: query
          required: false
          schema: { type: boolean }
        - name: halaman
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_halaman
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 25 }
      responses:
        "200":
          description: Satu halaman laporan order line
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ReportPage" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/reports/export:
    post:
      tags: [admin]
      operationId: requestReportExport
      summary: Minta ekspor XLSX asinkron (Superadmin)
      description: |
        Membuat pekerjaan ekspor XLSX (PRD §4.7 AP-REP-04) untuk filter yang
        sama dengan endpoint daftar order line. Berkasnya ditulis **streaming**
        oleh worker (excelize streaming writer): header ter-freeze, kolom uang
        berformat Rupiah, dan sheet kedua berisi rekap bulanan per cabang
        (AP-REP-05). Ekspor besar (50.000 baris) dibaca bertahap sehingga tidak
        menahan seluruh data di memori.

        Jawaban `202 Accepted` memuat pekerjaan beserta filter tersimpan yang
        BENAR-BENAR dipakai ekspor; jumlah baris hasilnya selalu sama dengan
        jumlah baris daftar untuk filter itu (PRD §9 no.10). Pantau lewat
        `GET /api/v1/admin/reports/export/{id}` lalu unduh lewat
        `GET /api/v1/admin/reports/export/{id}/download`.

        Manager dan akun cabang ditolak (PRD §2.1). `503 UNAVAILABLE` bila
        object storage atau penjadwal pekerjaan belum siap — pekerjaan tidak
        pernah dibuat menggantung tanpa bisa dijalankan.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportFilter" }
      responses:
        "202":
          description: Pekerjaan ekspor dibuat (status `queued`)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ReportExportJob" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/reports/export/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: id pekerjaan ekspor (UUID).
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      operationId: getReportExport
      summary: Status pekerjaan ekspor XLSX (Superadmin)
      description: |
        Status satu pekerjaan ekspor: `queued` (menunggu worker), `proses`
        (sedang ditulis), `selesai` (berkas siap diunduh beserta `nama_file` dan
        `jumlah_baris`), atau `gagal` (beserta `pesan`). Hanya Superadmin
        (PRD §2.1).
      responses:
        "200":
          description: Status pekerjaan ekspor
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ReportExportJob" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/reports/export/{id}/download:
    parameters:
      - name: id
        in: path
        required: true
        description: id pekerjaan ekspor (UUID).
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      operationId: downloadReportExport
      summary: Tautan unduh hasil ekspor XLSX (Superadmin)
      description: |
        Presigned URL berumur pendek untuk berkas hasil ekspor yang sudah
        selesai. Pekerjaan yang belum selesai dijawab `409 REPORT_NOT_READY`.
        Akses selalu lewat tautan berumur pendek: kunci object storage tidak
        pernah dikirim ke klien (SystemDesign.md §8). Laporan sengaja TIDAK
        dicatat pada tabel `documents` supaya tidak bisa diunduh lewat endpoint
        dokumen yang boleh dipakai Manager.
      responses:
        "200":
          description: Tautan unduh berumur pendek
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ReportDownload" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/tutorial:
    get:
      tags: [customer]
      operationId: listTutorialTopics
      summary: Konten halaman Tutorial portal cabang
      description: |
        Konten halaman `pTutorial` portal cabang (F2-27, PRD §3.8): empat topik
        awal (cara memesan, unggah bukti transfer, aturan Sertifikat, dan
        Cash & Carry) yang isinya DIKELOLA DI DATABASE, sehingga pembaruan
        Superadmin langsung terlihat pada permintaan berikutnya — tanpa build
        atau deploy portal.

        Konten adalah TEKS BIASA: tidak ada HTML/SVG arbitrer. Teks disanitasi
        di server (tag, komentar, dan blok script/style dibuang) dan ilustrasi
        hanya dipilih dari kunci bawaan aplikasi (`ikon`), yang di-render
        aplikasi sendiri mengikuti design prototype.

        Pembacaan hanya menuntut sesi yang sah (halaman informasi). Tidak ada
        jalur tulis di sini: perubahan konten hanya lewat
        `PUT /api/v1/admin/tutorial` oleh Superadmin.
      responses:
        "200":
          description: Konten tutorial yang berlaku
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TutorialContent" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/admin/tutorial:
    get:
      tags: [admin]
      operationId: listAdminTutorialTopics
      summary: Konten tutorial (Superadmin)
      description: |
        Isi yang sama dengan pembacaan portal cabang, tetapi lewat jalur admin
        yang eksplisit: hanya Superadmin (`admin.tutorial`, PRD §2.1). Manager
        dan akun cabang dijawab `403 FORBIDDEN` di router DAN di layer service.
      responses:
        "200":
          description: Konten tutorial yang berlaku
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TutorialContent" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [admin]
      operationId: updateTutorialTopics
      summary: Ganti seluruh konten tutorial (Superadmin)
      description: |
        Menggantikan SELURUH konten tutorial: urutan array = urutan tampil
        (dinomori server sebagai 10, 20, 30, …), `id` kosong berarti topik
        baru, dan topik yang tidak disertakan tetapi masih ada di database
        DIHAPUS. Seluruh teks divalidasi + disanitasi lebih dahulu — bila ada
        satu bagian yang tidak valid, tidak ada yang tersimpan (all-or-nothing)
        dan jawabannya `400 VALIDATION_FAILED` dengan pesan per bagian
        (`topik[i].<bagian>`).

        Batas: maksimal 12 topik; judul ≤ 120, ringkasan ≤ 300, satu langkah
        ≤ 500 karakter; 1–24 langkah per topik; `ikon` harus salah satu kunci
        bawaan. Konten berbahaya dibersihkan di server (tidak ada HTML
        arbitrer) dan setiap topik yang benar-benar berubah dicatat ke audit
        log dengan snapshot before/after (F2-27) — mengirim ulang konten yang
        sama bersifat no-op tanpa entri audit baru. Hanya Superadmin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TutorialUpdateRequest" }
      responses:
        "200":
          description: Konten kanonik yang tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TutorialContent" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/admin/audit-logs:
    get:
      tags: [admin]
      operationId: listAuditLogs
      summary: Audit log aktivitas admin (Superadmin)
      description: |
        Satu halaman `audit_logs` (SystemDesign.md §5.4) untuk ditelusuri
        Superadmin: siapa melakukan apa, kapan, dari IP mana, beserta snapshot
        `before`/`after` (PRD §4.10 fase 2 "audit log UI").

        Setiap mutasi admin yang BERHASIL menulis tepat satu entri di dalam
        transaksi yang sama dengan perubahannya (cabang, harga, verifikasi,
        revisi, pengaturan, tutorial, dan mutasi akun); permintaan yang gagal
        atau tidak mengubah apa pun tidak meninggalkan entri.

        Data sensitif TIDAK pernah masuk snapshot: kata sandi, token (termasuk
        tautan atur ulang/aktivasi), secret/kunci, dan URL (termasuk URL bukti
        transfer) diredaksi menjadi `[REDACTED]` — baik saat menyimpan maupun
        saat menampilkan. Email akun juga tidak ikut dicatat pada snapshot
        mutasi akun.

        Filter: `entitas` (boleh diulang atau dipisah koma), `aksi`, `aktor`
        (id akun berbentuk UUID atau potongan nama), serta rentang tanggal
        bisnis WIB `dari`/`sampai` (inklusif). Nilai yang tidak dikenal dijawab
        `400 VALIDATION_FAILED` supaya salah ketik tidak diam-diam
        menghilangkan baris dari hasil.

        Paginasi server: `halaman` (default 1) dan `per_halaman` (default 25,
        maksimum 100). Urutan `at DESC, id DESC` STABIL sehingga menelusuri
        halaman berikutnya tidak melewatkan atau mengulang baris. Hanya
        Superadmin (`admin.audit`); Manager dan akun cabang dijawab `403`.
      parameters:
        - name: entitas
          in: query
          required: false
          description: |
            Kolom `entity` (mis. `order`, `branch`, `admin_user`). Boleh
            diulang atau dipisah koma.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: aksi
          in: query
          required: false
          description: Kolom `action` (mis. `create`, `update`, `verify`, `revise`, `reset`).
          schema: { type: string }
        - name: aktor
          in: query
          required: false
          description: |
            id akun pelaku (UUID) atau potongan nama pelaku — UUID dicocokkan
            persis ke `actor_id`, selain itu dicari pada `actor_nama`.
          schema: { type: string }
        - name: dari
          in: query
          required: false
          description: Tanggal awal rentang (YYYY-MM-DD, WIB, inklusif).
          schema: { type: string, format: date }
        - name: sampai
          in: query
          required: false
          description: Tanggal akhir rentang (YYYY-MM-DD, WIB, inklusif).
          schema: { type: string, format: date }
        - name: halaman
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_halaman
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Satu halaman audit log
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AuditLogPage" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/admin/master-imports/impact/preview:
    post:
      tags: [admin]
      operationId: previewImpactMasterImport
      summary: Membuat preview dry-run master Impact (Superadmin)
      description: |
        Memvalidasi hash, sheet, rentang, dua baris header, 34 cabang, komponen
        tarif, catatan khusus, dan state akses existing. Endpoint hanya membuat
        artifact/attempt/item preview; tabel master cabang, produk, dan tarif
        tidak diubah. Workbook mentah tidak disimpan pada repo atau log.
        Preview boleh dijalankan pada APP_ENV=production oleh Superadmin;
        apply dan rollback tetap ditolak fail-closed di production.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Workbook XLSX Impact yang hash-nya diotorisasi (maksimum 5 MiB).
      responses:
        "201":
          description: Preview immutable berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MasterImportPreview"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: State preview tidak memenuhi kontrak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "413":
          description: Workbook melebihi 5 MiB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415":
          description: Berkas bukan XLSX
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: Hash/struktur/nilai workbook tidak sesuai kontrak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/admin/master-imports/impact/{id}/evidence:
    get:
      tags: [admin]
      operationId: getImpactMasterImportEvidence
      summary: Membaca evidence privat item review satu attempt (Superadmin)
      description: |
        Mengembalikan nilai catatan khusus/kolom luar kontrak hanya kepada
        Superadmin untuk keputusan per-item. Nilai privat tidak ikut respons
        preview umum dan tidak boleh dipindahkan ke log atau laporan umum.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Evidence privat attempt
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MasterImportEvidenceItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/admin/master-imports/impact/{id}/apply:
    post:
      tags: [admin]
      operationId: applyImpactMasterImport
      summary: Menerapkan satu attempt preview Impact secara atomik di staging
      description: |
        Superadmin saja. Server mengunci attempt dan seluruh state master/akses,
        menghitung ulang fingerprint preview, memvalidasi keputusan per item,
        lalu menerapkan cabang/produk/varian/tarif dalam satu transaksi. Retry
        dengan idempotency_key yang sama mengembalikan hasil yang sama tanpa
        audit atau mutasi ganda. Selalu ditolak pada APP_ENV=production.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterImportApplyRequest" }
      responses:
        "200":
          description: Apply berhasil atau retry idempoten
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MasterImportApplyResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Keputusan belum lengkap, preview stale, attempt sudah applied, atau production ditolak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/admin/master-imports/impact/apply-runs/{id}/rollback:
    post:
      tags: [admin]
      operationId: rollbackImpactMasterImport
      summary: Rollback perubahan reversibel satu apply run staging
      description: |
        Mengembalikan perubahan master/tarif hanya bila optimistic fingerprint
        masih sama. Revokasi akun/token/sesi tidak pernah dibalik; respons dan
        audit mencatat identity_revocation_not_reversed. Selalu ditolak pada
        APP_ENV=production.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rollback selesai atau sudah pernah selesai
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MasterImportRollbackResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Data berubah sesudah apply atau production ditolak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/deposit:
    get:
      tags: [customer]
      operationId: getDepositSummary
      summary: Saldo deposit cabang sesi
      description: |
        Saldo tersedia dan versi journal cabang sesi. Top-up yang belum
        diputuskan ditampilkan terpisah dan tidak pernah dijumlahkan ke saldo
        (D3 §6.1).
      responses:
        "200":
          description: Ringkasan deposit
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DepositSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/deposit/transactions:
    get:
      tags: [customer]
      operationId: listDepositTransactions
      summary: Journal deposit cabang sesi (terbaru dulu)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Daftar journal
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DepositTransaction" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/deposit/topups:
    get:
      tags: [customer]
      operationId: listMyDepositTopups
      summary: Top-up deposit cabang sesi
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Daftar top-up
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DepositTopup" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [customer]
      operationId: createDepositTopup
      summary: Ajukan top-up deposit (multipart, selalu pending)
      description: |
        Field multipart `proof` (JPG/PNG/PDF, jenis dari magic bytes),
        `declared_amount` (rupiah), dan `bank_account_id` (rekening efektif D2
        cabang sesi). Header `Idempotency-Key` wajib. Bukti identik untuk
        permintaan yang sama dijawab ulang `200`; untuk permintaan berbeda
        `409 PAYMENT_PROOF_ALREADY_USED`. Sukses `201` selalu `pending_review`
        dan tidak pernah menambah saldo. Deposit hanya untuk cabang Cash &
        Carry (pesanannya dibayar dari saldo); cabang lain dijawab
        `403 DEPOSIT_CNC_ONLY`.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [proof, declared_amount, bank_account_id]
              properties:
                proof: { type: string, format: binary }
                declared_amount: { type: integer, minimum: 1 }
                bank_account_id: { type: string, format: uuid }
      responses:
        "201":
          description: Top-up tercatat pending_review
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DepositTopup" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Konflik aturan deposit (saldo, versi, rekening, idempotensi)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /api/v1/deposit/topups/{id}/proof:
    get:
      tags: [customer]
      operationId: getMyDepositTopupProof
      summary: Tautan unduh bukti top-up milik cabang sesi
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Tautan berumur pendek
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DepositProofURL" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orders/{id}/payment:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
    get:
      tags: [customer]
      operationId: getOrderPayment
      summary: Rincian pembayaran pesanan cabang sesi
      description: |
        Rincian pembayaran order (C3/C4; C0 §5.1): total kini, deposit committed
        lintas versi, sisa tagihan, sub-state revisi, pointer settlement Done,
        alokasi, dan saldo cabang (journal_version untuk alokasi/reversal).
        Bukti transfer yang belum diverifikasi tidak dihitung sebagai bayar.
      responses:
        "200":
          description: Rincian pembayaran
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OrderPayment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orders/{id}/deposit-allocations:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
    get:
      tags: [customer]
      operationId: listOrderDepositAllocations
      summary: Alokasi deposit pesanan cabang sesi
      responses:
        "200":
          description: Daftar alokasi
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DepositAllocation" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [customer]
      operationId: allocateOrderDeposit
      summary: Alokasikan saldo deposit ke pesanan Submitted milik cabang
      description: |
        Debit journal langsung (bukan reservasi). `expected_journal_version`
        dan `expected_order_version` wajib cocok; saldo atau versi basi
        ditolak tanpa mengurangi nilai diam-diam. Header `Idempotency-Key`
        wajib; retry key yang sama dijawab `200` dengan hasil yang sama.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositAllocateRequest" }
      responses:
        "201":
          description: Alokasi tercatat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DepositAllocationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Konflik aturan deposit (saldo, versi, rekening, idempotensi)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/admin/deposits:
    get:
      tags: [admin]
      operationId: adminListDeposits
      summary: Saldo dan antrean top-up seluruh cabang aktif
      responses:
        "200":
          description: Ikhtisar deposit
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DepositBranchOverview" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/deposits/{branch_id}:
    get:
      tags: [admin]
      operationId: adminGetBranchDeposit
      summary: Detail deposit satu cabang (saldo, top-up, journal, rekonsiliasi)
      parameters:
