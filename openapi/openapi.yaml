  /api/v1/admin/prices:
    get:
      tags: [admin]
      operationId: listPrices
      summary: Matriks harga Produk × Cabang (Manager & Superadmin)
      description: |
        Grid untuk halaman Matriks harga (PRD AP-KAT-02). `produk` adalah
        baris, `cabang` adalah kolom, dan `sel` hanya memuat sel yang BERISI
        harga. Sel tanpa harga berarti produk tidak dijual ke cabang itu
        (PRD AP-KAT-03) — harga default TIDAK dipakai sebagai cadangan.
        Setiap sel memuat komponen tarif HJM, P1, dan SPV pembentuk
        `harga` (versi tarif aktif hasil impor Impact atau edit matriks);
        sel harga lama tanpa rincian mengembalikan komponen `null` dan
        `sumber: legacy`.
        Filter: `q`/`jenis`/`aktif` untuk produk, `branch_q` untuk pencarian
        cabang, `branch_id` untuk membatasi sel ke satu cabang.
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: jenis
          in: query
          schema: { type: string, enum: [reguler, sertifikat] }
        - name: aktif
          in: query
          schema: { type: boolean }
        - name: branch_q
          in: query
          schema: { type: string }
          description: Pencarian nama cabang.
        - name: branch_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Matriks harga
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PriceMatrix" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [admin]
      operationId: updatePrices
      summary: Batch edit sel matriks harga (Manager & Superadmin)
      description: |
        Mengubah banyak sel sekaligus berupa komponen tarif; seluruh
        perubahan dan catatan auditnya ditulis dalam satu transaksi. Harga
        jual TIDAK diterima dari klien: server menghitung
        `round_half_up(HJM + HJM × P1 + SPV)` (docs/design/master-impact-import.md
        §7), menyimpannya sebagai versi tarif manual append-only, lalu
        memproyeksikannya ke harga sel. `hjm: null` (atau field kosong)
        mengosongkan sel sehingga produk tidak lagi dijual ke cabang itu.
        Komponen negatif atau P1 di luar 0–1 ditolak dan produk Sertifikat
        hanya boleh berkomponen 0. Sel yang komponennya sama dengan versi
        aktif diabaikan (tanpa versi maupun audit baru).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceBatchInput" }
      responses:
        "200":
          description: Hasil batch edit
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PriceResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/prices/copy:
    post:
      tags: [admin]
      operationId: copyPrices
      summary: Salin harga satu cabang ke cabang lain (Manager & Superadmin)
      description: |
        Aksi "salin harga" (PRD AP-KAT-04). Bersifat MENGGANTIKAN: matriks
        cabang tujuan menjadi persis matriks cabang sumber — termasuk
        komponen HJM, P1, dan SPV-nya — sehingga sel yang tidak ada di cabang
        sumber menjadi kosong. Sel sumber tanpa rincian tersalin sebagai
        HJM = harga, P1 = 0, SPV = 0. Kirim `to_branch_ids` untuk sejumlah
        cabang, atau `semua: true` untuk seluruh cabang lain.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceCopyInput" }
      responses:
        "200":
          description: Hasil salin harga
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PriceCopyResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/settings:
    get:
      tags: [admin]
      operationId: listAdminSettings
      summary: Pengaturan sistem (Superadmin)
      responses:
        "200":
          description: Peta kunci pengaturan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [admin]
      operationId: updateSetting
      summary: Simpan satu atau beberapa pengaturan (Superadmin)
      description: |
        Dua bentuk body diterima: satu kunci (`key` + `value`) untuk
        kompatibilitas, atau banyak kunci sekaligus (`values`). Seluruh nilai
        divalidasi lebih dahulu — bila ada satu yang tidak valid, tidak ada
        yang tersimpan. Hanya kunci yang nilainya benar-benar BERUBAH
        (perbandingan bentuk kanonik) yang ditulis dan tercatat di audit log;
        mengirim ulang nilai yang sama bersifat no-op (tetap `200`) tanpa
        entri audit baru. Baca lengkap pengaturan hanya lewat
        `/api/v1/admin/settings` — tidak ada permukaan pengaturan lintas-role
        (PRD §2.1).

        Rentang: biaya_packaging 0..100000000 (Rupiah bulat);
        token_hari 1..3650; reset_menit 1..43200; max_mb 1..1024;
        max_file 1..100; digit_invoice 1..10; manager_boleh_revisi boolean;
        `ai` objek {aktif, min_keyakinan 0..1, tol_kurang, tol_lebih,
        digit_rek 1..20, mundur 0..3650}.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                key:
                  type: string
                  enum:
                    [
                      biaya_packaging,
                      token_hari,
                      reset_menit,
                      max_mb,
                      max_file,
                      digit_invoice,
                      manager_boleh_revisi,
                      ai,
                    ]
                value: { $ref: "#/components/schemas/SettingValue" }
                values:
                  type: object
                  description: Banyak kunci sekaligus (all-or-nothing).
                  additionalProperties: { $ref: "#/components/schemas/SettingValue" }
            examples:
              satuKunci:
                value: { key: biaya_packaging, value: 4000 }
              banyakKunci:
                value: { values: { biaya_packaging: 4000, token_hari: 14 } }
      responses:
        "200":
          description: Pengaturan tersimpan (bentuk nilai kanonik)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      key: { type: string }
                      value: { $ref: "#/components/schemas/SettingValue" }
                      values:
                        type: object
                        additionalProperties: { $ref: "#/components/schemas/SettingValue" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/backup-runs:
    get:
      tags: [admin]
      operationId: listBackupRuns
      summary: Status cadangan terenkripsi (Superadmin)
      description: |
        Hasil setiap pekerjaan cadangan dari tabel `backup_runs`
        (Architecture.md §7, Database.md §4.7) berikut ringkasan status:

        - `terakhir` — run terbaru (jenis postgres/storage/wal), terbaru dulu;
        - `perlu_tindakan` — true bila run terakhir yang GAGAL belum disusul
          run sukses apa pun untuk jenis yang sama (dipakai dashboard admin
          F1-20 sebagai penanda "perlu tindakan");
        - `tujuan`, `jadwal`, `retensi` — konfigurasi efektif yang berlaku
          (30 harian, 12 bulanan, bukti transfer tanpa batas).

        Manager dan akun cabang ditolak (PRD §2.1).
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        "200":
          description: Ringkasan status cadangan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [terakhir, perlu_tindakan, tujuan, jadwal, retensi]
                    properties:
                      terakhir:
                        type: array
                        items: { $ref: "#/components/schemas/BackupRun" }
                      perlu_tindakan: { type: boolean }
                      pesan: { type: string }
                      tujuan: { type: string }
                      jadwal: { type: string }
                      retensi:
                        type: object
                        properties:
                          harian: { type: integer }
                          bulanan: { type: integer }
                          wal_hari: { type: integer }
                          bukti_tanpa_batas: { type: boolean }
                      sukses_terakhir:
                        type: object
                        additionalProperties: { type: string, format: date-time }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/bank-accounts:
    get:
      tags: [admin]
      operationId: listBankAccounts
      summary: Rekening bank, termasuk nonaktif (Superadmin)
      description: |
        Pengelolaan rekening: seluruh rekening dikembalikan, aktif maupun
        nonaktif, supaya Superadmin dapat mengaktifkannya kembali. Manager dan
        akun cabang ditolak (PRD §2.1).
      responses:
        "200":
          description: Daftar rekening
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BankAccount" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      operationId: createBankAccount
      summary: Tambah rekening bank (Superadmin)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountInput" }
      responses:
        "201":
          description: Rekening dibuat
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BankAccount" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/bank-accounts/{id}:
    put:
      tags: [admin]
      operationId: updateBankAccount
      summary: Ubah / aktif-nonaktifkan rekening (Superadmin)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountUpdate" }
      responses:
        "200":
          description: Rekening tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BankAccount" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/branch:
    get:
      tags: [admin]
      operationId: listBranchUsers
      summary: Daftar akun cabang (Manager & Superadmin)
      description: |
        Satu baris per CABANG (1 cabang = 1 akun, PRD BR-01), termasuk cabang
        yang belum registrasi. `status` bernilai `aktif`, `belum_registrasi`,
        atau `nonaktif`; `nonaktif` juga dipakai bila CABANG-nya dinonaktifkan
        karena keadaan itu sama-sama membuat akun tidak bisa login.
      responses:
        "200":
          description: Daftar akun cabang beserta status dan login terakhir
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BranchUser" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/users/branch/{id}:
    put:
      tags: [admin]
      operationId: setBranchUserActive
      summary: Aktifkan/nonaktifkan akun cabang (Manager & Superadmin)
      description: |
        `id` adalah id AKUN (`branch_users.id`), bukan id cabang. Menonaktifkan
        akun langsung mencabut seluruh sesi akun tersebut sehingga akses
        berhenti saat itu juga (PRD AP-CAB-03).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              additionalProperties: false
              properties:
                is_active: { type: boolean }
      responses:
        "200":
          description: Akun cabang setelah perubahan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BranchUser" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users/branch/{id}/reset:
    post:
      tags: [admin]
      operationId: resendBranchUserReset
      summary: Kirim ulang tautan atur ulang kata sandi akun cabang
      description: |
        Memakai jalur email yang sama dengan lupa kata sandi; tautan berlaku
        `reset_menit` (default 60 menit) dan hanya bisa dipakai sekali. Email
        dialihkan ke email_outbox pada kartu F1-16 tanpa mengubah handler ini.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Permintaan pengiriman ulang diterima
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [pesan]
                    properties:
                      pesan: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Cabang belum punya akun (`NO_ACCOUNT`) atau akun/cabangnya sedang
            nonaktif (`ACCOUNT_INACTIVE`) sehingga tidak boleh memegang tautan.
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/admin:
    get:
      tags: [admin]
      operationId: listAdminUsers
      summary: Daftar akun admin (Superadmin)
      description: |
        `status` bernilai `undangan` (belum mengaktivasi akun), `aktif`, atau
        `nonaktif`. Admin undangan tidak bisa login dan tidak menerima email
        dokumen (PRD AP-USR-02).
      responses:
        "200":
          description: Daftar akun admin
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      operationId: inviteAdmin
      summary: Undang admin baru (Superadmin)
      description: |
        Akun dibuat TANPA kata sandi sehingga belum bisa login dan belum
        menerima email dokumen. Email undangan berisi tautan aktivasi sekali
        pakai dan diantre lewat email_outbox (F1-16) — tautan aslinya tidak
        pernah dikembalikan endpoint ini. Tautan berlaku `token_hari` (default
        14 hari).

        Email yang sudah dipakai akun admin LAIN maupun akun/email cabang
        ditolak dengan `409 EMAIL_TAKEN`: login mencari akun admin lebih dulu,
        jadi email milik cabang tidak boleh dipegang admin (kalau tidak, akun
        cabang itu tidak akan pernah bisa masuk).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama, email, role]
              additionalProperties: false
              properties:
                nama: { type: string, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                role: { type: string, enum: [manager, superadmin] }
                notif_invoice: { type: boolean, default: false }
                notif_surat_jalan: { type: boolean, default: false }
      responses:
        "201":
          description: Undangan dibuat; email diantre ke outbox
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminUser" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/admin/{id}:
    put:
      tags: [admin]
      operationId: updateAdminUser
      summary: Ubah role, flag email dokumen, atau status admin (Superadmin)
      description: |
        Field yang tidak dikirim tidak diubah. Superadmin aktif TERAKHIR tidak
        boleh dinonaktifkan atau diturunkan menjadi Manager, termasuk bila dua
        permintaan datang bersamaan (`409 LAST_SUPERADMIN`, PRD AP-USR-03).

        "Aktif" di sini berarti superadmin yang benar-benar BISA LOGIN
        (`is_active` DAN sudah diaktivasi). Superadmin yang masih berstatus
        undangan (belum mengaktivasi akunnya sehingga tidak bisa masuk) TIDAK
        dihitung sebagai pelindung, supaya sistem tidak pernah ditinggalkan
        tanpa satu pun superadmin yang bisa login.

        Menonaktifkan admin mencabut seluruh sesinya.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nama: { type: string, maxLength: 120 }
                role: { type: string, enum: [manager, superadmin] }
                notif_invoice: { type: boolean }
                notif_surat_jalan: { type: boolean }
                is_active: { type: boolean }
      responses:
        "200":
          description: Akun admin setelah perubahan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminUser" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/admin/{id}/resend:
    post:
      tags: [admin]
      operationId: resendAdminInvitation
      summary: Kirim ulang tautan aktivasi admin undangan (Superadmin)
      description: |
        Jalan pemulihan bila email undangan pertama gagal terkirim: tautan
        aktivasi dibuat ULANG (tautan lama otomatis batal, satu tautan aktif per
        akun) dan email undangan diantre ulang lewat email_outbox.

        Hanya berlaku untuk admin yang masih berstatus `undangan`. Akun yang
        sudah mengaktivasi (atau sudah dinonaktifkan) dijawab
        `409 NOT_INVITED` dan memakai alur lupa kata sandi biasa. Memanggil
        berulang tidak membuat akun baru. Tautan aslinya tidak pernah
        dikembalikan endpoint ini.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Tautan aktivasi dibuat ulang dan email undangan diantre
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminUser" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/dashboard:
    get:
      tags: [admin]
      operationId: getAdminDashboard
      summary: Metrik dashboard admin + chip perlu tindakan (Manager & Superadmin)
      description: |
        Metrik dashboard admin Pusat (PRD §4.1 AP-DSH-01..06): ringkasan periode
        terpilih, chip "perlu tindakan", tren 12 bulan, tren harian bulan
        berjalan, ringkasan status pembayaran, dan peringkat cabang.

        Catatan perilaku:

        - **Filter** ada di query string supaya bisa di-bookmark/di-share
          (SystemDesign §7.2). `cabang` kosong atau `semua` berarti seluruh
          cabang; `periode` kosong berarti `bulan`.
        - **Metrik berbasis role (AP-DSH-02).** Manager menerima `jumlah`
          pesanan; field `nilai` (rupiah) HANYA ada untuk Superadmin
          (kapabilitas `admin.dashboard.value`) dan **tidak dikirim sama sekali**
          untuk Manager — bukan dikirim sebagai nol.
        - **Chip TIDAK dibatasi periode** (Database.md §7.2): ia keadaan yang
          menunggu penanganan sekarang. Tiap angkanya sama dengan `total` daftar
          `/api/v1/admin/orders` bila chip diklik dengan filter padanannya:
          `menunggu` → `status=submitted&verif=belum`, `perlu_review` →
          `verif=perlu_review`, `email_gagal` → `email_gagal=true`. Cash &
          Carry dibayar dari deposit saat dikirim, jadi tidak ada chip jatuh
          tempo.
        - **Tanggal bisnis** memakai zona Asia/Jakarta. Rentang periode mengikuti
          prototype: minggu mulai Senin, bulan & tahun berjalan berakhir HARI INI
          (bukan akhir bulan/tahun). `harian` selalu bulan berjalan, tidak
          terpengaruh `periode`.
        - **Tren 12 bulan** memuat seluruh bulan tahun bisnis berjalan
          (Januari–Desember); bulan tanpa pesanan dikirim dengan `jumlah` 0.
        - **Peringkat cabang** dibatasi 5 teratas, diurutkan jumlah lalu nilai
          lalu nama cabang.
      parameters:
        - name: cabang
          in: query
          description: Filter satu cabang (uuid). Kosong atau `semua` berarti seluruh cabang.
          schema: { type: string }
        - name: periode
          in: query
          description: Periode ringkasan. Kosong berarti `bulan`.
          schema:
            type: string
            enum: [hari, minggu, bulan, tahun, ""]
            default: bulan
      responses:
        "200":
          description: Metrik dashboard
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminDashboard" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/orders:
    get:
      tags: [admin]
      operationId: listAdminOrders
      summary: Riwayat pemesanan seluruh cabang (Manager & Superadmin)
      description: |
        Daftar pesanan SELURUH cabang dengan pencarian, filter, grouping, dan
        paginasi server (PRD AP-ORD-01..03). Hanya admin Pusat ber-kapabilitas
        `admin.orders` (Manager dan Superadmin) yang boleh memakainya; akun
        cabang dijawab `403`.

        Catatan perilaku:

        - **Paginasi server.** `per_halaman` bawaan 25 dan dipagari 100, jadi
          riwayat besar tidak pernah diunduh seluruhnya ke browser. `total`
          adalah jumlah SELURUH baris yang cocok filter, bukan panjang halaman.
        - **Grouping** (`grup`) tidak mengubah isi halaman, ia menambah urutan
          (per cabang A→Z, per periode terbaru dahulu) dan array `ringkasan`
          berisi jumlah + nilai per grup untuk seluruh himpunan terfilter.
        - **Tanggal bisnis** memakai zona Asia/Jakarta, termasuk grouping
          hari/bulan/tahun.
        - **`email_gagal`** dibaca dari outbox email domain notification: sebuah
          pesanan bertanda `email_gagal` bila punya minimal satu email
          `failed`; filter `email_gagal=true` hanya menyisakan pesanan itu.
        - Pencarian `cari` mencocokkan nomor invoice, nama cabang, dan serial
          number (ILIKE).
      parameters:
        - name: cari
          in: query
          description: Cari nomor, nama cabang, atau serial number.
          schema: { type: string }
        - name: cabang
          in: query
          description: Filter satu cabang (uuid). Kosong berarti semua cabang.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: Filter status pesanan. `semua`/kosong berarti tanpa filter.
          schema: { type: string, enum: [semua, draft, submitted, done] }
        - name: verif
          in: query
          description: Filter status verifikasi. `semua`/kosong berarti tanpa filter.
          schema: { type: string, enum: [semua, belum, cocok, perlu_review] }
        - name: cnc
          in: query
          description: Filter pesanan Cash & Carry (`true`/`false`).
          schema: { type: boolean }
        - name: email_gagal
          in: query
          description: Filter pesanan yang punya email gagal (`true`/`false`).
          schema: { type: boolean }
        - name: dari
          in: query
          description: Tanggal bisnis awal (YYYY-MM-DD, inklusif).
          schema: { type: string, format: date }
        - name: sampai
          in: query
          description: Tanggal bisnis akhir (YYYY-MM-DD, inklusif).
          schema: { type: string, format: date }
        - name: grup
          in: query
          description: Mode grouping daftar.
          schema:
            type: string
            enum: [tanpa, cabang, hari, bulan, tahun]
        - name: halaman
          in: query
          description: Nomor halaman, mulai 1.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_halaman
          in: query
          description: Jumlah baris per halaman (bawaan 25, maksimum 100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Satu halaman riwayat pemesanan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminOrderPage" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/orders/{id}:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
    get:
      tags: [admin]
      operationId: getAdminOrder
      summary: Detail pesanan seluruh cabang (Manager & Superadmin)
      description: |
        Detail lengkap satu pesanan cabang mana pun (PRD AP-ORD-04): header +
        data cabang, baris pesanan beserta serial number, timeline
        (`order_events`), catatan internal (`note_admin`), dokumen, dan log
        verifikasi.

        Bukti transfer dan riwayat email TIDAK diduplikasi di sini: keduanya
        punya endpoint sendiri (`/admin/orders/{id}/proofs`,
        `/admin/orders/{id}/emails`) dengan otorisasi yang sama, dan UI
        memanggilnya terpisah sehingga satu respons tetap kecil.

        Catatan internal hanya ada di respons admin; endpoint portal cabang
        tidak pernah mengembalikannya.
      responses:
        "200":
          description: Detail pesanan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminOrderDetail" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/orders/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/OrderIdPath"
    post:
      tags: [admin]
      operationId: setAdminOrderNote
      summary: Simpan catatan internal pesanan (Manager & Superadmin)
      description: |
        Menyimpan catatan internal pesanan (PRD AP-ORD-05) dan mencatatnya di
        timeline dalam transaksi yang sama. Skema Database.md §4.4 hanya punya
        satu kolom `orders.note_admin` (sesuai prototype: satu textarea "Note
        admin"), jadi penyimpanan MENGGANTI isi catatan; riwayat siapa-kapan-apa
        hidup di `order_events`.

        Catatan internal tidak pernah muncul di portal cabang. Catatan kosong
        dijawab `400`; maksimum 2000 karakter.
      parameters:
