version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # Hanya linter standar yang dipertahankan; menambah linter eksperimental
  # pada tahap fondasi hanya akan menghasilkan derau tanpa nilai nyata.
  default: standard
  exclusions:
    generated: lax
    rules:
      # Query sqlc dibangkitkan; tidak ditulis tangan.
      - path: internal/db/sqlc
        linters: [revive, stylecheck, unused]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/grahita/portal/api

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
