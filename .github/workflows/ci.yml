name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  # Kredensial pengembangan untuk service PostgreSQL pada job "migrasi".
  # DSN dibangun lewat interpolasi ${{ }} supaya tidak ada kredensial
  # literal pada berkas terlacak (gate: scripts/check-secrets.sh).
  PG_USER: grahita
  PG_PASSWORD: grahita

jobs:
  backend:
    name: Backend (lint, vet, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: gofmt bersih
        run: |
          tidak_rapi=$(gofmt -l .)
          if [ -n "$tidak_rapi" ]; then
            echo "Berkas berikut belum diformat:"; echo "$tidak_rapi"; exit 1
          fi

      - name: golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build ./...

      - name: sqlc generate konsisten
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          "$(go env GOPATH)/bin/sqlc" generate
          if ! git diff --exit-code --stat -- internal/db/sqlc db; then
            echo "Hasil sqlc generate berbeda dengan yang ada di repo."; exit 1
          fi

      # Gerbang migrasi kompatibel mundur (Architecture.md §9): perubahan
      # destruktif pada skema yang sudah dipakai membatalkan rollback.
      - name: Migrasi kompatibel mundur
        working-directory: .
        run: ./scripts/check-migration-kompatibel.sh

  migrasi:
    name: Migrasi bersih + worker (PostgreSQL 18)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: grahita
          POSTGRES_PASSWORD: grahita
          POSTGRES_DB: grahita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grahita -d grahita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      # DSN dibangun pada env tingkat STEP (jobs.<job_id>.steps.env), tempat
      # konteks `env` memang diizinkan GitHub Actions; konteks yang sama TIDAK
      # diizinkan pada `jobs.<job_id>.env`. Lihat tabel "Context availability".
      - name: Migrasi naik pada database bersih (+ tabel River)
        env:
          DATABASE_URL: postgres://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@localhost:5432/grahita?sslmode=disable
          TEST_DATABASE_URL: postgres://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@localhost:5432/grahita?sslmode=disable
        run: go run ./cmd/server --mode=migrate

      - name: Uji migrasi naik/turun, job worker, dan auth end-to-end
        env:
          DATABASE_URL: postgres://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@localhost:5432/grahita?sslmode=disable
          TEST_DATABASE_URL: postgres://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@localhost:5432/grahita?sslmode=disable
        # -p 1: paket dijalankan berurutan karena keduanya memakai instance
        # PostgreSQL yang sama pada job ini (uji auth memakai skema sendiri,
        # tetapi ekstensi dibuat pada database yang sama).
        run: go test -p 1 -count=1 ./internal/platform/database/... ./internal/worker/... ./internal/httpapi/...

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      - name: vitest
        run: npm run test

      - name: build dua SPA
        run: npm run build

      - name: npm audit (tanpa kegagalan build)
        run: npm audit --audit-level=high || true

  kontrak:
    name: Kontrak OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint skema OpenAPI
        run: npx --yes @redocly/cli@1 lint openapi/openapi.yaml

  rahasia:
    name: Tidak ada secret di repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pindai pola rahasia
        run: ./scripts/check-secrets.sh

      - name: govulncheck (gagal bila ada kerentanan yang bisa dijangkau)
        working-directory: api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Observability: konfigurasi Prometheus harus valid DAN aturan alarm harus
  # benar-benar MENYALA pada deret waktu sintetis (simulasi alarm). Tanpa
  # langkah ini, kesalahan ekspresi/ambang hanya terlihat saat insiden nyata.
  observability:
    name: Observability (aturan alarm + simulasi)
    runs-on: ubuntu-latest
    env:
      PROM_VERSION: "3.15.0"
    steps:
      - uses: actions/checkout@v4

      - name: Pasang promtool (versi disematkan)
        run: |
          curl -sSfL -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          echo "PROMTOOL=/tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool" >> "$GITHUB_ENV"

      - name: Validasi konfigurasi Prometheus
        run: $PROMTOOL check config infra/observability/prometheus/prometheus.yml

      - name: Validasi aturan alarm (lint penuh)
        run: $PROMTOOL check rules --lint=all infra/observability/prometheus/rules/grahita-alerts.yml

      - name: Simulasi alarm (uji satuan promtool)
        working-directory: infra/observability/prometheus/tests
        run: $PROMTOOL test rules grahita-alerts_test.yml

  # Pemindaian keamanan image: build image api (dipakai api DAN worker) lalu
  # pindai paket OS + pustaka Go (Architecture.md §9: "scan (govulncheck,
  # trivy, npm audit)"). Kerentanan HIGH/CRITICAL yang sudah ada perbaikannya
  # menggagalkan build.
  keamanan-gambar:
    name: Build image + Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image api
        run: docker build -t grahita-api:ci ./api

      - name: Trivy (OS + pustaka, HIGH/CRITICAL yang dapat diperbaiki)
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: grahita-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Trivy (konfigurasi Dockerfile)
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: config
          scan-ref: api/Dockerfile
          exit-code: "1"
          severity: HIGH,CRITICAL
          # Misconfig tanpa perbaikan (mis. `:latest`) tidak menggagalkan.
          ignore-unfixed: true
