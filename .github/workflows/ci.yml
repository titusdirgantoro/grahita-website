name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, vet, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: gofmt bersih
        run: |
          tidak_rapi=$(gofmt -l .)
          if [ -n "$tidak_rapi" ]; then
            echo "Berkas berikut belum diformat:"; echo "$tidak_rapi"; exit 1
          fi

      - name: golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build ./...

      - name: sqlc generate konsisten
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          "$(go env GOPATH)/bin/sqlc" generate
          if ! git diff --exit-code --stat -- internal/db/sqlc db; then
            echo "Hasil sqlc generate berbeda dengan yang ada di repo."; exit 1
          fi

  migrasi:
    name: Migrasi bersih + worker (PostgreSQL 18)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: grahita
          POSTGRES_PASSWORD: grahita
          POSTGRES_DB: grahita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grahita -d grahita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://grahita:grahita@localhost:5432/grahita?sslmode=disable
      TEST_DATABASE_URL: postgres://grahita:grahita@localhost:5432/grahita?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Migrasi naik pada database bersih (+ tabel River)
        run: go run ./cmd/server --mode=migrate

      - name: Uji migrasi naik/turun dan job worker
        run: go test -count=1 ./internal/platform/database/... ./internal/worker/...

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      - name: vitest
        run: npm run test

      - name: build dua SPA
        run: npm run build

      - name: npm audit (tanpa kegagalan build)
        run: npm audit --audit-level=high || true

  kontrak:
    name: Kontrak OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint skema OpenAPI
        run: npx --yes @redocly/cli@1 lint openapi/openapi.yaml

  rahasia:
    name: Tidak ada secret di repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pindai pola rahasia
        run: ./scripts/check-secrets.sh

      - name: govulncheck (informasional)
        continue-on-error: true
        working-directory: api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
